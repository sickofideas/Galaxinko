  }
  #game-container {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: 56.25vh;
    max-width: 100vw;
    height: 100vh;
    max-height: 177.78vw;
  }

    position: fixed; z-index: 9999; top: 10px; left: 10px;
    max-width: 880px; width: 94vw; max-height: 92vh; overflow: auto;
    padding: 18px 22px; background: #0f1423; color: #fff;
    border: 2px solid #38bdf8; border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.92);
    display: none;
  }
  button, input {
    padding: 8px 14px; margin: 3px; border-radius: 10px;
    background: #1e293b; color: #f8fafc; border: 2px solid #38bdf8;
    font: 700 13px "Segoe UI", system-ui, sans-serif;
    cursor: pointer; transition: transform 0.12s, background 0.15s;
  }
  button:hover { background: #38bdf8; color: #090d16; transform: translateY(-1px); }
  .btn-gold { border-color: #fbbf24; background: #3b2a08; color: #fde68a; }
  .btn-gold:hover { background: #fbbf24; color: #1a1100; }
  .btn-diamond { border-color: #c084fc; background: #2d1447; color: #f3e8ff; }
  .btn-diamond:hover { background: #c084fc; color: #120421; }
  input { width: 270px; max-width: 68vw; cursor: text; }
  #volume { width: 150px; vertical-align: middle; padding: 0; border: 0; }
  #audioStatus { max-width: 720px; font-size: 13px; color: #7dd3fc; margin: 5px 0; }
  #errBox {
    position: fixed; bottom: 8px; left: 8px; z-index: 9999;
    background: #b00020; color: #fff; padding: 6px 12px; border-radius: 6px;
    font: 700 13px monospace; display: none;
  }
</style>
</head>

  function createRichAvatar(seedStr) {
    const cnv = document.createElement('canvas');
    cnv.width = cnv.height = 160;
    const g = cnv.getContext('2d');
    const h = hash(seedStr);

    const bgPalettes = [
      ['#f43f5e', '#881337'], ['#06b6d4', '#0c4a6e'], ['#8b5cf6', '#3b0764'],
      ['#f59e0b', '#78350f'], ['#10b981', '#064e3b'], ['#ec4899', '#500724'],
      ['#3b82f6', '#1e3a8a'], ['#eab308', '#713f12']
    ];
    const pal = bgPalettes[h % bgPalettes.length];
    const bgGrad = g.createLinearGradient(0, 0, 160, 160);
    bgGrad.addColorStop(0, pal[0]);
    bgGrad.addColorStop(1, pal[1]);
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, 160, 160);

    const skinTones = ['#ffedd5', '#fed7aa', '#fdba74', '#e0ac69', '#c68642', '#8d5524'];
    const hairColors = ['#18181b', '#3f2305', '#78350f', '#b45309', '#facc15', '#dc2626', '#cbd5e1'];
    const shirtColors = ['#1e293b', '#be123c', '#0369a1', '#4338ca', '#15803d', '#b45309'];

    const skin = skinTones[(h >>> 3) % skinTones.length];
    const hair = hairColors[(h >>> 6) % hairColors.length];
    const shirt = shirtColors[(h >>> 9) % shirtColors.length];

    g.fillStyle = shirt;
    g.beginPath();
    g.arc(80, 172, 62, Math.PI, Math.PI * 2);
    g.fill();

    g.fillStyle = skin;
    g.fillRect(66, 92, 28, 28);

    const hairStyle = (h >>> 12) % 4;
    if (hairStyle === 1 || hairStyle === 3) {
      g.fillStyle = hair;
      g.beginPath();
      g.arc(80, 68, 44, 0, Math.PI * 2);
      g.fill();
    }

    g.fillStyle = skin;
    g.beginPath();
    g.arc(80, 68, 36, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = hair;
    g.beginPath();
    if (hairStyle === 0) {
      g.arc(80, 58, 37, Math.PI * 0.95, Math.PI * 2.05);
    } else if (hairStyle === 1) {
      g.arc(80, 54, 38, Math.PI * 0.85, Math.PI * 2.15);
    } else if (hairStyle === 2) {
      g.arc(72, 52, 36, Math.PI * 0.9, Math.PI * 2.0);
    } else {
      g.arc(80, 55, 38, Math.PI, Math.PI * 2);
    }
    g.fill();

    const hasShades = (h % 7) === 0;
    if (hasShades) {
      g.fillStyle = '#090d16';
      g.fillRect(54, 58, 22, 13);
      g.fillRect(84, 58, 22, 13);
      g.lineWidth = 4;
      g.strokeStyle = '#090d16';
      g.beginPath();
      g.moveTo(46, 62); g.lineTo(114, 62);
      g.stroke();
    } else {
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.arc(66, 65, 6.5, 0, Math.PI * 2);
      g.arc(94, 65, 6.5, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#0f172a';
      g.beginPath();
      g.arc(67, 65, 3.8, 0, Math.PI * 2);
      g.arc(95, 65, 3.8, 0, Math.PI * 2);
      g.fill();
    }

    g.strokeStyle = '#7c2d12';
    g.lineWidth = 3.5;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(80, 76, 11, 0.15 * Math.PI, 0.85 * Math.PI);
    g.stroke();

    return cnv;
  }

  function avatarUrl(d) {
    const u = d.user || d;
    const owners = [u, d, u && u.userDetails, d && d.userDetails];
    const keys = ['profilePictureUrl', 'profilePictureUrls', 'avatarThumb', 'avatarMedium', 'avatarLarger', 'avatarUrl', 'avatar'];
    for (let o = 0; o < owners.length; o++) {
      const owner = owners[o];
      if (!owner) continue;
      for (let k = 0; k < keys.length; k++) {
        const raw = owner[keys[k]];
        const values = typeof raw === 'string' ? [raw] : Array.isArray(raw) ? raw : (raw && (raw.urlList || raw.url_list || [raw.url]));
        if (!values) continue;
        for (let i = 0; i < values.length; i++) {
          const val = values[i];
          if (typeof val === 'string' && val.length < 4096) {
            try {
              const parsed = new URL(val);
              if (parsed.protocol === 'https:' && !parsed.username && !parsed.password) return parsed.href;
            } catch (e) {}
          }
        }
      }
    }
    return '';
  }

  function packet(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const type = String(raw.event || raw.type || '').toLowerCase();
    if (type === 'streamend') return { type: 'streamend' };
    const d = raw.data;
    if (!d || typeof d !== 'object' || ['member', 'roomuser', 'chat', 'like', 'gift', 'share', 'follow', 'subscribe'].indexOf(type) === -1) return null;
    const u = d.user || d;
    const g = d.giftDetails || d.extendedGiftInfo || d.gift || {};
    let id = u.uniqueId !== undefined ? u.uniqueId : (u.unique_id !== undefined ? u.unique_id : (d.uniqueId !== undefined ? d.uniqueId : (d.unique_id !== undefined ? d.unique_id : (u.userId !== undefined ? u.userId : (u.id !== undefined ? u.id : d.userId)))));
    if (id == null || !String(id).length || String(id).length > 180) return null;
    const repeat = Math.floor(clamp(num(d.repeatCount, 1), 1, 1000000));
    const gType = num(d.giftType !== undefined ? d.giftType : (g.giftType !== undefined ? g.giftType : g.type));
    if (type === 'gift' && gType === 1 && d.repeatEnd !== true && d.repeatEnd !== 1 && d.repeatEnd !== 'true') return null;
    const msgId = d.msgId !== undefined ? d.msgId : (d.common && d.common.msgId);
    const unitCoins = d.diamondCount !== undefined ? d.diamondCount : (g.diamondCount !== undefined ? g.diamondCount : g.diamond_count);
    const coins = unitCoins == null ? num(d.coins !== undefined ? d.coins : g.coins) : num(unitCoins) * repeat;
    const giftName = clean(d.giftName || g.giftName || g.name || 'Gift');
    return {
      type: type === 'roomuser' ? 'member' : type,
      id: String(id),
      userId: String(u.userId || u.id || d.userId || ''),
      name: clean(u.nickname || d.nickname || id),
      avatar: avatarUrl(d),
      text: String(d.comment !== undefined ? d.comment : (d.text || '')).slice(0, 160),

      giftName: giftName,
      eventId: msgId == null ? '' : type + ':' + msgId + (type === 'gift' ? ':' + repeat : '')
    };
  }

  const SFX_CHORD = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
  let sound = true, ttsEnabled = true, autoCrowdEnabled = true, audioCtx = null, soundEvents = 0, soundLevel = 0.95;
  try {

  let lastSpokenAt = 0;
  let cachedVoice = null;

  function pickHumanVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || !voices.length) return null;
    const preferred = [
      /Natural/i, /Online/i, /Aria/i, /Guy/i, /Jenny/i, /Google US English/i, /Samantha/i, /Siri/i
    ];
    const enVoices = voices.filter(v => /^en[-_](US|GB|CA|AU)/i.test(v.lang) || /^en/i.test(v.lang));
    for (let i = 0; i < preferred.length; i++) {
      const match = enVoices.find(v => preferred[i].test(v.name));
      if (match) return match;
    }
    return enVoices[0] || voices[0];
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickHumanVoice(); };
  }

  function formatSpokenWord(w) {
    return String(w || '').toLowerCase()
      .replace('gta 6', 'G T A six')
      .replace('ps5', 'P S five')
      .replace('100k', 'one hundred K')
      .replace('1m', 'one million');
  }

  function speakTTS(text, priority) {
    if (!ttsEnabled || !sound || soundLevel === 0) return;
    if (!('speechSynthesis' in window)) return;
    const now = performance.now();
    if (!priority && now - lastSpokenAt < 3200) return;
    try {
      if (priority) window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(String(text));
      if (!cachedVoice) cachedVoice = pickHumanVoice();
      if (cachedVoice) utter.voice = cachedVoice;
      utter.lang = 'en-US';
      utter.rate = 0.99 + (Math.random() - 0.5) * 0.04;
      utter.pitch = 0.99 + (Math.random() - 0.5) * 0.04;
      utter.volume = clamp(soundLevel, 0, 1);
      window.speechSynthesis.speak(utter);
      lastSpokenAt = now;
    } catch (e) {}
  }

  const sfxMix = {
    input: null, master: null, voices: new Set(), limit: 14,
    resumeAt: -Infinity, error: '', uiKey: '', last: new Map()

  function updateSoundUI() {
    const available = !!(window.AudioContext || window.webkitAudioContext);
    const running = audioCtx && audioCtx.state === 'running';
    const muted = soundLevel === 0;
    const key = [available, sound, ttsEnabled, autoCrowdEnabled, audioCtx && audioCtx.state, soundLevel, sfxMix.error].join('|');
    if (key === sfxMix.uiKey) return;
    sfxMix.uiKey = key;
    const button = $('sfx');
    if (button) button.textContent = !available ? 'AUDIO UNAVAILABLE' : !sound ? 'SOUND OFF' : muted ? 'SOUND MUTED' : 'SOUND ON';
    const ttsBtn = $('ttsBtn');
    if (ttsBtn) ttsBtn.textContent = ttsEnabled ? 'VOICE TTS: ON' : 'VOICE TTS: OFF';
    const botBtn = $('botBtn');
    if (botBtn) botBtn.textContent = autoCrowdEnabled ? 'AUTO CROWD: ON' : 'AUTO CROWD: OFF';
    const volume = $('volume');
    if (volume) volume.value = String(Math.round(soundLevel * 100));
    const value = $('volumeValue');
    if (value) value.textContent = Math.round(soundLevel * 100) + '%';
    const info = $('audioStatus');
    if (info) info.textContent = !available ? 'Web Audio unavailable.' : !sound ? 'Sound is off.' : running ? 'Audio & Natural Voice active.' : 'Sound & TTS ready (click once in Chrome to unlock).';
  }

  function applySoundLevel() {
    if (sfxMix.master && audioCtx) {
      const at = audioCtx.currentTime;
      sfxMix.master.gain.cancelScheduledValues(at);
      sfxMix.master.gain.setTargetAtTime(sound && soundLevel > 0 ? soundLevel : 0.0001, at, 0.02);
    }
    updateSoundUI();
  }

  function setSoundLevel(val) {
    soundLevel = clamp(num(val, 0.85), 0, 1);
    try { localStorage.setItem('galaxinko-sfx-volume', String(soundLevel)); } catch (e) {}
    applySoundLevel();
  }

  function unlockAudio(gesture) {
    if (!sound) { updateSoundUI(); return Promise.resolve(false); }
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) { updateSoundUI(); return Promise.resolve(false); }
    try {
      if (!audioCtx) {
        audioCtx = new Audio();
        const filter = audioCtx.createBiquadFilter();
        const compressor = audioCtx.createDynamicsCompressor();
        const master = audioCtx.createGain();
        filter.type = 'lowpass'; filter.frequency.value = 3800; filter.Q.value = 0.7;
        compressor.threshold.value = -16; compressor.knee.value = 10; compressor.ratio.value = 3.5;
        compressor.attack.value = 0.004; compressor.release.value = 0.15;
        master.gain.value = soundLevel;
        filter.connect(compressor); compressor.connect(master); master.connect(audioCtx.destination);
        sfxMix.input = filter; sfxMix.master = master;
        audioCtx.onstatechange = updateSoundUI;
      }
      if (audioCtx.state === 'running') { sfxMix.error = ''; updateSoundUI(); return Promise.resolve(true); }
      const t = performance.now();
      if (audioCtx.state === 'closed' || (!gesture && t - sfxMix.resumeAt < 350)) { updateSoundUI(); return Promise.resolve(false); }
      sfxMix.resumeAt = t;
      updateSoundUI();
      return Promise.resolve(audioCtx.resume()).then(() => {
        sfxMix.error = ''; updateSoundUI();
        if (gesture && audioCtx.state === 'running') {
          sfxTone(523.25, 0.14, 0.16, 0, 'triangle', 0, 1.25);
        }
        return audioCtx.state === 'running';
      }, () => { updateSoundUI(); return false; });
    } catch (e) {
      updateSoundUI(); return Promise.resolve(false);
    }
  }

  function sfxTone(freq, duration, volume, panVal, wave, delay, endRatio) {
    if (!sound) return false;
    if (!audioCtx || audioCtx.state !== 'running') unlockAudio(false);
    if (!audioCtx || audioCtx.state !== 'running' || !sfxMix.input || sfxMix.voices.size >= sfxMix.limit) return false;
    try {
      const at = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      const voice = { osc: osc, gain: gain };
      osc.type = wave || 'sine';
      osc.frequency.setValueAtTime(freq, at);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * (endRatio || 1)), at + duration);
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(volume, at + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
      osc.connect(gain);
      if (pan) { pan.pan.value = clamp(panVal || 0, -1, 1); gain.connect(pan); pan.connect(sfxMix.input); }
      else gain.connect(sfxMix.input);
      sfxMix.voices.add(voice);
      osc.onended = () => { sfxMix.voices.delete(voice); osc.disconnect(); gain.disconnect(); if (pan) pan.disconnect(); };
      osc.start(at); osc.stop(at + duration + 0.02);
      soundEvents++;
      return true;
    } catch (e) { return false; }
  }

  function playSfx(kind, side, tier) {
    const t = performance.now();
    const cd = { vote: 55, bounce: 65, bumper: 55, kick: 70, like: 75, crown: 450, shred: 500, forge: 95, gift: 280, win: 600 }[kind] || 65;
    const prev = sfxMix.last.has(kind) ? sfxMix.last.get(kind) : -Infinity;
    if (t - prev < cd) return;
    sfxMix.last.set(kind, t);
    const pan = side === 'A' ? -0.25 : side === 'B' ? 0.25 : 0;

    if (kind === 'vote') {
      const base = side === 'A' ? 320 : 390;
      sfxTone(base, 0.12, 0.15, pan, 'triangle', 0, 1.55);
    } else if (kind === 'bumper') {
      const note = SFX_CHORD[Math.floor(Math.random() * SFX_CHORD.length)] * 1.5;
      sfxTone(note, 0.11, 0.14, pan, 'triangle', 0, 1.04);
    } else if (kind === 'kick') {
      sfxTone(220, 0.11, 0.18, pan, 'triangle', 0, 1.65);
    } else if (kind === 'bounce') {
      sfxTone(170 + Math.random() * 60, 0.07, 0.08, pan, 'triangle', 0, 0.82);
    } else if (kind === 'like') {
      sfxTone(420 + Math.random() * 110, 0.10, 0.13, pan, 'triangle', 0, 1.35);
    } else if (kind === 'crown') {
      [0, 2, 4].forEach((n, i) => sfxTone(SFX_CHORD[n] * 1.5, 0.20, 0.14, pan, 'triangle', i * 0.06, 1.02));
    } else if (kind === 'shred') {
      sfxTone(125, 0.55, 0.22, pan, 'sawtooth', 0, 0.42);
      sfxTone(75, 0.65, 0.20, 0, 'triangle', 0.04, 0.5);
    } else if (kind === 'forge') {
      const note = SFX_CHORD[Math.floor(Math.random() * SFX_CHORD.length)] * (1.5 + Math.random() * 0.5);
      sfxTone(note, 0.14, 0.09, (Math.random() - 0.5) * 0.4, 'sine', 0, 1.25);
    } else if (kind === 'gift') {
      const gt = tier || 1;
      const notes = gt >= 3 ? [0, 2, 3, 5] : [0, 2, 4];
      notes.forEach((n, i) => sfxTone(SFX_CHORD[n] * 2, 0.34, 0.18, 0, 'triangle', i * 0.07, 1.02));
    } else if (kind === 'win') {
      [0, 2, 3, 5].forEach((n, i) => sfxTone(SFX_CHORD[n] * 2, 0.38, 0.17, 0, 'triangle', i * 0.085, 1.0));
    }
  }

  function testSound() {
    sound = true;
    if (soundLevel === 0) setSoundLevel(0.85);
    applySoundLevel();
    return unlockAudio(true).then(ready => {
      if (!ready) return false;
      playSfx('win');
      speakTTS('Audio and voice commentary are working!', true);
      return true;
    });
  }

  function toggleSound() {
    if (!sound || soundLevel === 0) {
      sound = true; applySoundLevel(); return testSound();
    }
    sound = false; applySoundLevel(); return Promise.resolve(false);
  }

  const pics = new Map();
  let portraitJobs = 0;

  function requestPic(url) {
    if (!url || pics.has(url) || pics.size >= MAX) return;
    pics.set(url, { state: 'waiting' });
    pumpPics();
  }

  function pumpPics() {
    pics.forEach((entry, u) => {
      if (portraitJobs >= 4 || entry.state !== 'waiting') return;
      entry.state = 'loading';
      portraitJobs++;
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.referrerPolicy = 'no-referrer';
      let done = false;
      const finish = ok => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        img.onload = img.onerror = null;
        if (ok && img.naturalWidth) {
          const thumb = document.createElement('canvas');
          thumb.width = thumb.height = 180;
          const g = thumb.getContext('2d');
          const side = Math.min(img.naturalWidth, img.naturalHeight);
          g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 180, 180);
          entry.img = thumb;
          entry.state = 'ready';
        } else {
          entry.state = 'failed';
        }
        portraitJobs--;
        pumpPics();
      };
      const timer = setTimeout(() => finish(false), 7500);
      img.onload = () => finish(true);
      img.onerror = () => finish(false);
      img.src = u;
    });
  }

  function getPlayerImage(p) {
    const picEntry = p.avatar ? pics.get(p.avatar) : null;
    if (picEntry && picEntry.state === 'ready') return picEntry.img;
    if (!p.fallbackCanvas) {
      p.fallbackCanvas = createRichAvatar(p.name || p.id);
    }
    return p.fallbackCanvas;
  }

  const SHRED_DURATION = 4.0;
  const FORGE_DURATION = 6.8;

  class ClashForgeGame {
    constructor() {
      this.players = new Map();
      this.aliases = new Map();
      this.seen = new Map();
      this.balls = [];
      this.chips = [];
      this.shockwaves = [];
      this.popups = [];

      this.hallOfFame = [

        { id: 'hof_4', name: 'emma.tt', avatar: '', side: 'B', tier: 0, streak: 1 }
      ];
      this.bumpers = [];
      this.titanPoses = { A: null, B: null };
      this.qIndex = -1;
      this.question = QUESTIONS[0];
      this.phase = 'VOTE';
      this.roundDuration = 60;
      this.timer = 60;
      this.forgeProgress = 0;
      this.colorReveal = 0;
      this.forgeSlide = 0;
      this.trapdoorAngle = 0;
      this.crusherY = 0;
      this.splitX = 540;
      this.targetSplitX = 540;
      this.shovePulseA = 0;
      this.shovePulseB = 0;
      this.loseTitanY = 0;
      this.loseTitanVy = 0;
      this.loseTitanRot = 0;
      this.loseTitanShredded = false;
      this.forgeTier = 0;
      this.mvp = null;
      this.leaderA = null;
      this.leaderB = null;
      this.winningSide = 'A';
      this.sawAngle = 0;
      this.shake = 0;
      this.banner = null;
      this.round = 0;
      this.lastSpokenCountdown = 6;
      this.nextBotAt = 1.0;
      this.nextBotLikeAt = 2.5;
      this.usedBotHandles = new Set();
      this.nextRound();
    }

    getChamberBox(side) {
      if (side === 'A') {
        return { left: ARENA_LEFT, right: Math.round(this.splitX - GAP_HALF), top: ARENA_TOP, bottom: ARENA_BOTTOM };
      }
      return { left: Math.round(this.splitX + GAP_HALF), right: ARENA_RIGHT, top: ARENA_TOP, bottom: ARENA_BOTTOM };
    }

    getRealPlayerCount() {
      let real = 0;
      for (let i = 0; i < this.balls.length; i++) {
        if (!this.balls[i].isBot && !this.balls[i].isClone) real++;
      }
      return real;
    }

    getTargetBotCrowd() {
      if (!autoCrowdEnabled) return 0;
      const real = this.getRealPlayerCount();
      if (real >= 14) return 0;
      if (real >= 8) return 4;
      if (real >= 4) return 9;
      if (real >= 1) return 14;
      return 18;
    }

    getCrowdScale(side) {
      let count = 0;
      for (let i = 0; i < this.balls.length; i++) {
        if (this.balls[i].side === side) count++;
      }
      if (count <= 6) return 1.0;
      return clamp(Math.pow(6 / count, 0.28), 0.52, 1.0);
    }

    updateBumpers() {
      const boxA = this.getChamberBox('A');
      const boxB = this.getChamberBox('B');
      const cxA = (boxA.left + boxA.right) / 2;
      const cxB = (boxB.left + boxB.right) / 2;
      const spreadA = Math.min(95, (boxA.right - boxA.left) * 0.24);
      const spreadB = Math.min(95, (boxB.right - boxB.left) * 0.24);

      if (this.bumpers.length !== 4) {
        this.bumpers = [
          { side: 'A', x: cxA - spreadA, y: 665, r: 19, hitAt: -999, color: TEAM_A },
          { side: 'A', x: cxA + spreadA, y: 665, r: 19, hitAt: -999, color: GOLD },
          { side: 'B', x: cxB - spreadB, y: 665, r: 19, hitAt: -999, color: GOLD },
          { side: 'B', x: cxB + spreadB, y: 665, r: 19, hitAt: -999, color: TEAM_B }
        ];
      } else {
        this.bumpers[0].x = cxA - spreadA;
        this.bumpers[1].x = cxA + spreadA;
        this.bumpers[2].x = cxB - spreadB;
        this.bumpers[3].x = cxB + spreadB;
      }
    }

    computeTitanPose(side, now, pct) {
      const isLeft = side === 'A';
      const dir = isLeft ? 1 : -1;
      const box = this.getChamberBox(side);
      const shove = isLeft ? this.shovePulseA : this.shovePulseB;
      const isWinning = pct >= 50;
      const isShredLoser = this.phase === 'SHRED' && this.winningSide !== side;
      const isShredWinner = this.phase === 'SHRED' && this.winningSide === side;

      const stepPhase = now * 0.0105 + (isLeft ? 0 : Math.PI);
      // Visual bobbing is kept smooth, while physics colliders use stable un-bobbed anchors so balls never vibrate!
      const bobY = isShredLoser ? 0 : Math.sin(stepPhase * 2) * (6 + shove * 8);
      const pushLean = (isWinning ? 26 : 8) + shove * 22;

      const fallOffsetY = isShredLoser ? this.loseTitanY : 0;
      const rot = isShredLoser ? this.loseTitanRot : 0;

      const baseHandX = this.splitX - dir * 24;
      const baseHandY = 985 + Math.sin(now * 0.016) * 10;

      let shoulderX = this.splitX - dir * (155 + (isWinning ? 12 : -12) - shove * 22);
      if (isLeft) shoulderX = clamp(shoulderX, box.left + 95, box.right - 70);
      else shoulderX = clamp(shoulderX, box.left + 70, box.right - 95);

      let baseShoulderY = 945 + fallOffsetY;
      if (isShredLoser) {
        const pressBottomY = lerp(box.top + 80, box.bottom - 35, this.crusherY);
        if (baseShoulderY - 125 < pressBottomY) {
          const pushDown = pressBottomY - (baseShoulderY - 125);
          baseShoulderY += pushDown;
          this.loseTitanY = Math.max(this.loseTitanY, fallOffsetY + pushDown);
        }
      }

      const shoulderY = baseShoulderY + bobY;
      const hipX = shoulderX - dir * (44 + pushLean * 0.6);
      const hipY = shoulderY + 230;
      const baseHipY = baseShoulderY + 230;

      const handX = isShredWinner ? (shoulderX + dir * 45) : (isShredLoser ? (shoulderX + dir * 70) : baseHandX);
      const handY = isShredWinner ? (shoulderY - 145 + Math.sin(now * 0.025) * 14) : (isShredLoser ? (shoulderY - 95) : baseHandY);

      const frontKick = Math.sin(stepPhase);
      const backKick = Math.cos(stepPhase);
      const frontFootX = clamp(hipX + dir * (65 + frontKick * 58), box.left + 36, box.right - 36);
      const frontFootY = (isShredLoser ? (hipY + 235) : (1424 - Math.max(0, frontKick) * 42));
      const backFootX = clamp(hipX - dir * (78 + backKick * 54), box.left + 36, box.right - 36);
      const backFootY = (isShredLoser ? (hipY + 245) : (1430 - Math.max(0, -frontKick) * 36));

      const frontKneeX = (hipX + frontFootX) / 2 + dir * 28;
      const frontKneeY = (hipY + frontFootY) / 2 - 24;
      const backKneeX = (hipX + backFootX) / 2 + dir * 14;
      const backKneeY = (hipY + backFootY) / 2 - 16;

      const headX = shoulderX + dir * 18;
      const headY = shoulderY - 86;
      const baseHeadY = baseShoulderY - 86;
      const chestX = (shoulderX + hipX) / 2;
      const chestY = (shoulderY + hipY) / 2 - 12;
      const baseChestY = (baseShoulderY + baseHipY) / 2 - 12;

      const footVx = Math.cos(stepPhase) * dir * 560;
      const backFootVx = -Math.sin(stepPhase) * dir * 520;

      // Colliders use non-bobbing Y coordinates for upper body + outward slide deflection so balls never jitter on the head!
      const colliders = isShredLoser && this.loseTitanY > 420 ? [] : [
        { x: headX, y: baseHeadY, r: 52, vx: -dir * 240, vy: -220, isFoot: false, isUpper: true },
        { x: chestX, y: baseChestY, r: 58, vx: -dir * 200, vy: -120, isFoot: false, isUpper: true },
        { x: hipX, y: baseHipY, r: 48, vx: -dir * 180, vy: -100, isFoot: false, isUpper: false },
        { x: frontKneeX, y: frontKneeY, r: 32, vx: footVx * 0.6, vy: -240, isFoot: true, isUpper: false },
        { x: frontFootX, y: frontFootY, r: 38, vx: footVx, vy: -520, isFoot: true, isUpper: false },
        { x: backKneeX, y: backKneeY, r: 30, vx: backFootVx * 0.6, vy: -220, isFoot: true, isUpper: false },
        { x: backFootX, y: backFootY, r: 36, vx: backFootVx, vy: -480, isFoot: true, isUpper: false }
      ];

      return {
        side, isLeft, dir, pct, shove, isWinning, isShredLoser, isShredWinner,
        shoulderX, shoulderY, hipX, hipY, handX, handY,
        frontFootX, frontFootY, backFootX, backFootY,
        frontKneeX, frontKneeY, backKneeX, backKneeY,
        headX, headY, chestX, chestY, rot, stepPhase,
        colliders
      };
    }

    nextRound() {
      this.round++;
      this.qIndex = (this.qIndex + 1 + Math.floor(Math.random() * 3)) % QUESTIONS.length;
      this.question = QUESTIONS[this.qIndex];
      this.phase = 'VOTE';
      this.roundDuration = 45 + Math.floor(Math.random() * 71);

      this.loseTitanY = 0;

      this.players.forEach(p => {
        p.side = null;

      });

      const aWord = formatSpokenWord(this.question.a);
      const bWord = formatSpokenWord(this.question.b);
      const prompts = [
        aWord + ' versus ' + bWord + '! Type A or B in chat to help your side push!',
        'New clash! ' + aWord + ' or ' + bWord + '? Comment A or B to drop your ball!',
        'Who wins the push, ' + aWord + ' or ' + bWord + '? Type A or B now!'
      ];
      speakTTS(prompts[this.round % prompts.length], false);

      if (this.nextRoundQueue.length > 0) {
        const queued = this.nextRoundQueue.slice(0, 40);
        this.nextRoundQueue = [];
        queued.forEach(item => {
          const p = this.players.get(item.playerId);
          if (p) {
            p.roundScore += 35;
            this.castVote(p, item.side, true);
          }

    }

    addPopup(x, y, text, color, size) {
      if (this.popups.length > 35) this.popups.shift();
      this.popups.push({ x: x, y: y, text: text, color: color || WHITE, size: size || 24, life: 1.0 });
    }

    addShockwave(x, y, maxR, color) {
      if (this.shockwaves.length > 28) this.shockwaves.shift();
      this.shockwaves.push({ x: x, y: y, r: 12, maxR: maxR || 95, color: color || WHITE, life: 1.0 });
    }

    addLaserBeam(fromX, fromY, toX, toY, color, label) {
      if (this.laserBeams.length > 14) this.laserBeams.shift();
      this.laserBeams.push({ fromX: fromX, fromY: fromY, toX: toX, toY: toY, color: color, label: label, life: 1.0 });
    }

    updateChamberLeaders() {
      let bestA = null, maxA = -1;
      let bestB = null, maxB = -1;

      let hasRealA = false, hasRealB = false;
      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (!b.isBot && !b.isClone) {
          if (b.side === 'A') hasRealA = true;
          if (b.side === 'B') hasRealB = true;
        }
      }

      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (b.isClone) continue;
        if (b.side === 'A' && hasRealA && b.isBot) continue;
        if (b.side === 'B' && hasRealB && b.isBot) continue;
        const p = this.players.get(b.playerId);
        const score = p ? p.roundScore : (b.botScore || 10);
        if (b.side === 'A' && score > maxA) {
          maxA = score;
          bestA = b.playerId;
        } else if (b.side === 'B' && score > maxB) {
          maxB = score;
          bestB = b.playerId;
        }
      }

      this.leaderA = bestA;
      this.leaderB = bestB;
    }

    getPlayer(id, userId) {
      const sId = String(id);
      const sUid = userId ? String(userId) : '';
      const key = this.aliases.get(sId) || (sUid && this.aliases.get(sUid)) || sId;
      return this.players.get(key);
    }

    ensurePlayer(e) {
      let p = this.getPlayer(e.id, e.userId);
      if (!p) {
        if (this.players.size >= MAX) {
          const firstKey = this.players.keys().next().value;
          this.players.delete(firstKey);
        }
        p = {
          id: String(e.id),
          name: clean(e.name || e.id),
          avatar: e.avatar || '',
          side: null,
          roundLikes: 0,
          roundGifts: 0,
          roundScore: 0,
          giftTier: 0,
          winStreak: 0,
          isBot: !!e.isBot,
          lastShareAt: -Infinity
        };
        this.players.set(p.id, p);
      }
      if (e.name) p.name = clean(e.name);
      if (e.avatar) { p.avatar = e.avatar; requestPic(p.avatar); }
      [e.id, e.userId].forEach(alias => {
        if (alias && String(alias) !== p.id && this.aliases.size < MAX * 3) {
          this.aliases.set(String(alias), p.id);
        }
      });
      return p;
    }

    spawnRandomBotVoter() {
      if (this.phase !== 'VOTE') return;
      const available = BOT_HANDLES.filter(h => !this.usedBotHandles.has(h));
      if (!available.length) return;
      const handle = available[Math.floor(Math.random() * available.length)];
      this.usedBotHandles.add(handle);

      const countA = this.balls.filter(b => b.side === 'A').length;
      const countB = this.balls.filter(b => b.side === 'B').length;
      let side = Math.random() < 0.5 ? 'A' : 'B';
      if (Math.abs(countA - countB) >= 4) {
        side = countA < countB ? (Math.random() < 0.72 ? 'A' : 'B') : (Math.random() < 0.72 ? 'B' : 'A');
      }

      const botPlayer = this.ensurePlayer({
        id: 'bot_' + handle,
        name: handle,
        avatar: '',
        isBot: true
      });
      botPlayer.side = side;
      botPlayer.roundScore = 10 + Math.floor(Math.random() * 15);
      this.spawnBall(botPlayer, side, 0, false, true);
    }

    spawnBall(p, side, bonusRadius, isClone, isBot) {
      if (this.balls.length >= 160) return;
      const box = this.getChamberBox(side);
      const defaultBase = isClone ? 38 : (isBot ? 52 : 62);
      const baseR = clamp(defaultBase + (bonusRadius || 0), 36, 110);
      const rScaled = baseR * this.getCrowdScale(side);
      // Spawn across the outer/middle 75% of the chamber so balls don't drop straight into the narrow gap behind the Titan's head
      const usableW = Math.max(40, (box.right - box.left) - (rScaled + 20) * 2);
      const randFrac = side === 'A' ? (Math.random() * 0.78) : (0.22 + Math.random() * 0.78);
      const x = box.left + rScaled + 20 + randFrac * usableW;
      const y = box.top + 48 + (isClone ? Math.random() * 35 : 0);
      const b = {
        playerId: p.id,
        name: p.name,
        side: side,
        x: x, y: y,
        vx: (Math.random() - 0.5) * 360,
        vy: 140 + Math.random() * 140,
        r: rScaled * 0.5,
        baseR: baseR,
        angle: (Math.random() - 0.5) * 0.5,
        omega: (Math.random() - 0.5) * 5,
        squashX: 1.22,
        squashY: 0.78,
        likeGlowUntil: isBot ? 0 : (performance.now() + 1800),
        lastKickAt: 0,
        trail: [],
        giftTier: p.giftTier || 0,
        isBot: !!isBot,
        botScore: p.roundScore || 12,
        isClone: !!isClone,
        shredded: false
      };
      this.balls.push(b);

      if (side === 'A') this.shovePulseA = 1.0;
      else this.shovePulseB = 1.0;

      this.addShockwave(x, y, 85, side === 'A' ? TEAM_A : TEAM_B);
      this.addShockwave(this.splitX, 980, 110, side === 'A' ? TEAM_A : TEAM_B);

      if (!isClone) {
        this.addPopup(x, y - 30, (isBot ? '+1 ' : '★ ') + p.name, side === 'A' ? TEAM_A_GLOW : TEAM_B_GLOW, isBot ? 20 : 26);
        playSfx('vote', side);
      }
      this.updateChamberLeaders();
    }

    queueForNextRound(p, side) {
      let existing = null;
      for (let i = 0; i < this.nextRoundQueue.length; i++) {
        if (this.nextRoundQueue[i].playerId === p.id) { existing = this.nextRoundQueue[i]; break; }
      }
      if (existing) {
        existing.side = side;
      } else if (this.nextRoundQueue.length < 40) {
        this.nextRoundQueue.push({ playerId: p.id, name: p.name, side: side });
      }
      const fromX = side === 'A' ? 200 : 880;
      this.addLaserBeam(fromX, 1360, 540, 710, side === 'A' ? TEAM_A : TEAM_B, p.name + ' [' + side + ']');
      if (this.phase === 'FORGE') {
        this.forgeProgress = clamp(this.forgeProgress + 0.03, 0, 1);
      }
      playSfx('vote', side);
    }

    castVote(p, side, fromQueue) {
      if (this.phase !== 'VOTE') {
        this.queueForNextRound(p, side);
        return;
      }
      let existingBall = null;
      for (let i = 0; i < this.balls.length; i++) {
        if (this.balls[i].playerId === p.id && !this.balls[i].isClone) {
          existingBall = this.balls[i];
          break;
        }
      }
      p.side = side;
      p.isBot = false;
      p.roundScore += fromQueue ? 120 : 100;
      if (side === 'A') this.shovePulseA = 1.0;
      else this.shovePulseB = 1.0;

      if (existingBall) {
        existingBall.isBot = false;
        if (existingBall.side !== side) {
          const box = this.getChamberBox(side);
          existingBall.side = side;
          existingBall.x = (box.left + box.right) / 2 + (Math.random() - 0.5) * 90;
          existingBall.y = box.top + 48;
          existingBall.vx = (Math.random() - 0.5) * 300;
          existingBall.vy = 120;
          existingBall.squashX = 1.24;
          existingBall.squashY = 0.76;
        } else {
          existingBall.baseR = Math.min(108, existingBall.baseR + 6);
          existingBall.vy = -640 - Math.random() * 160;
          existingBall.vx += (Math.random() - 0.5) * 340;
          existingBall.omega = (Math.random() - 0.5) * 10;
          existingBall.squashX = 0.76;
          existingBall.squashY = 1.26;
          this.addShockwave(existingBall.x, existingBall.y, 90, side === 'A' ? TEAM_A : TEAM_B);
        }
        playSfx('vote', side);
        this.updateChamberLeaders();
      } else {
        const tierInfo = GIFT_TIERS[p.giftTier || 0];
        this.spawnBall(p, side, tierInfo.ballBonusR, false, false);
      }
    }

    accept(e) {
      if (!e) return false;
      const now = performance.now();
      if (e.eventId) {
        if (this.seen.has(e.eventId)) return false;
        this.seen.set(e.eventId, now);
        if (this.seen.size > 8000) this.seen.delete(this.seen.keys().next().value);
      }

      const p = this.ensurePlayer(e);

      if (e.type === 'member') {
        if (this.phase === 'VOTE' && !p.side) {
          const countA = this.balls.filter(b => b.side === 'A').length;
          const countB = this.balls.filter(b => b.side === 'B').length;
          this.castVote(p, countA <= countB ? 'A' : 'B', false);
        }
        return true;
      }

      if (e.type === 'chat') {
        const msg = String(e.text || '').trim().toUpperCase();
        const countA = this.balls.filter(b => b.side === 'A').length;
        const countB = this.balls.filter(b => b.side === 'B').length;
        const defaultSide = p.side || (countA <= countB ? 'A' : 'B');
        if (msg === 'A' || msg === '1' || msg.indexOf('A ') === 0 || msg === this.question.a) {
          this.castVote(p, 'A', false);
        } else if (msg === 'B' || msg === '2' || msg.indexOf('B ') === 0 || msg === this.question.b) {
          this.castVote(p, 'B', false);
        } else {
          this.castVote(p, defaultSide, false);
        }
        return true;
      }

      if (e.type === 'like') {
        const count = clamp(e.count || 1, 1, 200);
        p.roundLikes += count;
        p.roundScore += count * 12;
        if (this.phase === 'VOTE') {
          if (!p.side) {
            const countA = this.balls.filter(b => b.side === 'A').length;
            const countB = this.balls.filter(b => b.side === 'B').length;
            this.castVote(p, countA <= countB ? 'A' : 'B', false);
          }
          if (p.side === 'A') this.shovePulseA = 1.0;
          else this.shovePulseB = 1.0;

          for (let i = 0; i < this.balls.length; i++) {
            const b = this.balls[i];
            if (b.playerId === p.id && !b.isClone) {
              const tierBonus = GIFT_TIERS[p.giftTier || 0].ballBonusR;
              b.baseR = clamp(62 + tierBonus + Math.pow(p.roundLikes, 0.58) * 5.5, 62, 110);
              b.likeGlowUntil = now + 2400;
              b.vy = -560 - Math.random() * 200;
              b.vx += (Math.random() - 0.5) * 340;
              b.omega = (Math.random() - 0.5) * 12;
              b.squashX = 0.74;
              b.squashY = 1.28;
              this.addShockwave(b.x, b.y, b.r + 55, GOLD);
              this.addPopup(b.x, b.y - b.r, '♥ +' + count + ' PUSH!', GOLD_HOT, 26);
            }
          }
          this.addShockwave(this.splitX, 980, 130, GOLD);
          this.updateChamberLeaders();
          playSfx('like', p.side || 'A');
        } else if (this.phase === 'FORGE') {
          this.forgeProgress = clamp(this.forgeProgress + count * 0.008, 0, 1);
          this.addLaserBeam(540 + (Math.random() - 0.5) * 500, 1360, 540, 710, GOLD, '♥ ' + p.name);
          playSfx('like', 'A');
        }
        return true;
      }

      if (e.type === 'share' || e.type === 'follow') {
        if (now - p.lastShareAt > 5000) {
          p.lastShareAt = now;
          const countA = this.balls.filter(b => b.side === 'A').length;
          const countB = this.balls.filter(b => b.side === 'B').length;
          const side = p.side || (countA <= countB ? 'A' : 'B');
          p.side = side;
          p.roundScore += 140;
          if (this.phase === 'VOTE') {
            this.spawnBall(p, side, 16, false, false);
          } else {
            this.queueForNextRound(p, side);
          }
        }
        return true;
      }

      if (e.type === 'gift' || e.type === 'subscribe') {
        const coins = Math.max(1, e.coins || 1);
        const tierInfo = getGiftTierInfo(coins);
        p.roundGifts += coins;
        p.roundScore += 200 + coins * tierInfo.scoreMult;
        p.giftTier = Math.max(p.giftTier || 0, tierInfo.tier);
        this.forgeTier = Math.max(this.forgeTier, tierInfo.tier);
        this.shake = 8 + tierInfo.tier * 4;
        playSfx('gift', p.side || 'A', tierInfo.tier);

        const countA = this.balls.filter(b => b.side === 'A').length;
        const countB = this.balls.filter(b => b.side === 'B').length;
        const side = p.side || (countA <= countB ? 'A' : 'B');
        p.side = side;

        if (side === 'A') this.shovePulseA = 1.5;
        else this.shovePulseB = 1.5;

        const targetBox = this.getChamberBox(side);
        const targetX = (targetBox.left + targetBox.right) / 2;
        if (this.giftMeteors.length < 8) {
          this.giftMeteors.push({
            playerId: p.id,
            name: p.name,
            tier: tierInfo.tier,
            badge: tierInfo.badge,
            coins: coins,
            fromX: 540, fromY: 110,
            toX: this.phase === 'VOTE' ? targetX : 540,
            toY: this.phase === 'VOTE' ? 660 : 710,
            progress: 0
          });
        }

        if (this.phase === 'VOTE') {
          let mainBall = null;
          for (let i = 0; i < this.balls.length; i++) {
            if (this.balls[i].playerId === p.id && !this.balls[i].isClone) { mainBall = this.balls[i]; break; }
          }
          if (!mainBall) {
            this.spawnBall(p, side, tierInfo.ballBonusR, false, false);
          } else {
            mainBall.isBot = false;
            mainBall.giftTier = p.giftTier;
            mainBall.baseR = clamp(62 + tierInfo.ballBonusR + Math.sqrt(p.roundLikes) * 3, 68, 114);
            mainBall.vy = -700;
            mainBall.squashX = 0.72; mainBall.squashY = 1.32;
            this.addShockwave(mainBall.x, mainBall.y, 165, tierInfo.border);
            this.addPopup(mainBall.x, mainBall.y - 45, tierInfo.badge, tierInfo.glow, 28);
          }
          for (let c = 0; c < tierInfo.clones; c++) {
            this.spawnBall(p, side, Math.max(0, tierInfo.ballBonusR - 14), true, false);
          }
          if (tierInfo.tier >= 2) {
            for (let i = 0; i < this.balls.length; i++) {
              const b = this.balls[i];
              if (b.side === side) {
                b.vy = -420 - Math.random() * 280;
                b.vx += (Math.random() - 0.5) * 380;
              }
            }
          }
          this.updateChamberLeaders();
        } else {
          this.queueForNextRound(p, side);
          this.spawnSparks(540, 710, 22);
        }

        this.banner = {
          text: tierInfo.badge + ' · ' + p.name,
          color: tierInfo.glow,
          until: now + 3400
        };
        if (tierInfo.tier >= 2) {
          speakTTS('Massive boost from ' + p.name + ' unlocking the ' + tierInfo.name + ' trophy!', false);
        }
        return true;
      }

      return false;
    }

    getCounts() {
      let a = 0, b = 0;
      for (let i = 0; i < this.balls.length; i++) {
        const ball = this.balls[i];
        const tierWeight = (ball.giftTier || 0) * 4;
        const likeWeight = ball.baseR > 66 ? Math.floor((ball.baseR - 56) / 8) : 0;
        const weight = ball.isClone ? 1 : (1 + likeWeight + tierWeight);
        if (ball.side === 'A') a += weight;
        else b += weight;
      }
      return { a: a, b: b, total: a + b };
    }

    startShredPhase() {
      this.phase = 'SHRED';
      this.timer = SHRED_DURATION;
      this.trapdoorAngle = 0;
      this.crusherY = 0;
      this.loseTitanY = 0;
      this.loseTitanVy = 80;
      this.loseTitanRot = 0;
      this.loseTitanShredded = false;
      const counts = this.getCounts();
      this.winningSide = counts.a >= counts.b ? 'A' : 'B';
      this.shake = 14;
      playSfx('shred');

      this.players.forEach(p => {
        if (p.side === this.winningSide) p.winStreak = (p.winStreak || 0) + 1;
        else if (p.side) p.winStreak = 0;
      });

      const realWinners = this.balls
        .filter(b => b.side === this.winningSide && !b.isBot && !b.isClone)
        .map(b => this.players.get(b.playerId))
        .filter(Boolean);

      const botWinners = this.balls
        .filter(b => b.side === this.winningSide && b.isBot && !b.isClone)
        .map(b => this.players.get(b.playerId))
        .filter(Boolean);

      const pool = realWinners.length > 0 ? realWinners : botWinners;

      if (pool.length > 0) {
        pool.sort((x, y) => y.roundScore - x.roundScore);
        this.mvp = pool[0];
        this.forgeTier = Math.max(this.forgeTier, this.mvp.giftTier || 0);
      } else {
        this.mvp = {
          id: 'mvp_default',
          name: this.winningSide === 'A' ? this.question.a : this.question.b,
          avatar: '',
          side: this.winningSide,
          roundScore: 100,
          winStreak: 1,
          giftTier: this.forgeTier
        };
      }

      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (b.side === this.winningSide) {
          b.vy = -450 - Math.random() * 220;
          b.vx = (Math.random() - 0.5) * 300;
        }
      }
    }

    startForgePhase() {
      this.phase = 'FORGE';
      this.timer = FORGE_DURATION;
      this.forgeProgress = 0;
      this.colorReveal = 0;
      this.forgeSlide = 0;
      this.shake = 8;
      playSfx('vote', this.winningSide);

      this.forgeOrbs = [];
      const tierInfo = GIFT_TIERS[this.forgeTier || 0];
      const colors = [GOLD, GOLD_HOT, WHITE, tierInfo.border, tierInfo.glow, this.winningSide === 'A' ? TEAM_A : TEAM_B];
      for (let i = 0; i < 160; i++) {
        const angle = (i / 160) * Math.PI * 2 + Math.random() * 0.5;
        const dist = 280 + Math.random() * 340;
        this.forgeOrbs.push({
          angle: angle,
          dist: dist,
          speed: 2.2 + Math.random() * 2.5,
          size: 4 + Math.random() * 9,
          color: colors[i % colors.length],
          targetR: Math.random() * 210
        });
      }

      if (this.mvp) {
        const winWord = formatSpokenWord(this.winningSide === 'A' ? this.question.a : this.question.b);
        speakTTS(winWord + ' wins the clash! Forging the starlight trophy for ' + this.mvp.name + '!', false);
      }
    }

    startShowcasePhase() {
      this.phase = 'SHOWCASE';
      this.timer = SHOW_DURATION;
      this.forgeProgress = 1;
      this.colorReveal = 1;
      this.shake = 12;
      playSfx('win');
      this.addShockwave(540, 710, 380, GOLD_HOT);
      this.spawnSparks(540, 710, 55, GOLD_HOT);

      if (this.mvp) {
        this.hallOfFame = this.hallOfFame.filter(h => h.name !== this.mvp.name);
        this.hallOfFame.unshift({
          id: this.mvp.id,
          name: this.mvp.name,
          avatar: this.mvp.avatar,
          side: this.winningSide,
          tier: this.forgeTier,
          streak: this.mvp.winStreak || 1
        });
        if (this.hallOfFame.length > 7) this.hallOfFame.pop();
      }
    }

    spawnSparks(x, y, count, customCol) {
      if (this.chips.length > 260) return;
      const tierInfo = GIFT_TIERS[this.forgeTier || 0];
      const n = count || 4;
      for (let i = 0; i < n; i++) {
        const isSpark = Math.random() < 0.72;
        this.chips.push({
          x: x + (Math.random() - 0.5) * 24,
          y: y + (Math.random() - 0.5) * 16,
          vx: (Math.random() - 0.5) * 760,
          vy: -220 - Math.random() * 560,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 20,
          life: 1.0,
          isSpark: isSpark,
          color: customCol || (isSpark ? tierInfo.spark1 : tierInfo.spark2)
        });
      }
    }

    tick(dt) {
      const now = performance.now();
      this.sawAngle += dt * 16;
      this.shake = Math.max(0, this.shake - dt * 26);
      this.shovePulseA = Math.max(0, this.shovePulseA - dt * 2.8);
      this.shovePulseB = Math.max(0, this.shovePulseB - dt * 2.8);

      const counts = this.getCounts();
      const ratioA = counts.total > 0 ? clamp(counts.a / counts.total, 0.20, 0.80) : 0.5;
      const pctA = counts.total ? Math.round((counts.a / counts.total) * 100) : 50;
      const pctB = counts.total ? 100 - pctA : 50;

      if (this.phase === 'VOTE') {
        this.targetSplitX = lerp(300, 780, ratioA);
      } else if (this.phase === 'SHRED') {
        this.targetSplitX = this.winningSide === 'A' ? 700 : 380;
      } else {
        this.targetSplitX = 540;
      }
      this.splitX += (this.targetSplitX - this.splitX) * Math.min(1, dt * 4.8);
      this.updateBumpers();

      const loseSide = this.winningSide === 'A' ? 'B' : 'A';

      if (this.phase === 'VOTE') {
        this.timer -= dt;

        const elapsed = this.roundDuration - this.timer;
        const currentBots = this.balls.filter(b => b.isBot).length;
        const targetBots = this.getTargetBotCrowd();
        if (elapsed >= this.nextBotAt && this.timer > 4.0 && currentBots < targetBots) {
          this.spawnRandomBotVoter();
          this.nextBotAt = elapsed + 1.2 + Math.random() * 2.2;
        }

        if (elapsed >= this.nextBotLikeAt && this.timer > 3.5 && currentBots > 0 && this.getRealPlayerCount() < 4) {
          const botBalls = this.balls.filter(b => b.isBot);
          if (botBalls.length > 0) {
            const pick = botBalls[Math.floor(Math.random() * botBalls.length)];
            pick.baseR = Math.min(82, pick.baseR + 5);
            pick.botScore = (pick.botScore || 12) + 10;
            pick.vy = -460 - Math.random() * 140;
            pick.vx += (Math.random() - 0.5) * 260;
            pick.squashX = 0.80; pick.squashY = 1.22;
            if (pick.side === 'A') this.shovePulseA = 0.85;
            else this.shovePulseB = 0.85;
            this.addShockwave(pick.x, pick.y, pick.r + 35, GOLD);
            this.addShockwave(this.splitX, 980, 95, pick.side === 'A' ? TEAM_A : TEAM_B);
            this.updateChamberLeaders();
          }
          this.nextBotLikeAt = elapsed + 2.2 + Math.random() * 2.4;
        }

        const secLeft = Math.ceil(this.timer);
        if (secLeft <= 5 && secLeft >= 1 && secLeft < this.lastSpokenCountdown) {
          this.lastSpokenCountdown = secLeft;
          speakTTS(String(secLeft), true);
        }

        if (this.timer <= 0) this.startShredPhase();
      } else if (this.phase === 'SHRED') {
        this.timer -= dt;
        this.trapdoorAngle = clamp(this.trapdoorAngle + dt * 3.2, 0, 1);
        this.crusherY = clamp(this.crusherY + dt * 0.72, 0, 1);

        this.loseTitanVy += 1550 * dt;
        this.loseTitanY += this.loseTitanVy * dt;
        this.loseTitanRot += (loseSide === 'A' ? -1.85 : 1.85) * dt;

        if (!this.loseTitanShredded && this.loseTitanY >= 250) {
          this.loseTitanShredded = true;
          const loseBox = this.getChamberBox(loseSide);
          const loseCx = (loseBox.left + loseBox.right) / 2;
          const burstCol = loseSide === 'A' ? TEAM_A : TEAM_B;
          this.shake = 22;
          this.spawnSparks(loseCx, ARENA_BOTTOM, 48, burstCol);
          this.addShockwave(loseCx, ARENA_BOTTOM, 210, GOLD_HOT);
          this.addPopup(loseCx, ARENA_BOTTOM - 90, '💥 TITAN SHREDDED! 💥', GOLD_HOT, 32);
          playSfx('shred', loseSide);
        }

        if (this.timer <= 0) this.startForgePhase();
      } else if (this.phase === 'FORGE') {
        this.forgeSlide = clamp(this.forgeSlide + dt * 3.5, 0, 1);
        if (this.forgeSlide >= 0.75) {
          const speedMult = GIFT_TIERS[this.forgeTier || 0].speedMult;
          this.forgeProgress += (dt / FORGE_DURATION) * speedMult;
          if (Math.random() < dt * 14) playSfx('forge');
          if (this.forgeProgress >= 1) this.startShowcasePhase();
        }
        for (let i = 0; i < this.forgeOrbs.length; i++) {
          const orb = this.forgeOrbs[i];
          orb.angle += orb.speed * dt * (1 + this.forgeProgress * 2.2);
        }
      } else if (this.phase === 'SHOWCASE') {
        this.forgeSlide = 1;
        this.timer -= dt;
        if (this.timer <= 0) this.nextRound();
      }

      this.titanPoses.A = this.computeTitanPose('A', now, pctA);
      this.titanPoses.B = this.computeTitanPose('B', now, pctB);

      const scaleA = this.getCrowdScale('A');
      const scaleB = this.getCrowdScale('B');

      for (let i = this.balls.length - 1; i >= 0; i--) {
        const b = this.balls[i];
        const cScale = b.side === 'A' ? scaleA : scaleB;
        const desiredR = clamp(b.baseR * cScale, 28, 108);
        b.r += (desiredR - b.r) * Math.min(1, dt * 7);
        b.squashX += (1 - b.squashX) * Math.min(1, dt * 12);
        b.squashY += (1 - b.squashY) * Math.min(1, dt * 12);

        if (Math.hypot(b.vx, b.vy) > 250) {
          b.trail.push({ x: b.x, y: b.y, r: b.r * 0.85 });
          if (b.trail.length > 4) b.trail.shift();
        } else if (b.trail.length > 0) {
          b.trail.shift();
        }

        b.vy += 1720 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.angle += b.omega * dt;
        b.vx *= Math.pow(0.993, dt * 60);
        b.vy *= Math.pow(0.995, dt * 60);
        b.omega *= Math.pow(0.98, dt * 60);

        const box = this.getChamberBox(b.side);

        // Collide with Pinball Bumpers
        for (let k = 0; k < this.bumpers.length; k++) {
          const bmp = this.bumpers[k];
          if (bmp.side !== b.side) continue;
          const dx = b.x - bmp.x;
          const dy = b.y - bmp.y;
          const dist = Math.hypot(dx, dy);
          const minD = b.r + bmp.r;
          if (dist < minD && dist > 0.001) {
            const nx = dx / dist;
            const ny = dy / dist;
            b.x = bmp.x + nx * (minD + 1);
            b.y = bmp.y + ny * (minD + 1);
            const speed = Math.max(350, Math.hypot(b.vx, b.vy) * 0.90);
            b.vx = nx * speed + (Math.random() - 0.5) * 80;
            b.vy = ny * speed;
            b.omega = (Math.random() - 0.5) * 10;
            b.squashX = 1.24;
            b.squashY = 0.76;
            bmp.hitAt = now;
            this.addShockwave(bmp.x, bmp.y, bmp.r + 40, bmp.color);
            playSfx('bumper', b.side);
          }
        }

        // Collide with the Giant Pushing Titan's body and kicking legs (with anti-pinch deflection!)
        if (this.phase === 'VOTE' || this.phase === 'SHRED') {
          const pose = this.titanPoses[b.side];
          if (pose && pose.colliders) {
            const openDir = -pose.dir; // Direction away from splitX toward open chamber space
            for (let c = 0; c < pose.colliders.length; c++) {
              const col = pose.colliders[c];
              let dx = b.x - col.x;
              let dy = b.y - col.y;
              const dist = Math.hypot(dx, dy);
              const minD = b.r + col.r;
              if (dist < minD && dist > 0.001) {
                let nx = dx / dist;
                let ny = dy / dist;

                // Prevent any ball from getting trapped on top of the head or wedged between the Titan and the center wall
                if (col.isUpper) {
                  // If the ball is on the inner side (between Titan and center wall) or landing on top of the head, deflect it outward into the arena!
                  if ((pose.isLeft && nx > -0.25) || (!pose.isLeft && nx < 0.25)) {
                    nx = openDir * 0.78;
                    ny = -0.62;
                  }
                }

                b.x = col.x + nx * (minD + 2);
                b.y = col.y + ny * (minD + 2);

                if (col.isFoot && this.phase === 'VOTE') {
                  b.vx = col.vx * 0.85 + nx * 460 + openDir * 140 + (Math.random() - 0.5) * 120;
                  b.vy = Math.min(-520, ny * 520 - 380);
                  b.omega = (Math.random() - 0.5) * 14;
                  b.squashX = 1.28;
                  b.squashY = 0.72;
                  if (now - (b.lastKickAt || 0) > 280) {
                    b.lastKickAt = now;
                    this.addShockwave(col.x, col.y, 68, GOLD_HOT);
                    playSfx('kick', b.side);
                  }
                } else {
                  const rvx = b.vx - col.vx;
                  const rvy = b.vy - col.vy;
                  const vn = rvx * nx + rvy * ny;
                  if (vn < 0) {
                    b.vx -= (1 + 0.65) * vn * nx;
                    b.vy -= (1 + 0.65) * vn * ny;
                  }
                  // Guarantee horizontal roll-off toward the open chamber when hitting head/shoulders
                  if (col.isUpper) {
                    if (pose.isLeft) b.vx = Math.min(b.vx, -240 - Math.random() * 120);
                    else b.vx = Math.max(b.vx, 240 + Math.random() * 120);
                    b.vy = Math.min(b.vy, -220);
                  }
                  if (now - (b.lastKickAt || 0) > 180) {
                    b.lastKickAt = now;
                    b.squashX = 1.15;
                    b.squashY = 0.85;
                  }
                }
              }
            }
          }
        }

        // Wall clamping after Titan deflection
        if (b.x < box.left + b.r + 10) {
          b.x = box.left + b.r + 10;
          if (b.vx < -120) { b.squashX = 0.80; b.squashY = 1.20; playSfx('bounce', b.side); }
          b.vx = Math.abs(b.vx) * 0.74;
          b.omega = b.vy * 0.011;
        }
        if (b.x > box.right - b.r - 10) {
          b.x = box.right - b.r - 10;
          if (b.vx > 120) { b.squashX = 0.80; b.squashY = 1.20; playSfx('bounce', b.side); }
          b.vx = -Math.abs(b.vx) * 0.74;
          b.omega = -b.vy * 0.011;
        }

        const floorClosed = this.phase === 'VOTE' || b.side === this.winningSide;
        if (floorClosed) {
          if (b.y > box.bottom - b.r - 10) {
            b.y = box.bottom - b.r - 10;
            if (b.vy > 160) {
              b.squashX = clamp(1 + b.vy / 2300, 1.05, 1.30);
              b.squashY = clamp(1 - b.vy / 2700, 0.72, 0.95);
              if (b.vy > 280) playSfx('bounce', b.side);
            }
            b.vy = -Math.abs(b.vy) * 0.68;
            if (Math.abs(b.vy) < 55) b.vy = 0;
            b.omega = b.vx * 0.014;
          }
        } else {
          const pressBottomY = lerp(box.top + 80, box.bottom - 35, this.crusherY);
          if (b.y - b.r < pressBottomY) {
            b.y = pressBottomY + b.r;
            b.vy = Math.max(b.vy, 560);
            b.squashX = 1.32;
            b.squashY = 0.68;
          }
          if (!b.shredded && b.y >= box.bottom - 12) {
            b.shredded = true;
            this.shake = Math.max(this.shake, 9);
            const burstCol = loseSide === 'A' ? TEAM_A : TEAM_B;
            this.spawnSparks(b.x, box.bottom + 8, 18, burstCol);
            this.addShockwave(b.x, box.bottom + 8, 110, burstCol);
            playSfx('shred', loseSide);
            this.balls.splice(i, 1);
            continue;
          }
        }
      }

      // Ball-to-ball collisions with wall/floor re-clamping on each pass
      const boxA = this.getChamberBox('A');
      const boxB = this.getChamberBox('B');
      for (let pass = 0; pass < 4; pass++) {
        for (let i = 0; i < this.balls.length; i++) {
          const b1 = this.balls[i];
          for (let j = i + 1; j < this.balls.length; j++) {
            const b2 = this.balls[j];
            if (b1.side !== b2.side) continue;
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const d2 = dx * dx + dy * dy;
            const minD = b1.r + b2.r + 2;
            if (d2 >= minD * minD) continue;
            const d = Math.sqrt(d2) || 0.01;
            const nx = dx / d;
            const ny = dy / d;
            const overlap = (minD - d) * 0.52;
            b1.x -= nx * overlap; b1.y -= ny * overlap;
            b2.x += nx * overlap; b2.y += ny * overlap;

            const rvx = b2.vx - b1.vx;
            const rvy = b2.vy - b1.vy;
            const velAlongNormal = rvx * nx + rvy * ny;
            if (velAlongNormal < 0) {
              const restitution = pass === 0 ? 0.64 : 0.34;
              const imp = -(1 + restitution) * velAlongNormal * 0.5;
              b1.vx -= nx * imp; b1.vy -= ny * imp;
              b2.vx += nx * imp; b2.vy += ny * imp;

              if (pass === 0 && Math.abs(velAlongNormal) > 220) {
                b1.squashX = 1.14; b1.squashY = 0.87;
                b2.squashX = 1.14; b2.squashY = 0.87;
              }
            }
          }

          const box = b1.side === 'A' ? boxA : boxB;
          b1.x = clamp(b1.x, box.left + b1.r + 10, box.right - b1.r - 10);
          const floorClosed = this.phase === 'VOTE' || b1.side === this.winningSide;
          if (floorClosed && b1.y > box.bottom - b1.r - 10) {
            b1.y = box.bottom - b1.r - 10;
          }
        }
      }

      for (let i = this.chips.length - 1; i >= 0; i--) {
        const ch = this.chips[i];
        ch.vy += 1720 * dt;
        ch.x += ch.vx * dt;
        ch.y += ch.vy * dt;
        ch.rot += ch.vrot * dt;
        ch.life -= dt * 1.55;
        if (ch.life <= 0) this.chips.splice(i, 1);
      }

      for (let i = this.shockwaves.length - 1; i >= 0; i--) {
        const sw = this.shockwaves[i];
        sw.r = lerp(sw.r, sw.maxR, dt * 10);
        sw.life -= dt * 2.6;
        if (sw.life <= 0) this.shockwaves.splice(i, 1);
      }

      for (let i = this.popups.length - 1; i >= 0; i--) {
        const pp = this.popups[i];
        pp.y -= 65 * dt;
        pp.life -= dt * 1.4;
        if (pp.life <= 0) this.popups.splice(i, 1);
      }

      for (let i = this.laserBeams.length - 1; i >= 0; i--) {
        const lb = this.laserBeams[i];
        lb.life -= dt * 2.4;
        if (lb.life <= 0) this.laserBeams.splice(i, 1);
      }

      for (let i = this.giftMeteors.length - 1; i >= 0; i--) {
        const gm = this.giftMeteors[i];
        gm.progress += dt * 2.2;
        if (gm.progress >= 1) {
          this.addShockwave(gm.toX, gm.toY, 155, GIFT_TIERS[gm.tier].glow);
          this.spawnSparks(gm.toX, gm.toY, 18);
          this.giftMeteors.splice(i, 1);
        }
      }
    }
  }

  const canvas = $('arena');
  const ctx = canvas.getContext('2d', { alpha: false });
  let darkPreview = false;
  const game = new ClashForgeGame();

  function roundPath(x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function gradPanel(x, y, w, h, r, cTop, cBot, borderCol, lineW) {
    roundPath(x, y, w, h, r);
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, cTop);
    g.addColorStop(1, cBot);
    ctx.fillStyle = g;
    ctx.fill();
    if (lineW > 0 && borderCol) {
      ctx.lineWidth = lineW;
      ctx.strokeStyle = borderCol;
      ctx.stroke();
    }
  }

  function drawText(str, x, y, size, color, align, maxW, outlineCol) {
    const col = color || WHITE;
    const al = align || 'center';
    const mw = maxW || 950;
    ctx.font = '900 ' + size + 'px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = al;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(5, Math.round(size * 0.20));
    ctx.strokeStyle = outlineCol || OUTLINE;
    let text = String(str);
    while (text.length > 1 && ctx.measureText(text).width > mw) text = text.slice(0, -1);
    ctx.strokeText(text, x, y);
    ctx.fillStyle = col;
    ctx.fillText(text, x, y);
  }

  function drawPlasmaSaw(cx, cy, r, angle, accentCol) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.beginPath();
    const teeth = 14;
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i * Math.PI) / teeth;
      const rad = i % 2 === 0 ? r : r * 0.68;
      if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
    g.addColorStop(0, WHITE);
    g.addColorStop(0.5, accentCol);
    g.addColorStop(1, DARK_SLATE);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();
    ctx.restore();
  }

  function drawBumperPeg(bmp, now) {
    const age = now - bmp.hitAt;
    const pulse = age < 220 ? (1 + (1 - age / 220) * 0.35) : 1;
    const r = bmp.r * pulse;

    ctx.save();
    ctx.translate(bmp.x, bmp.y);
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
    ctx.fillStyle = OUTLINE;
    ctx.fill();

    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.25, 2, 0, 0, r);
    g.addColorStop(0, WHITE);
    g.addColorStop(0.55, age < 220 ? GOLD_HOT : bmp.color);
    g.addColorStop(1, DARK_SLATE);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  function drawPushingTitan(side, now) {
    const pose = game.titanPoses[side];
    if (!pose) return;
    if (pose.isShredLoser && game.loseTitanY > 470) return;

    const isLeft = pose.isLeft;
    const dir = pose.dir;
    const col = isLeft ? TEAM_A : TEAM_B;
    const darkCol = isLeft ? TEAM_A_DARK : TEAM_B_DARK;
    const glowCol = isLeft ? TEAM_A_GLOW : TEAM_B_GLOW;
    const emoji = isLeft ? game.question.ea : game.question.eb;
    const style = isLeft ? (game.question.fa || 'male') : (game.question.fb || 'female');

    const {
      shoulderX, shoulderY, hipX, hipY, handX, handY,
      frontFootX, frontFootY, backFootX, backFootY,
      frontKneeX, frontKneeY, backKneeX, backKneeY,
      headX, headY, chestX, chestY, rot, stepPhase,
      shove, isWinning, isShredLoser, isShredWinner
    } = pose;

    const box = game.getChamberBox(side);

    ctx.save();
    if (isShredLoser) {
      ctx.beginPath();
      ctx.rect(box.left - 20, box.top - 40, (box.right - box.left) + 40, (box.bottom - box.top) + 65);
      ctx.clip();
    }

    if (rot !== 0) {
      ctx.translate(chestX, chestY);
      ctx.rotate(rot);
      ctx.translate(-chestX, -chestY);
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const drawLimb = (x1, y1, x2, y2, w, fillCol) => {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineWidth = w + 14;
      ctx.strokeStyle = OUTLINE;
      ctx.stroke();
      ctx.lineWidth = w;
      ctx.strokeStyle = fillCol;
      ctx.stroke();
    };

    drawLimb(hipX, hipY, backKneeX, backKneeY, 38, darkCol);
    drawLimb(backKneeX, backKneeY, backFootX, backFootY, 32, darkCol);

    drawLimb(hipX, hipY, frontKneeX, frontKneeY, 42, col);
    drawLimb(frontKneeX, frontKneeY, frontFootX, frontFootY, 36, col);

    drawLimb(backFootX - dir * 10, backFootY, backFootX + dir * 28, backFootY, 26, WHITE);
    drawLimb(frontFootX - dir * 10, frontFootY, frontFootX + dir * 32, frontFootY, 28, GOLD_HOT);

    const elbowUpX = (shoulderX + handX) / 2 - dir * 10;
    const elbowUpY = shoulderY - 38 + Math.sin(now * 0.02) * 8;
    drawLimb(shoulderX, shoulderY - 14, elbowUpX, elbowUpY, 32, darkCol);
    drawLimb(elbowUpX, elbowUpY, handX, handY - 22, 28, darkCol);

    ctx.beginPath();
    ctx.moveTo(shoulderX - dir * 48, shoulderY - 32);
    ctx.lineTo(shoulderX + dir * 46, shoulderY - 22);
    ctx.lineTo(hipX + dir * 38, hipY + 18);
    ctx.lineTo(hipX - dir * 42, hipY + 18);
    ctx.closePath();
    const torsoGrad = ctx.createLinearGradient(shoulderX, shoulderY, hipX, hipY);
    torsoGrad.addColorStop(0, col);
    torsoGrad.addColorStop(1, darkCol);
    ctx.fillStyle = torsoGrad;
    ctx.fill();
    ctx.lineWidth = 10;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();
    ctx.lineWidth = 4;
    ctx.strokeStyle = glowCol;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(chestX, chestY, 46, 0, Math.PI * 2);
    ctx.fillStyle = OUTLINE;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = GOLD;
    ctx.stroke();
    drawText(emoji, chestX, chestY + 2, 46, WHITE);

    const headR = 54;
    if (style === 'female') {
      ctx.beginPath();
      ctx.arc(headX - dir * 56, headY - 12 + Math.sin(stepPhase * 2) * 8, 28, 0, Math.PI * 2);
      ctx.fillStyle = isLeft ? '#facc15' : '#f43f5e';
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = OUTLINE;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(headX, headY, headR, 0, Math.PI * 2);
    ctx.fillStyle = '#fed7aa';
    ctx.fill();
    ctx.lineWidth = 10;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();

    ctx.fillStyle = style === 'female' ? (isLeft ? '#facc15' : '#f43f5e') : (style === 'male_alt' ? '#f59e0b' : '#1e293b');
    ctx.beginPath();
    ctx.arc(headX, headY - 12, headR + 2, Math.PI * 0.9, Math.PI * 2.1);
    ctx.fill();
    ctx.lineWidth = 7;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();

    if (style === 'cat' || style === 'dog') {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(headX - 36, headY - 38);
      ctx.lineTo(headX - 18, headY - 76);
      ctx.lineTo(headX - 4, headY - 46);
      ctx.moveTo(headX + 4, headY - 46);
      ctx.lineTo(headX + 22, headY - 76);
      ctx.lineTo(headX + 38, headY - 38);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(headX - headR + 4, headY - 18);
    ctx.lineTo(headX + headR - 4, headY - 18);
    ctx.lineWidth = 14;
    ctx.strokeStyle = col;
    ctx.stroke();

    const eyeX = headX + dir * 20;
    const eyeY = headY - 2;
    if (isShredLoser) {
      drawText('✖', eyeX, eyeY, 26, OUTLINE);
      ctx.beginPath();
      ctx.arc(headX + dir * 18, headY + 22, 13, 0, Math.PI * 2);
      ctx.fillStyle = OUTLINE;
      ctx.fill();
    } else {
      ctx.fillStyle = WHITE;
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = OUTLINE;
      ctx.beginPath();
      ctx.arc(eyeX + dir * 3, eyeY, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(eyeX - 14, eyeY - 14 - dir * 4);
      ctx.lineTo(eyeX + 14, eyeY - 14 + dir * 5);
      ctx.lineWidth = 6;
      ctx.strokeStyle = OUTLINE;
      ctx.stroke();

      ctx.fillStyle = WHITE;
      roundPath(headX + dir * 8, headY + 16, 26, 14, 5);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = OUTLINE;
      ctx.stroke();
    }

    const elbowDownX = (shoulderX + handX) / 2 - dir * 6;
    const elbowDownY = shoulderY + 34 - Math.sin(now * 0.02) * 8;
    drawLimb(shoulderX, shoulderY + 10, elbowDownX, elbowDownY, 36, col);
    drawLimb(elbowDownX, elbowDownY, handX, handY + 12, 32, col);

    ctx.beginPath();
    ctx.arc(handX, handY, 26 + shove * 8, 0, Math.PI * 2);
    ctx.fillStyle = GOLD_HOT;
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();

    if (isShredWinner) {
      drawText('🏆 WINNER!', headX, headY - 76, 30, GOLD_HOT);
    } else if (!isWinning || shove > 0.2) {
      for (let s = 0; s < 3; s++) {
        const ang = (now * 0.01 + s * 2.1);
        const sx = headX - dir * (55 + (s * 14));
        const sy = headY - 25 + Math.sin(ang) * 20;
        ctx.beginPath();
        ctx.arc(sx, sy, 6, 0, Math.PI * 2);
        ctx.fillStyle = shove > 0.2 ? GOLD_HOT : '#38bdf8';
        ctx.fill();
      }
    }

    ctx.restore();
  }

  function drawCenterClashFighters(pctA, pctB, now) {
    if (game.phase !== 'VOTE' && game.phase !== 'SHRED') return;

    const splitX = game.splitX;

    drawPushingTitan('A', now);
    drawPushingTitan('B', now);

    if (game.phase === 'VOTE') {
      ctx.save();
      const beamGlow = ctx.createLinearGradient(splitX - 35, 0, splitX + 35, 0);
      beamGlow.addColorStop(0, 'rgba(255, 42, 95, 0)');
      beamGlow.addColorStop(0.35, 'rgba(255, 42, 95, 0.55)');
      beamGlow.addColorStop(0.5, WHITE);
      beamGlow.addColorStop(0.65, 'rgba(0, 210, 255, 0.55)');
      beamGlow.addColorStop(1, 'rgba(0, 210, 255, 0)');
      ctx.fillStyle = beamGlow;
      ctx.fillRect(splitX - 35, ARENA_TOP, 70, ARENA_BOTTOM - ARENA_TOP);

      const clashR = 38 + Math.sin(now * 0.025) * 8 + (game.shovePulseA + game.shovePulseB) * 18;
      const coreGrad = ctx.createRadialGradient(splitX, 985, 4, splitX, 985, clashR);
      coreGrad.addColorStop(0, WHITE);
      coreGrad.addColorStop(0.45, GOLD_HOT);
      coreGrad.addColorStop(1, 'rgba(251, 191, 36, 0)');
      ctx.beginPath();
      ctx.arc(splitX, 985, clashR, 0, Math.PI * 2);
      ctx.fillStyle = coreGrad;
      ctx.fill();

      const pushDir = pctA >= pctB ? '>>> PUSHING >>>' : '<<< PUSHING <<<';
      const pushCol = pctA >= pctB ? TEAM_A_GLOW : TEAM_B_GLOW;
      gradPanel(splitX - 135, 515, 270, 50, 16, '#090d16', '#1e293b', GOLD, 3.5);
      drawText(pushDir, splitX, 540, 24, pushCol, 'center', 250);
      ctx.restore();
    }
  }

  function drawVoterBall(b, now) {
    const p = game.players.get(b.playerId) || { id: b.playerId, name: b.name, side: b.side, winStreak: 0, giftTier: 0, roundLikes: 0 };
    const img = getPlayerImage(p);
    const gTier = b.giftTier || p.giftTier || 0;
    const tierInfo = GIFT_TIERS[gTier];
    const isLeader = !b.isClone && ((b.side === 'A' && game.leaderA === b.playerId) || (b.side === 'B' && game.leaderB === b.playerId));
    const isLiked = now < (b.likeGlowUntil || 0) || (p.roundLikes >= 10);

    const col = gTier > 0 ? tierInfo.border : (b.side === 'A' ? TEAM_A : TEAM_B);
    const glowCol = gTier > 0 ? tierInfo.glow : (b.side === 'A' ? TEAM_A_GLOW : TEAM_B_GLOW);

    for (let i = 0; i < b.trail.length; i++) {
      const tr = b.trail[i];
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, tr.r * ((i + 1) / (b.trail.length + 1)) * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
    }

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.squashX, b.squashY);

    if (isLeader || gTier >= 2 || isLiked) {
      const auraR = b.r + 9 + Math.sin(now * 0.016) * 4;
      ctx.beginPath();
      ctx.arc(0, 0, auraR, 0, Math.PI * 2);
      ctx.lineWidth = isLeader ? 6 : 4.5;
      ctx.strokeStyle = isLeader ? GOLD : (gTier >= 2 ? tierInfo.glow : GOLD_HOT);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, 0, b.r + 5, 0, Math.PI * 2);
    ctx.fillStyle = OUTLINE;
    ctx.fill();

    ctx.save();
    ctx.rotate(clamp(b.vx * 0.0006, -0.25, 0.25));
    ctx.beginPath();
    ctx.arc(0, 0, b.r - 2.5, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, -b.r + 2.5, -b.r + 2.5, (b.r - 2.5) * 2, (b.r - 2.5) * 2);
    ctx.restore();

    const shine = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.38, b.r * 0.06, 0, 0, b.r);
    shine.addColorStop(0, 'rgba(255,255,255,0.52)');
    shine.addColorStop(0.32, 'rgba(255,255,255,0.08)');
    shine.addColorStop(0.75, 'rgba(0,0,0,0)');
    shine.addColorStop(1, 'rgba(9,13,22,0.45)');
    ctx.beginPath();
    ctx.arc(0, 0, b.r - 2, 0, Math.PI * 2);
    ctx.fillStyle = shine;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, b.r - 1, 0, Math.PI * 2);
    ctx.lineWidth = (gTier > 0 || isLiked || !b.isBot) ? 6.5 : 5;
    ctx.strokeStyle = isLiked && gTier === 0 ? GOLD : col;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, b.r - 4, -Math.PI * 0.75, -Math.PI * 0.15);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = glowCol;
    ctx.stroke();

    ctx.restore();

    if (isLeader && game.phase === 'VOTE') {
      const bob = Math.sin(now * 0.012) * 4;
      drawText('👑 #1 MVP', b.x, b.y - b.r * b.squashY - 18 + bob, 22, GOLD, 'center', 160);
    }

    if (!b.isClone) {
      const streakStr = (p.winStreak && p.winStreak >= 2) ? (' 🔥' + p.winStreak) : '';
      drawText(b.name + streakStr, b.x, b.y + b.r * b.squashY + 16, 19, (gTier > 0 || isLiked) ? GOLD_HOT : WHITE, 'center', Math.max(115, b.r * 2.8));
    }

  function drawChamber(side) {
    const box = game.getChamberBox(side);
    const col = side === 'A' ? TEAM_A : TEAM_B;
    const glow = side === 'A' ? TEAM_A_GLOW : TEAM_B_GLOW;
    const w = box.right - box.left;
    const cx = box.left + w / 2;

    const isLosingShred = game.phase === 'SHRED' && game.winningSide !== side;

    if (isLosingShred) {
      const pressBottomY = lerp(box.top + 80, box.bottom - 35, game.crusherY);
      const pressH = Math.max(55, pressBottomY - box.top);
      gradPanel(cx - 85, box.top, 34, pressH, 6, '#64748b', '#1e293b', OUTLINE, 4);
      gradPanel(cx + 51, box.top, 34, pressH, 6, '#64748b', '#1e293b', OUTLINE, 4);
      gradPanel(box.left + 12, pressBottomY - 68, w - 24, 68, 14, '#ef4444', '#7f1d1d', GOLD, 5);
      drawText('CRUSHING LOSERS', cx, pressBottomY - 34, 26, GOLD, 'center', w - 40);
    }

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(box.left, box.bottom);
    ctx.lineTo(box.left, box.top + 22);
    ctx.arcTo(box.left, box.top, box.left + 22, box.top, 22);
    ctx.lineTo(box.right - 22, box.top);
    ctx.arcTo(box.right, box.top, box.right, box.top + 22, 22);
    ctx.lineTo(box.right, box.bottom);
    ctx.lineWidth = 15;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();
    ctx.lineWidth = 6.5;
    ctx.strokeStyle = col;
    ctx.stroke();

    const halfW = w / 2;
    const openAngle = isLosingShred ? game.trapdoorAngle * 1.15 : 0;

    ctx.save();
    ctx.translate(box.left, box.bottom);
    ctx.rotate(openAngle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(halfW - 4, 0);
    ctx.lineWidth = 15; ctx.strokeStyle = OUTLINE; ctx.stroke();
    ctx.lineWidth = 7; ctx.strokeStyle = isLosingShred ? GOLD : glow; ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(box.right, box.bottom);
    ctx.rotate(-openAngle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-halfW + 4, 0);
    ctx.lineWidth = 15; ctx.strokeStyle = OUTLINE; ctx.stroke();
    ctx.lineWidth = 7; ctx.strokeStyle = isLosingShred ? GOLD : glow; ctx.stroke();
    ctx.restore();

      drawText('🏆 WINNING SIDE 🏆', cx, box.top + 65, 36, GOLD, 'center', w - 30);
    }
  }

      const drawSize = (trophyR - 14) * 2;
      ctx.drawImage(portraitImg, centerX - (trophyR - 14), centerY - (trophyR - 14), drawSize, drawSize);

      if (game.phase === 'SHOWCASE') {

        ctx.fillRect(centerX - trophyR, centerY - trophyR, drawSize, drawSize);

    );

    const fillW = Math.max(18, (pw - 108) * prog);

  function render(now) {

      ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
    }

    const counts = game.getCounts();
    const pctA = counts.total ? Math.round((counts.a / counts.total) * 100) : 50;
    const pctB = counts.total ? 100 - pctA : 50;

    drawTopBarAndHeaders(pctA, pctB, counts, now);
    drawChamber('A');
    drawChamber('B');

    drawCenterClashFighters(pctA, pctB, now);

    for (let i = 0; i < game.bumpers.length; i++) {
      drawBumperPeg(game.bumpers[i], now);
    }

    for (let i = 0; i < game.shockwaves.length; i++) {
      const sw = game.shockwaves[i];
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(2, 6 * sw.life);
      ctx.strokeStyle = sw.color;
