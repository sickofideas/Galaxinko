<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxinko: The CNC Judge</title>
<style>
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: #00FF00; /* Chroma Key Green */
    overflow: hidden; font-family: 'Arial Black', Arial, sans-serif;
  }
  #game-container {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; align-items: center;
  }
  canvas {
    display: block; width: min(100vw, 56.25vh); height: min(100vh, 177.77vw);
    aspect-ratio: 9/16;
  }
  /* Admin Panel */
  #admin-panel {
    position: fixed; top: 10px; left: 10px; z-index: 100;
    background: rgba(10, 15, 30, 0.9); padding: 15px; border-radius: 10px;
    border: 2px solid #00f2fe; color: white; font-family: Arial, sans-serif;
    display: none;
  }
  #admin-panel button {
    background: #24304e; color: white; border: 1px solid #00f2fe;
    padding: 8px 12px; margin: 4px; border-radius: 5px; cursor: pointer; font-weight: bold;
  }
  #admin-panel button:hover { background: #00f2fe; color: black; }
  .hotkey-hint { position: fixed; top: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; font-size: 12px; z-index: 99;}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="arena" width="1080" height="1920"></canvas>
</div>

<div class="hotkey-hint">Press 'H' for Admin Panel</div>

<div id="admin-panel">
  <h3>Admin Panel (Live TEST)</h3>
  <button id="btn-sound">Enable Sound</button><br><br>
  <button id="btn-voteA">Vote A</button>
  <button id="btn-voteB">Vote B</button><br>
  <button id="btn-like">Add Like (SpeedUp)</button>
  <button id="btn-gift">Add Gift (Gold Plating)</button><br><br>
  <button id="btn-end">Force End Round</button>
</div>

<script>
// ==========================================
// KONFIGURACE HRY
// ==========================================
const OPTIONS = {
    A: { title: "PIZZA", emoji: "🍕", color: "#FF4136" },
    B: { title: "BURGER", emoji: "🍔", color: "#0074D9" }
};
const ROUND_TIME = 45; // sekundy
const FLOOR_Y = 1600;

// ==========================================
// ENGINE A STAV
// ==========================================
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d', { alpha: false });
const W = 1080, H = 1920;

let audioCtx = null;
let soundEnabled = false;

let state = "VOTE"; // VOTE, SHRED, CNC, RESULTS
let roundTimer = ROUND_TIME;
let lastTime = performance.now();

let balls = [];
let particles = [];
let players = {}; // id -> { name, avatarImg, score, side, likes, gifts }
let avatarCache = {};

let mvpPlayer = null;
let cncProgress = 0; // 0 to 1
let laserPos = { x: 0, y: 0 };
let isGoldPlated = false;

// ==========================================
// ZVUKY (Web Audio API)
// ==========================================
function unlockAudio() {
    if(!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    soundEnabled = true;
    document.getElementById('btn-sound').innerText = "Sound ON";
}

function playTone(freq, type, duration, vol=0.1) {
    if(!soundEnabled || !audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playLaserSound() {
    if(!soundEnabled || !audioCtx || Math.random() > 0.3) return; // limit
    playTone(150 + Math.random()*50, 'sawtooth', 0.1, 0.05);
}

// ==========================================
// FYZIKA A LOGIKA
// ==========================================
function spawnBall(userId, name, avatarUrl, side) {
    let x = side === 'A' ? 270 + (Math.random()*100 - 50) : 810 + (Math.random()*100 - 50);
    let y = 300 + Math.random() * 50;
    let r = 35;
    
    balls.push({
        userId: userId, name: name, avatar: avatarUrl, side: side,
        x: x, y: y, vx: (Math.random()-0.5)*2, vy: Math.random()*2, r: r, active: true
    });
    
    playTone(side === 'A' ? 600 : 800, 'sine', 0.1, 0.05);
}

function updatePhysics(dt) {
    // Gravitace a pohyb
    for(let b of balls) {
        if(!b.active) continue;
        b.vy += 2400 * dt; // gravity
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        
        // Tření
        b.vx *= 0.99;
        b.vy *= 0.99;
        
        // Podlaha
        if(state === "VOTE" || (state === "SHRED" && b.side === getWinningSide())) {
            if(b.y > FLOOR_Y - b.r) { b.y = FLOOR_Y - b.r; b.vy *= -0.3; }
        }
        
        // Zdi a střed
        let minX = b.side === 'A' ? 40 : 550;
        let maxX = b.side === 'A' ? 530 : 1040;
        if(b.x < minX + b.r) { b.x = minX + b.r; b.vx *= -0.5; }
        if(b.x > maxX - b.r) { b.x = maxX - b.r; b.vx *= -0.5; }
    }
    
    // Stabilní resolve kolizí (3 iterace pro tuhost)
    for(let iter = 0; iter < 3; iter++) {
        for(let i=0; i<balls.length; i++) {
            if(!balls[i].active) continue;
            for(let j=i+1; j<balls.length; j++) {
                if(!balls[j].active) continue;
                // Kuličky se míchají jen na své straně
                if(balls[i].side !== balls[j].side) continue;
                
                let dx = balls[j].x - balls[i].x;
                let dy = balls[j].y - balls[i].y;
                let dist = Math.hypot(dx, dy);
                let minDist = balls[i].r + balls[j].r;
                
                if(dist < minDist && dist > 0.001) {
                    let overlap = minDist - dist;
                    let nx = dx / dist, ny = dy / dist;
                    
                    balls[i].x -= nx * overlap * 0.5; balls[i].y -= ny * overlap * 0.5;
                    balls[j].x += nx * overlap * 0.5; balls[j].y += ny * overlap * 0.5;
                    
                    // Přenos hybnosti
                    let dvx = balls[j].vx - balls[i].vx; let dvy = balls[j].vy - balls[i].vy;
                    let impulse = (dvx * nx + dvy * ny) * 0.5;
                    if(impulse < 0) {
                        balls[i].vx += nx * impulse; balls[i].y += ny * impulse;
                        balls[j].vx -= nx * impulse; balls[j].y -= ny * impulse;
                    }
                }
            }
        }
    }
}

function getWinningSide() {
    let countA = balls.filter(b => b.side === 'A').length;
    let countB = balls.filter(b => b.side === 'B').length;
    return countA >= countB ? 'A' : 'B';
}

function startCNC() {
    let winSide = getWinningSide();
    let winBalls = balls.filter(b => b.side === winSide);
    
    if(winBalls.length > 0) {
        // Vyber MVP (nejvíc gifts/likes, nebo náhodně)
        let best = winBalls[0];
        let maxScore = -1;
        for(let b of winBalls) {
            let p = players[b.userId];
            let score = p ? (p.gifts * 100 + p.likes * 10) : 0;
            if(score > maxScore) { maxScore = score; best = b; }
        }
        mvpPlayer = best;
    } else {
        mvpPlayer = { name: "NOBODY", avatar: null }; // Fallback
    }
    
    cncProgress = 0;
    state = "CNC";
    playTone(200, 'square', 1.0, 0.1);
}

function spawnSparks(x, y) {
    if(particles.length > 150) return;
    for(let i=0; i<3; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*800, vy: -Math.random()*800 - 200,
            life: 1.0, color: isGoldPlated ? '#FFDC00' : '#FF851B'
        });
    }
}

function updateParticles(dt) {
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.vy += 2000 * dt; // gravity
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= dt * 1.5;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

// ==========================================
// VYKRESLOVÁNÍ
// ==========================================
function loadAvatar(url) {
    if(!url) return null;
    if(avatarCache[url]) return avatarCache[url] === 'loading' ? null : avatarCache[url];
    avatarCache[url] = 'loading';
    let img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = () => { avatarCache[url] = img; };
    img.onerror = () => { avatarCache[url] = null; };
    img.src = url;
    return null;
}

function drawBall(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    
    // Obrys podle týmu
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI*2);
    ctx.fillStyle = OPTIONS[b.side].color;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.stroke();
    
    // Profilovka
    let img = loadAvatar(b.avatar);
    if(img && img !== 'loading') {
        ctx.save();
        ctx.beginPath(); ctx.arc(0, 0, b.r - 4, 0, Math.PI*2); ctx.clip();
        ctx.drawImage(img, -b.r, -b.r, b.r*2, b.r*2);
        ctx.restore();
    } else {
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(0, 0, b.r - 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = "bold 24px Arial";
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.name.charAt(0).toUpperCase(), 0, 2);
    }
    ctx.restore();
}

function drawCNCPhase() {
    let px = W/2 - 300, py = H/2 - 300, pSize = 600;
    
    // 1. Zlatá/Kovová deska
    ctx.fillStyle = isGoldPlated ? '#FFD700' : '#888888';
    ctx.fillRect(px, py, pSize, pSize);
    ctx.lineWidth = 10; ctx.strokeStyle = '#222';
    ctx.strokeRect(px, py, pSize, pSize);
    
    // 2. Gravírování portrétu (Ořezávací maska)
    if(mvpPlayer) {
        ctx.save();
        // Vypočítáme, kolik řádků už CNC udělalo
        let revealH = pSize * cncProgress;
        
        ctx.beginPath();
        ctx.rect(px, py, pSize, revealH);
        ctx.clip();
        
        // Vykreslit tmavou verzi profilovky
        let img = loadAvatar(mvpPlayer.avatar);
        if(img && img !== 'loading') {
            ctx.drawImage(img, px + 50, py + 50, pSize - 100, pSize - 100);
            // Ztmavovací vrstva, aby to vypadalo vyfrézovaně
            ctx.fillStyle = isGoldPlated ? 'rgba(100, 60, 0, 0.4)' : 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(px, py, pSize, pSize);
        } else {
            ctx.fillStyle = '#222';
            ctx.fillRect(px + 50, py + 50, pSize - 100, pSize - 100);
            ctx.fillStyle = isGoldPlated ? '#FFD700' : '#888';
            ctx.font = "bold 100px Arial"; ctx.textAlign = "center";
            ctx.fillText(mvpPlayer.name, px + pSize/2, py + pSize/2);
        }
        
        // Jméno dárce gravírované dole
        ctx.fillStyle = '#111';
        ctx.font = "bold 40px Arial"; ctx.textAlign = "center";
        ctx.fillText("MVP: " + mvpPlayer.name, px + pSize/2, py + pSize - 20);
        ctx.restore();
        
        // 3. Hlava CNC (laser)
        if(state === "CNC") {
            let scanLines = 20;
            let currentLine = Math.floor(cncProgress * scanLines);
            let lineProgress = (cncProgress * scanLines) % 1;
            
            laserPos.x = px + (currentLine % 2 === 0 ? lineProgress * pSize : (1 - lineProgress) * pSize);
            laserPos.y = py + revealH;
            
            // Jiskry a zvuk
            spawnSparks(laserPos.x, laserPos.y);
            playLaserSound();
            
            // Vykreslení laserové hlavy
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.moveTo(laserPos.x, laserPos.y);
            ctx.lineTo(laserPos.x - 20, laserPos.y - 40);
            ctx.lineTo(laserPos.x + 20, laserPos.y - 40);
            ctx.fill();
            
            // Paprsek
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(laserPos.x, laserPos.y); ctx.lineTo(laserPos.x, 0); ctx.stroke();
        }
    }
}

function drawUI() {
    // Nadpisy
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = "900 80px Arial Black";
    ctx.lineWidth = 8; ctx.strokeStyle = '#000';
    
    ctx.strokeText("WHAT DO YOU PREFER?", W/2, 120);
    ctx.fillText("WHAT DO YOU PREFER?", W/2, 120);
    
    // Timer / Status
    let statusText = state === "VOTE" ? `TIME: ${Math.ceil(roundTimer)}` : state === "SHRED" ? "LOSERS DESTROYED!" : state === "CNC" ? "ENGRAVING MVP..." : "ROUND OVER";
    let statusColor = state === "VOTE" && roundTimer <= 10 ? '#FF4136' : '#FFDC00';
    
    ctx.font = "900 50px Arial Black";
    ctx.strokeStyle = '#000'; ctx.strokeText(statusText, W/2, 220);
    ctx.fillStyle = statusColor; ctx.fillText(statusText, W/2, 220);

    // Dvě poloviny
    if(state === "VOTE" || state === "SHRED") {
        // A Option
        ctx.fillStyle = OPTIONS.A.color;
        ctx.fillRect(40, 250, 480, 150);
        ctx.strokeRect(40, 250, 480, 150);
        ctx.fillStyle = '#fff'; ctx.font = "900 60px Arial Black";
        ctx.fillText(`[A] ${OPTIONS.A.emoji} ${OPTIONS.A.title}`, 280, 350);
        
        // B Option
        ctx.fillStyle = OPTIONS.B.color;
        ctx.fillRect(560, 250, 480, 150);
        ctx.strokeRect(560, 250, 480, 150);
        ctx.fillStyle = '#fff';
        ctx.fillText(`[B] ${OPTIONS.B.emoji} ${OPTIONS.B.title}`, 800, 350);
        
        // Počítadla
        let countA = balls.filter(b => b.side === 'A').length;
        let countB = balls.filter(b => b.side === 'B').length;
        let total = countA + countB || 1;
        
        ctx.font = "900 70px Arial";
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000';
        ctx.strokeText(`${Math.round(countA/total*100)}%`, 280, 480); ctx.fillText(`${Math.round(countA/total*100)}%`, 280, 480);
        ctx.strokeText(`${Math.round(countB/total*100)}%`, 800, 480); ctx.fillText(`${Math.round(countB/total*100)}%`, 800, 480);
    }
}

function draw() {
    let now = performance.now();
    let dt = Math.min((now - lastTime) / 1000, 0.05); // Limit dt proti lag spike
    lastTime = now;
    
    // Čisté Chroma zelené pozadí
    ctx.fillStyle = '#00FF00';
    ctx.fillRect(0, 0, W, H);
    
    // State machine
    if(state === "VOTE") {
        roundTimer -= dt;
        if(roundTimer <= 0) {
            state = "SHRED";
            roundTimer = 3; // Shredding trvá 3s
            playTone(100, 'sawtooth', 2.0, 0.2); // Basový hluk drcení
        }
    } else if(state === "SHRED") {
        roundTimer -= dt;
        // Poražená strana propadá floor
        let loseSide = getWinningSide() === 'A' ? 'B' : 'A';
        for(let b of balls) {
            if(b.side === loseSide) b.vy += 5000 * dt; // Rychlý propad do pekla
            if(b.y > H + 100) b.active = false;
        }
        if(roundTimer <= 0) startCNC();
    } else if(state === "CNC") {
        let speedMult = 1.0 + (isGoldPlated ? 1.0 : 0); // Zlatá jede rychleji
        cncProgress += (dt / 15.0) * speedMult; // 15 sekund default
        if(cncProgress >= 1.0) {
            cncProgress = 1.0;
            state = "RESULTS";
            roundTimer = 5;
            playTone(800, 'sine', 0.1); setTimeout(() => playTone(1200, 'sine', 0.5), 150); // Win znělka
        }
    } else if(state === "RESULTS") {
        roundTimer -= dt;
        if(roundTimer <= 0) {
            // Reset do nového kola
            state = "VOTE"; roundTimer = ROUND_TIME;
            balls = []; particles = []; players = {};
            isGoldPlated = false; mvpPlayer = null;
        }
    }
    
    updatePhysics(dt);
    updateParticles(dt);
    
    // Render Balls
    if(state === "VOTE" || state === "SHRED") {
        // Dělící čára
        ctx.fillStyle = '#111'; ctx.fillRect(530, 250, 20, 1400);
        // Podlaha
        ctx.fillStyle = '#222'; ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
        
        for(let b of balls) if(b.active) drawBall(b);
    }
    
    if(state === "CNC" || state === "RESULTS") {
        drawCNCPhase();
    }
    
    // Render Particles (Jiskry)
    for(let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1.0;
    
    drawUI();
    requestAnimationFrame(draw);
}

// ==========================================
// TIKFINITY INTEGRACE (Parser a Socket)
// ==========================================
let socket;
function connectTikfinity() {
    socket = new WebSocket("ws://localhost:21213/");
    
    socket.onopen = () => console.log("TikFinity Connected!");
    socket.onclose = () => setTimeout(connectTikfinity, 5000);
    
    socket.onmessage = (e) => {
        try {
            let msg = JSON.parse(e.data);
            let event = msg.event || msg.type || "";
            let data = msg.data || msg;
            
            let name = data.nickname || data.uniqueId || "User";
            let userId = data.uniqueId || data.userId || name;
            let avatar = data.profilePictureUrl || "";
            
            // Registrace hráče do paměti kola
            if(!players[userId]) {
                players[userId] = { name: name, avatar: avatar, likes: 0, gifts: 0, voted: false };
            }
            let p = players[userId];
            
            if(event === "chat" && state === "VOTE" && !p.voted) {
                let text = (data.comment || data.text || "").toUpperCase().trim();
                if(text === 'A' || text === 'B') {
                    p.voted = true;
                    spawnBall(userId, name, avatar, text);
                }
            }
            else if(event === "like" && state === "CNC") {
                // Lajky během CNC zrychlují výrobu
                p.likes += (data.likeCount || 1);
                cncProgress += 0.02; // Okamžitý skok progressu
            }
            else if(event === "gift") {
                p.gifts += (data.diamondCount || data.coins || 1);
                // Dárek přepne materiál na zlato
                if(state === "CNC" && !isGoldPlated) {
                    isGoldPlated = true;
                    playTone(600, 'square', 0.5, 0.1); // Gold upgrade sound
                }
            }
        } catch(err) {}
    };
}

// ==========================================
// OVLÁDÁNÍ (Klávesové zkratky a Admin Panel)
// ==========================================
document.addEventListener('keydown', (e) => {
    let key = e.key.toLowerCase();
    if(key === 'h') {
        let pnl = document.getElementById('admin-panel');
        pnl.style.display = pnl.style.display === 'none' || pnl.style.display === '' ? 'block' : 'none';
    }
});

// Admin Tlačítka
document.getElementById('btn-sound').onclick = unlockAudio;
document.getElementById('btn-voteA').onclick = () => { if(state==="VOTE") spawnBall("test1", "Tester A", "", "A"); };
document.getElementById('btn-voteB').onclick = () => { if(state==="VOTE") spawnBall("test2", "Tester B", "", "B"); };
document.getElementById('btn-like').onclick = () => { if(state==="CNC") cncProgress += 0.05; };
document.getElementById('btn-gift').onclick = () => { isGoldPlated = true; };
document.getElementById('btn-end').onclick = () => { if(state==="VOTE") roundTimer = 0; };

// INIT
connectTikfinity();
requestAnimationFrame(draw);

</script>
</body>
</html>
