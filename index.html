<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxinko FRONTIER</title><style>html,body{margin:0;background:#00ff00;color:white;font-family:Arial}</style></head><body><noscript>Zapni JavaScript pro spuštění hry.</noscript><script>
/* GALAXINKO FRONTIER 3.0 — standalone Canvas game, no external libraries.
   Chat: MODRA / CERVENA / JOIN, 1 / 2 / 3, TURBO / STIT / OPRAV.
   TikFinity Desktop ws://localhost:21213/. H opens streamer controls.
   Node: require('./sketch.js') exposes the same simulation used by the browser.
*/
(function(root) {
  'use strict';
  const VERSION='5.0 NEBULA', ROUND_MS=90000, BREAK_MS=10000, ACTIVE_MS=300000, MAX_PLAYERS=500;
  let LANG='cs';
  const L=(cs,en)=>LANG==='en'?en:cs;
  const setLanguage=lang=>{LANG=lang==='en'?'en':'cs';TEAM[0]=L(L("MODŘÍ","BLUE"),'BLUE');TEAM[1]=L(L("ČERVENÍ","RED"),'RED');};
  const TEAM=[L("MODŘÍ","BLUE"),L("ČERVENÍ","RED")], COLOR=['#5cd9ff','#ff7496'];
  const NODES=[{x:315,y:695,name:'AURORA'},{x:765,y:845,name:'NOVA'},{x:385,y:1050,name:'ATLAS'}];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const numeric=(v,f=0)=>Number.isFinite(Number(v))?Number(v):f;
  const clean=s=>Array.from(String(s??'').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2060-\u206f]/g,'').trim()).slice(0,24).join('')||'Pilot';
  const command=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/^!/, '');
  function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
  function packet(raw) {
    if(!raw || typeof raw!=='object' || !raw.data || typeof raw.data!=='object')return null;
    const type=String(raw.event||raw.type||'').toLowerCase();
    if(!['chat','like','gift','follow','share','subscribe','streamend'].includes(type))return null;
    const d=raw.data,u=d.user||d,g=d.giftDetails||d.extendedGiftInfo||d.gift||{};
    if(type==='streamend')return {type};
    const id=u.uniqueId??d.uniqueId??u.userId??d.userId;
    if(id===undefined||id===null||!String(id).length||String(id).length>180)return null;
    const repeat=Math.floor(clamp(numeric(d.repeatCount,1),1,1000000));
    const end=[true,1,'true'].includes(d.repeatEnd);
    if(type==='gift' && numeric(d.giftType??g.giftType??g.type)===1&&!end)return null;
    const mid=d.msgId??d.common?.msgId;
    const unit=clamp(numeric(d.diamondCount??g.diamondCount??g.diamond_count,0),0,1000000);
    const coins=Math.min(1000000000,unit*repeat);
    return {type,id:String(id),name:clean(u.nickname||d.nickname||u.uniqueId||d.uniqueId),
      coins,giftName:clean(d.giftName??g.giftName??g.name??L('Dárek','Gift')),
      text:String(d.comment||'').slice(0,300),repeat,likeCount:clamp(numeric(d.likeCount,1),1,10000),
      eventId:mid==null?null:type+':'+mid+(type==='gift'?':'+repeat+':'+end:'')};
  }

  class Game {
    constructor(options={}) {
      this.emit=options.emit||(()=>{});this.demo=!!options.demo;
      this.players=new Map();this.seen=new Map();this.nodes=NODES.map(n=>({...n,control:0,owner:-1}));
      this.now=0;this.phase='lobby';this.round=0;this.ends=0;this.scores=[0,0];this.wins=[0,0];
      this.raiders=[];this.wave=0;this.started=0;this.result=null;this.final=false;this.shots=[];this.feed=[];this.ack=null;
      this.nextBotThink=0;this.nextSweep=0;this.lastLead=-1;this.lastLeadNotice=-Infinity;
      this.social=new Map();this.supportAt=[-Infinity,-Infinity];this.rally=[0,0];this.rallyAt=[-Infinity,-Infinity];this.quest=[0,0];this.questDone=[false,false];this.totalSupport=0;
      this.stats={events:0,gifts:0,rounds:0,commands:0,rejected:0};
    }
    notice(text,team=-1,kind='info') {
      this.feed.unshift({text,team,kind,at:this.now});if(this.feed.length>5)this.feed.pop();
      this.emit({kind:'notice',text,team});
    }
    acknowledge(p,text,kind='action') {
      this.ack={name:p.name,id:p.id,text,team:p.team,kind,at:this.now};
      this.emit({kind:'ack',team:p.team,text});
    }
    add(id,name,team,bot=false) {
      if(this.players.has(id))return this.players.get(id);
      if(this.players.size>=MAX_PLAYERS){const drone=!bot&&[...this.players.values()].find(p=>p.bot);if(drone)this.players.delete(drone.id);else {const stale=[...this.players.values()].find(x=>this.now-x.last>=ACTIVE_MS);if(stale)this.players.delete(stale.id);else return null;}}
      const h=hash(id),base=team===0?{x:165,y:585}:{x:915,y:585};
      const p={id,name:clean(name),team,bot,target:h%3,hp:100,x:base.x,y:base.y,
        last:this.now,angle:(h%628)/100,shootAt:this.now+900+(h%600),respawn:0,
        turboUntil:0,shieldUntil:0,goldUntil:0,cool:{turbo:0,stit:0,oprav:0},
        buildAt:-Infinity,routeAt:-Infinity,tapAt:-Infinity,lastChat:-Infinity,contribution:0,kills:0,
        rank:0,career:0,played:0,joinedRound:this.round,teamLocked:false,recent:this.now};
      this.players.set(id,p);return p;
    }
    humans() {return [...this.players.values()].filter(p=>!p.bot&&this.now-p.last<ACTIVE_MS);}
    start(now) {
      this.now=now;this.phase='playing';this.round++;this.ends=now+ROUND_MS;this.final=false;
      this.quest=[0,0];this.questDone=[false,false];this.started=now;this.wave=0;this.raiders=[];this.scores=[0,0];this.result=null;this.shots=[];this.lastLead=-1;
      this.nodes.forEach(n=>{n.control=0;n.owner=-1;n.level=1;n.build=0;n.armor=100;n.fireAt=0;});
      for(const [id,p] of this.players) {
        if(!p.bot && now-p.last>=ACTIVE_MS){this.players.delete(id);continue;}
        p.buildAt=-Infinity;p.hp=100;p.respawn=0;p.contribution=0;p.kills=0;p.teamLocked=false;
        p.cool={turbo:0,stit:0,oprav:0};p.turboUntil=0;p.shieldUntil=now+1500;p.shootAt=now+1000;
        p.x=p.team===0?165:915;p.y=585;
      }
      this.notice(L("Obsaďte majáky. Držené majáky vyrábějí energii.","Capture towers. Your towers generate energy."));
      this.emit({kind:'round'});
    }
    accept(e,now) {
      this.now=now;
      if(!e||!e.id)return false;
      if(e.eventId){if(this.seen.has(e.eventId))return false;this.seen.set(e.eventId,now);if(this.seen.size>6000)this.seen.delete(this.seen.keys().next().value);}
      this.stats.events++;
      let p=this.players.get(e.id);
      if(e.type==='gift'||e.type==='subscribe') {
        if(!p){const counts=[0,0];for(const x of this.humans())counts[x.team]++;p=this.add(e.id,e.name,counts[0]<=counts[1]?0:1);}
        if(p){p.last=now;p.goldUntil=now+60000;p.recent=now;}
        const repeats=Math.floor(clamp(numeric(e.repeat,1),1,1000000));
        if(e.type==='gift')this.stats.gifts+=repeats;
        const coins=clamp(numeric(e.coins),0,1000000000),tier=e.type==='subscribe'?2:coins>=100?3:coins>=10?2:1;
        this.totalSupport+=e.type==='gift'?coins:0;
        let bonus=false;
        if(p&&this.phase==='playing'&&now<this.ends&&now-this.supportAt[p.team]>=20000){
          this.supportAt[p.team]=now;bonus=true;
          for(const ally of this.players.values())if(ally.team===p.team&&ally.hp>0){ally.hp=Math.min(100,ally.hp+(tier===1?5:10));if(tier===3)ally.shieldUntil=Math.max(ally.shieldUntil,now+2000);}
          if(tier>=2)for(const n of this.nodes)if(n.owner===p.team)n.armor=Math.min(100,n.armor+20);
        }
        const team=p?p.team:-1;
        this.ack={name:e.name,id:e.id,text:bonus?L('ZÁSOBY DORAZILY • TÝMOVÁ OPRAVA','SUPPLIES ARRIVED • TEAM REPAIR'):L('DĚKUJEME • SPECIÁLNÍ PRŮLET','THANK YOU • SPECIAL FLYBY'),team,kind:'gift',at:now};
        this.emit({kind:'gift',name:e.name,team,tier,coins,bonus});return true;
      }
      if(e.type==='share'||e.type==='follow') {
        const key=e.type+':'+e.id,last=this.social.get(key)??-Infinity;
        if(now-last<(e.type==='share'?60000:3600000))return true;
        this.social.set(key,now);if(this.social.size>3000)this.social.delete(this.social.keys().next().value);
        if(p)p.last=now;
        if(e.type==='share'&&p&&this.phase==='playing'&&now<this.ends){
          this.rally[p.team]=Math.min(5,this.rally[p.team]+1);
          if(this.rally[p.team]>=5&&now-this.rallyAt[p.team]>=30000){
            this.rally[p.team]=0;this.rallyAt[p.team]=now;
            for(const ally of this.players.values())if(ally.team===p.team&&ally.hp>0)ally.hp=Math.min(100,ally.hp+15);
            for(const n of this.nodes)if(n.owner===p.team)n.armor=Math.min(100,n.armor+15);
            this.notice(TEAM[p.team]+L(' • SIGNÁL SDÍLENÍ: OPRAVA POSÁDKY',' • SHARE SIGNAL: CREW REPAIR'),p.team);this.emit({kind:'rally',team:p.team});
          }else this.notice(e.name+L(' sdílí • týmový signál ',' shared • team signal ')+this.rally[p.team]+'/5',p.team);
        }else this.notice(e.name+(e.type==='follow'?L(' se přidává k výpravě!',' follows the expedition!'):L(' sdílí výpravu!',' shared the expedition!')));
        if(e.type==='follow'&&p&&p.hp>0&&this.phase==='playing'&&now<this.ends)p.shieldUntil=Math.max(p.shieldUntil,now+2500);
        this.emit({kind:'social',team:p?p.team:-1});return true;
      }
      if(!['chat','like'].includes(e.type))return false;
      const cmd=command(e.text);
      const wanted=/^(modra|modri|blue)$/.test(cmd)?0:/^(cervena|cerveni|red)$/.test(cmd)?1:-1;
      if(!p) {
        const h=this.humans(),a=h.filter(x=>x.team===0).length,b=h.length-a;
        const team=wanted>=0?wanted:a===b?hash(e.id)%2:a<b?0:1;
        p=this.add(e.id,e.name,team);if(!p){this.stats.rejected++;return false;}
        this.acknowledge(p,L("PŘIPOJENO • MAJÁK ","JOINED • TOWER ")+(p.target+1),'join');
        this.notice(p.name+L(" posiluje "," joins ")+TEAM[p.team]+'.',p.team);
      }
      p.name=clean(e.name);p.last=now;
      if(this.phase==='lobby')this.start(now);
      // Events arriving after the deadline cannot alter the already earned result.
      if(this.phase==='playing'&&now>=this.ends)this.finish();
      if(e.type==='chat'&&wanted>=0) {
        if(this.phase==='results'||!p.teamLocked) {
          if(p.team!==wanted){p.team=wanted;p.x=wanted===0?165:915;p.y=585;}
          this.acknowledge(p,TEAM[p.team]+L(" • MAJÁK "," • TOWER ")+(p.target+1),'join');
        } else this.acknowledge(p,L("TÝM ZMĚNÍŠ MEZI KOLY","CHANGE TEAMS BETWEEN ROUNDS"),'cooldown');
        return true;
      }
      if(this.phase!=='playing')return true;
      if(e.type==='like') {
        if(now-p.tapAt<5000)return true;p.tapAt=now;
        if(p.hp>0){p.turboUntil=Math.max(p.turboUntil,now+1800);this.acknowledge(p,L("IMPULS • RYCHLEJŠÍ OBSAZOVÁNÍ","IMPULSE • FASTER CAPTURE"));}
        return true;
      }
      if(now-p.lastChat<700)return true;p.lastChat=now;
      if(/^[123]$/.test(cmd)) {
        if(now-p.routeAt<1500)return true;p.routeAt=now;p.target=Number(cmd)-1;p.recent=now;
        this.acknowledge(p,L("LETÍŠ K MAJÁKU ","FLYING TO TOWER ")+cmd);this.stats.commands++;return true;
      }
      if(cmd==='stav'||cmd==='build') {
        const n=this.nodes[p.target];
        if(p.hp<=0||n.owner!==p.team||Math.hypot(p.x-n.x,p.y-n.y)>190){this.acknowledge(p,L("STAV: PŘILEŤ K VLASTNÍ VĚŽI","BUILD: MOVE TO YOUR TEAM'S TOWER"),'cooldown');return true;}
        if(now-p.buildAt<12000){this.acknowledge(p,L("STAV ZA ","BUILD IN ")+Math.ceil((12000-now+p.buildAt)/1000)+' s','cooldown');return true;}
        if(n.level===3&&n.armor===100){this.acknowledge(p,L("VĚŽ JE PLNĚ VYLEPŠENÁ","TOWER FULLY UPGRADED"),'cooldown');return true;}
        p.buildAt=now;n.armor=Math.min(100,n.armor+35);p.contribution+=4;this.stats.commands++;
        if(n.level<3){n.build++;if(n.build>=2){n.level++;n.build=0;this.emit({kind:'capture',x:n.x,y:n.y,team:p.team});}}
        this.acknowledge(p,L("VĚŽ ","TOWER ")+(p.target+1)+' • LV '+n.level+L(" • "," • ")+(n.level<3?n.build+L("/2 STAV","/2 BUILD"):'MAX')+L(" • ŠTÍT "," • SHIELD ")+Math.round(n.armor)+' %');return true;
      }
      const skill=({turbo:'turbo',utok:'turbo',boost:'turbo',stit:'stit',shield:'stit',oprav:'oprav',lecit:'oprav',heal:'oprav',repair:'oprav'})[cmd];
      if(skill) {
        if(p.hp<=0){this.acknowledge(p,L("NÁVRAT ZA ","RESPAWN IN ")+Math.max(1,Math.ceil((p.respawn-now)/1000))+' s','cooldown');return true;}
        if(now<p.cool[skill]){this.acknowledge(p,({turbo:'TURBO',stit:L('ŠTÍT','SHIELD'),oprav:L('OPRAV','REPAIR')})[skill]+L(" ZA "," IN ")+Math.ceil((p.cool[skill]-now)/1000)+' s','cooldown');return true;}
        if(skill==='oprav'&&p.hp>=100){this.acknowledge(p,L("LOĎ JE V POŘÁDKU • 100 HP","SHIP AT FULL HEALTH • 100 HP"),'cooldown');return true;}
        p.cool[skill]=now+12000;
        if(skill==='turbo')p.turboUntil=now+4000;
        if(skill==='stit')p.shieldUntil=now+5000;
        if(skill==='oprav')p.hp=Math.min(100,p.hp+45);
        p.recent=now;this.stats.commands++;
        this.acknowledge(p,skill==='turbo'?L("TURBO 4 s • DVOJNÁSOBNÝ VÝKON","TURBO 4 s • DOUBLE CAPTURE POWER"):skill==='stit'?L("ŠTÍT 5 s • BLOKUJE ZÁSAHY","SHIELD 5 s • BLOCKS HITS"):L("OPRAVENO • ","REPAIRED • ")+Math.ceil(p.hp)+' HP');
      }
      return true;
    }
    balanceBots() {
      const humans=this.humans(),counts=[0,0];humans.forEach(p=>counts[p.team]++);
      // Explicit training drones: only fill a sparse side, at most 3 per team.
      const goal=Math.max(2,Math.min(3,...counts.map(n=>Math.max(n,2))));
      for(let team=0;team<2;team++){
        const want=this.demo?3:Math.min(3,Math.max(0,goal-counts[team]));
        const bots=[...this.players.values()].filter(p=>p.bot&&p.team===team);
        while(bots.length>want){const b=bots.pop();this.players.delete(b.id);}
        for(let i=0;i<want;i++)if(!this.players.has('drone-'+team+'-'+i))this.add('drone-'+team+'-'+i,L("DRON ","DRONE ")+(i+1),team,true);
      }
    }
    defense(now,dt,live) {
      const schedule=[18000,42000,66000];
      if(this.wave<3&&now-this.started>=schedule[this.wave]) {
        this.wave++;
        for(let i=0;i<3;i++)for(let j=0;j<(this.wave===3?1:3);j++){
          const boss=this.wave===3,scale=1+Math.min(8,live.filter(p=>!p.bot&&p.target===i).length/12),hp=Math.round((boss?400:65+this.wave*15)*scale);
          this.raiders.push({x:i===1?985:95,y:(i===2?1140:i===1?590:550)+j*(i===2?-65:65),target:i,hp,max:hp,boss,hitAt:0,slowUntil:0});
        }
        this.notice(this.wave===3?L("BOSSOVÉ! BRAŇTE SVÉ VĚŽE","BOSSES! DEFEND YOUR TOWERS"):L("NÁJEZD ","WAVE ")+this.wave+L(" / 3 • BRAŇTE VĚŽE"," / 3 • DEFEND THE TOWERS"));
        this.emit({kind:'wave',wave:this.wave});
      }
      const damage=(r,amount,team,x,y,kind,p)=>{
        r.hp=Math.max(0,r.hp-amount);
        this.shots.push({x,y,tx:r.x,ty:r.y,team,at:now,blocked:false,weapon:kind});
        if(r.hp===0){this.scores[team]+=r.boss?100:15;if(p){p.contribution+=r.boss?25:5;p.kills++;}
          this.emit({kind:'down',x:r.x,y:r.y,team});}
      };
      for(let i=0;i<3;i++){
        const n=this.nodes[i],targets=this.raiders.filter(r=>r.target===i&&r.hp>0);
        if(n.owner>=0&&now>=n.fireAt&&targets.length){
          const r=targets.reduce((a,b)=>Math.hypot(a.x-n.x,a.y-n.y)<Math.hypot(b.x-n.x,b.y-n.y)?a:b);
          n.fireAt=now+(i===1?700:1100);damage(r,(i===1?13:20)*n.level,n.owner,n.x,n.y-90,i);
          if(i===0)for(const extra of targets.filter(e=>e!==r&&e.hp>0&&Math.hypot(e.x-r.x,e.y-r.y)<130).slice(0,2))damage(extra,9*n.level,n.owner,r.x,r.y,0);
          if(i===2)r.slowUntil=now+1500;
        }
      }
      for(const p of live){
        if(p.hp<=0||now<p.shootAt)continue;
        const r=this.raiders.find(r=>r.hp>0&&r.target===p.target&&Math.hypot(p.x-r.x,p.y-r.y)<260);
        if(r){p.shootAt=now+(p.turboUntil>now?500:1000);damage(r,p.bot?9:20,p.team,p.x,p.y,3,p);}
      }
      for(const r of this.raiders){
        if(r.hp<=0)continue;const n=this.nodes[r.target],dx=n.x-r.x,dy=n.y-r.y,d=Math.hypot(dx,dy);
        if(d>85){const step=Math.min(d-85,(r.boss?47:65)*(r.slowUntil>now?.4:1)*dt);r.x+=dx/d*step;r.y+=dy/d*step;}
        else if(n.owner>=0&&now>=r.hitAt){
          r.hitAt=now+1500;n.armor=Math.max(0,n.armor-(r.boss?24:10));
          this.emit({kind:'impact',x:n.x,y:n.y,team:n.owner});
          if(n.armor===0){this.notice(n.name+L(" PADLA • ZNOVU JI OBSAĎTE"," FELL • CAPTURE IT AGAIN"));n.owner=-1;n.control=0;n.level=1;n.build=0;n.armor=100;}
        }
      }
      this.raiders=this.raiders.filter(r=>r.hp>0);if(this.shots.length>180)this.shots.splice(0,this.shots.length-180);
    }
    finish() {
      if(this.phase!=='playing')return;
      const values=this.scores.map(Math.round),winner=values[0]===values[1]?-1:values[0]>values[1]?0:1;
      if(winner>=0)this.wins[winner]++;
      this.result={scores:values,winner,round:this.round,top:[...this.players.values()].filter(p=>!p.bot&&p.contribution>0)
        .sort((a,b)=>b.contribution-a.contribution).slice(0,3).map(p=>({id:p.id,name:p.name,team:p.team,points:Math.round(p.contribution),kills:p.kills}))};
      for(const p of this.players.values())if(!p.bot&&p.contribution>0){p.career+=Math.round(p.contribution);p.played++;p.rank=Math.min(9,Math.floor(Math.sqrt(p.career/100)));}
      this.phase='results';this.restartAt=this.now+BREAK_MS;this.stats.rounds++;this.shots=[];
      this.emit({kind:'result',result:this.result});
    }
    tick(now,dt) {
      this.now=now;
      if(now>=this.nextSweep){
        this.nextSweep=now+10000;
        for(const [id,p] of this.players)if(!p.bot&&now-p.last>=ACTIVE_MS)this.players.delete(id);
        for(const [k,t]of this.social)if(now-t>3600000)this.social.delete(k);
        for(const [k,t]of this.seen)if(now-t>300000)this.seen.delete(k);
      }
      if(this.phase==='results'){
        if(now>=this.restartAt){if(this.humans().length||this.demo)this.start(now);else this.phase='lobby';}
        return;
      }
      if(this.phase!=='playing')return;
      if(now>=this.ends){this.finish();return;}
      dt=clamp(dt,0,.1);
      if(!this.final&&this.ends-now<=15000){this.final=true;this.notice(L("FINÁLE • MAJÁKY VYRÁBĚJÍ 2× ENERGII","FINALE • TOWERS GENERATE 2× ENERGY"));this.emit({kind:'final'});}
      if(now>=this.nextBotThink){
        this.nextBotThink=now+2200;this.balanceBots();
        for(const p of this.players.values())if(p.bot){
          const ranked=this.nodes.map((n,i)=>({i,value:(p.team===0?n.control:-n.control)+(hash(p.id+Math.floor(now/9000)+i)%60)})).sort((a,b)=>a.value-b.value);
          if(hash(p.id+Math.floor(now/2200))%3===0)p.target=ranked[0].i;
        }
      }
      const live=[...this.players.values()].filter(p=>p.bot||now-p.last<ACTIVE_MS);
      const counts=this.nodes.map(()=>[[],[]]);
      for(const p of live){
