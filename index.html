<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    background: #04060e;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #050711;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 9 / 16;
    box-shadow: 0 0 60px rgba(0, 225, 255, 0.25);
    display: block;
  }
  #sound-unlock {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #ff1e56, #ff9f1c);
    color: #fff;
    font-weight: 900;
    font-size: 15px;
    padding: 10px 22px;
    border-radius: 999px;
    border: 2px solid #fff;
    box-shadow: 0 6px 25px rgba(255, 30, 86, 0.65);
    cursor: pointer;
    z-index: 100;
    letter-spacing: 0.6px;
    animation: pulseBtn 1.2s infinite alternate;
  }
  @keyframes pulseBtn {
    from { transform: translateX(-50%) scale(1); }
    to { transform: translateX(-50%) scale(1.06); }
  }
  #debug-panel {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 310px;
    background: rgba(8, 12, 26, 0.94);
    border: 1px solid rgba(0, 229, 255, 0.45);
    border-radius: 14px;
    padding: 14px;
    color: #e2f1ff;
    font-size: 13px;
    z-index: 99;
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.65);
    display: none;
  }
  #debug-panel h3 {
    font-size: 14px;
    color: #00e5ff;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dbg-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .dbg-btn {
    flex: 1;
    min-width: 85px;
    background: #142242;
    color: #fff;
    border: 1px solid #2b4c8c;
    padding: 7px 9px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
    transition: 0.15s;
  }
  .dbg-btn:hover { background: #1f376b; border-color: #00e5ff; }
  .dbg-btn.red { background: #4a1225; border-color: #ff2a5f; }
  .dbg-btn.blue { background: #0e2d4a; border-color: #00c8ff; }
  .dbg-status {
    font-size: 11px;
    color: #9ab3d1;
    line-height: 1.45;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 8px;
    margin-top: 4px;
  }

// ============================================================================
// 2. AUDIO & VOICE ENGINE (WebAudio Keep-Alive + LipSync Pulse + TTS)
// ============================================================================
class ImmortalAudioEngine {
  constructor() {
    this.ctx = null;
    this.unlocked = false;
    this.keepAliveOsc = null;
    this.lastSpeakTime = 0;
  }

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    // Sub-audible keep-alive signal so Chrome & OBS never put the audio bus to sleep
    if (!this.keepAliveOsc && this.ctx) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.frequency.value = 24;
      gain.gain.value = 0.0005;
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      this.keepAliveOsc = osc;
    }
    this.unlocked = true;
    const btn = document.getElementById('sound-unlock');
    if (btn) btn.style.display = 'none';
  }

  ensureReady() {
    if (!this.ctx) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  }

  playImpact(heavy = false) {
    if (!this.ensureReady()) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = heavy ? 'sawtooth' : 'triangle';
    osc.frequency.setValueAtTime(heavy ? 135 : 210, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + (heavy ? 0.16 : 0.09));
    gain.gain.setValueAtTime(heavy ? 0.28 : 0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (heavy ? 0.16 : 0.09));
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + (heavy ? 0.17 : 0.1));
  }

  playSpawn(isRealPlayer = true) {
    if (!this.ensureReady()) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(isRealPlayer ? 320 : 220, now);
    osc.frequency.exponentialRampToValueAtTime(isRealPlayer ? 680 : 310, now + 0.14);
    gain.gain.setValueAtTime(isRealPlayer ? 0.22 : 0.05, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  playKO() {
    if (!this.ensureReady()) return;
    const now = this.ctx.currentTime;
    [110, 165, 220, 330].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now + idx * 0.06);
      osc.frequency.exponentialRampToValueAtTime(55, now + idx * 0.06 + 0.45);
      gain.gain.setValueAtTime(0.2, now + idx * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.46);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.06);
      osc.stop(now + idx * 0.06 + 0.48);
    });
  }

  // Generates distinct syllable amplitude bursts in WebAudio so Veadotube ALWAYS moves its mouth
  // even if Chrome's speechSynthesis gets muted or delayed in background
  playLipSyncSyllables(wordCount = 4) {
    if (!this.ensureReady()) return;
    const now = this.ctx.currentTime;
    const syllables = Math.min(12, Math.max(2, wordCount * 2));
    for (let i = 0; i < syllables; i++) {
      const t = now + i * 0.13;
      const osc = this.ctx.createOscillator();
      const filter = this.ctx.createBiquadFilter();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(145 + (i % 3) * 28, t);
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(620 + (i % 4) * 180, t);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.11, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }
  }

  speak(text, force = false) {
    const nowMs = performance.now();
    if (!force && nowMs - this.lastSpeakTime < 2200) return;
    this.lastSpeakTime = nowMs;

    const words = text.trim().split(/\s+/).length;
    this.playLipSyncSyllables(words);

    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.resume();
        if (force) window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 1.08;
        u.pitch = 1.02;
        u.volume = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
        if (enVoice) u.voice = enVoice;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
  }
}

function createBall({ side, name, isBot = false, radius = 74, mass = 6.5, avatarUrl = null, isCombo = false }) {
  const minX = side === 'A' ? ARENA.left + 85 : wallX + 75;
  const maxX = side === 'A' ? wallX - 75 : ARENA.right - 85;
  const x = Math.max(ARENA.left + radius + 30, Math.min(ARENA.right - radius - 30,
    minX + Math.random() * Math.max(20, maxX - minX)
  ));
  const y = ARENA.top + 70 + Math.random() * 140;

  const ball = {
    id: Math.random().toString(36).slice(2),
    side,
    name: isBot ? "" : name,
    isBot,
    isCombo,
    r: radius,
    mass,
    x,
    y,
    vx: (side === 'A' ? 1 : -1) * (120 + Math.random() * 90),
    vy: 180 + Math.random() * 120,
    avatarUrl,
    seed: Math.floor(Math.random() * 999),
    youTimer: isBot ? 0 : 7.0,
    shredded: false
  };
  balls.push(ball);
  audio.playSpawn(!isBot);
  return ball;
}

function spawnParticles(x, y, color, count = 12, speed = 380) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (0.3 + Math.random() * 0.7) * speed;
    sparks.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 80,
      life: 0.35 + Math.random() * 0.35,
      maxLife: 0.7,
      color,
      size: 3 + Math.random() * 5
    });
  }
}

function addFloatingText(x, y, text, color = "#fff", size = 30) {
  floatingTexts.push({ x, y, text, color, size, life: 1.25 });
}

function pushFeed(text, side) {
  recentFeed.unshift({ text, side, time: performance.now() });
  if (recentFeed.length > 4) recentFeed.pop();
}

function handleViewerJoin(username, side, avatarUrl = null, boostPower = 1, reason = "CHAT") {
  if (roundState !== "BATTLE") return;
  const cleanName = (username || "Player").slice(0, 18);
  let st = playerStats.get(cleanName);

  if (!st) {
    // First action in this round -> Spawn Giant Main Ball with "⬇️ YOU!"
    const mainBall = createBall({
      side,
      name: cleanName,
      isBot: false,
      radius: 76,
      mass: 8.5 * boostPower,
      avatarUrl
    });
    st = { side, score: 15 * boostPower, combos: 1, avatarUrl, mainBall };
    playerStats.set(cleanName, st);

    addFloatingText(mainBall.x, mainBall.y - 95, `⬇️ YOU! ${cleanName}`, "#ffe600", 32);
    pushFeed(`${cleanName} joined Team ${side === 'A' ? currentMatch.nameA : currentMatch.nameB}!`, side);
    audio.speak(`${cleanName} joined ${side === 'A' ? currentMatch.nameA : currentMatch.nameB}!`);
  } else {
    // Existing player comments/likes/gifts again -> Grow Main Ball + Fire Extra Heavy Combo Cannonball
    st.side = side;
    st.combos += 1;
    st.score += 12 * boostPower;
    if (avatarUrl) st.avatarUrl = avatarUrl;

    if (st.mainBall && balls.includes(st.mainBall)) {
      st.mainBall.side = side;
      st.mainBall.r = Math.min(118, st.mainBall.r + 5 * boostPower);
      st.mainBall.mass += 2.8 * boostPower;
      st.mainBall.youTimer = 5.0;
      st.mainBall.vx += (side === 'A' ? 1 : -1) * 260;
    }

    const comboBall = createBall({
      side,
      name: cleanName,
      isBot: false,
      isCombo: true,
      radius: Math.min(88, 52 + boostPower * 6),
      mass: 5.5 * boostPower,
      avatarUrl: st.avatarUrl
    });

    const label = reason === "GIFT" ? `🎁 MEGA BOOST!` : `🔥 COMBO x${st.combos}!`;
    addFloatingText(comboBall.x, comboBall.y - 70, label, side === 'A' ? "#ff9f1c" : "#00f5d4", 30);
    pushFeed(`${cleanName} triggered ${label}`, side);
  }
}

function triggerRoundEnd(winnerSide, reasonText) {
  if (roundState === "VICTORY") return;
  roundState = "VICTORY";
  victoryTimer = 6.5;
  winningSide = winnerSide;
  victoryReason = reasonText;
  screenShake = 26;
  audio.playKO();

  // Shred losing balls in explosion of sparks
  const loserSide = winnerSide === 'A' ? 'B' : 'A';
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (b.side === loserSide) {
      spawnParticles(b.x, b.y, loserSide === 'A' ? "#ff2a5f" : "#00d4ff", 18, 520);
      balls.splice(i, 1);
    }
  }

  // Pick MVP from winning side
  let bestPlayer = null;
  for (const [name, data] of playerStats.entries()) {
    if (data.side === winnerSide) {
      if (!bestPlayer || data.score > bestPlayer.score) {
        bestPlayer = { name, ...data };
      }
    }
  }

  const winEmoji = winnerSide === 'A' ? currentMatch.emojiA : currentMatch.emojiB;
  const winTeamName = winnerSide === 'A' ? currentMatch.nameA : currentMatch.nameB;

  if (!bestPlayer) {
    const fallbackNames = ["alex.cz", "niky_live", "lukas.99", "ema.x", "tobias_tv", "viki.official"];
    bestPlayer = {
      name: fallbackNames[roundNum % fallbackNames.length],
      side: winnerSide,
      score: 30,
      avatarUrl: null
    };
  }

  mvpWinner = {
    name: bestPlayer.name,
    side: winnerSide,
    badge: winEmoji,
    teamName: winTeamName,
    avatarUrl: bestPlayer.avatarUrl,
    seed: Math.floor(Math.random() * 900)
  };

  // Add to Hall of Fame with winning topic badge
  hallOfFame.unshift(mvpWinner);
  if (hallOfFame.length > 6) hallOfFame.pop();

  audio.speak(`${reasonText}! ${winTeamName} wins! Champion is ${mvpWinner.name}!`, true);
  roundNum++;
}

// ============================================================================
// 5. PHYSICS UPDATE (Heavy Metallic Balls & Plasma Power Wall)
// ============================================================================
const GRAVITY = 1950;      // Heavy downward pull (no floaty rubber feel)
const RESTITUTION = 0.16;  // Metallic low bounce
const WALL_HalfWidth = 18;
const SAW_MARGIN = 62;     // Left & Right KO saw blades

function updatePhysics(dt) {
  gridOffset = (gridOffset + dt * 95) % 80;
  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 45);
  if (wallFlashA > 0) wallFlashA = Math.max(0, wallFlashA - dt * 3.5);
  if (wallFlashB > 0) wallFlashB = Math.max(0, wallFlashB - dt * 3.5);

  // Update background stars
  for (const s of bgStars) {
    s.y -= s.vy * dt;
    if (s.y < 0) { s.y = H; s.x = Math.random() * W; }
  }

  // Update sparks
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 900 * dt;
    p.life -= dt;
    if (p.life <= 0) sparks.splice(i, 1);
  }

  // Update floating labels
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 55 * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  if (roundState === "VICTORY") {
    victoryTimer -= dt;
    if (victoryTimer <= 0) startNewRound();
    return;
  }

  // Countdown 50s timer
  roundTimer -= dt;

  // Keep subtle bot activity balanced (max 4 small nameless drones per side)
  const botsA = balls.filter(b => b.isBot && b.side === 'A').length;
  const botsB = balls.filter(b => b.isBot && b.side === 'B').length;
  if (botsA < 4 && Math.random() < dt * 0.8) createBall({ side: 'A', name: '', isBot: true, radius: 27, mass: 1.35 });
  if (botsB < 4 && Math.random() < dt * 0.8) createBall({ side: 'B', name: '', isBot: true, radius: 27, mass: 1.35 });

  let netImpulseOnWall = 0;

  // Step balls
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    if (b.youTimer > 0) b.youTimer = Math.max(0, b.youTimer - dt);

    // Gravity
    b.vy += GRAVITY * dt;

    // Constant horizontal thruster pushing toward the center Plasma Power Wall
    const dir = b.side === 'A' ? 1 : -1;
    const driveAccel = b.isBot ? 420 : 680;
    b.vx += dir * driveAccel * dt;

    // Slight damping so velocities stay crisp and heavy
    b.vx *= Math.pow(0.88, dt);
    b.vy *= Math.pow(0.96, dt);

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Floor & ceiling collisions
    if (b.y + b.r > ARENA.bottom) {
      b.y = ARENA.bottom - b.r;
      if (Math.abs(b.vy) > 260) {
        audio.playImpact(b.r > 55);
      }
      b.vy = -b.vy * RESTITUTION;
      // Floor traction boost toward wall
      b.vx += dir * (b.isBot ? 35 : 75);
    }
    if (b.y - b.r < ARENA.top) {
      b.y = ARENA.top + b.r;
      b.vy = Math.abs(b.vy) * RESTITUTION;
    }

    // Outer arena bounds
    const leftLimit = ARENA.left + SAW_MARGIN;
    const rightLimit = ARENA.right - SAW_MARGIN;
    if (b.x - b.r < leftLimit) {
      b.x = leftLimit + b.r;
      b.vx = Math.abs(b.vx) * 0.4;
    }
    if (b.x + b.r > rightLimit) {
      b.x = rightLimit - b.r;
      b.vx = -Math.abs(b.vx) * 0.4;
    }

    // Collision with Center Plasma Power Wall
    if (b.side === 'A') {
      const wallLeftFace = wallX - WALL_HalfWidth;
      if (b.x + b.r > wallLeftFace) {
        const impactSpeed = Math.max(60, b.vx);
        b.x = wallLeftFace - b.r;
        // Heavy kick + small rebound so it rams again
        b.vx = -Math.min(210, impactSpeed * 0.25);
        b.vy -= (60 + Math.random() * 90);
        const force = b.mass * (1.2 + impactSpeed * 0.008);
        netImpulseOnWall += force;
        wallFlashA = 1.0;
        if (!b.isBot || Math.random() < 0.25) {
          spawnParticles(wallLeftFace, b.y, "#ff3b6b", b.isBot ? 3 : 8, 320);
          if (!b.isBot) screenShake = Math.min(12, screenShake + 2.2);
        }
      }
    } else {
      const wallRightFace = wallX + WALL_HalfWidth;
      if (b.x - b.r < wallRightFace) {
        const impactSpeed = Math.max(60, -b.vx);
        b.x = wallRightFace + b.r;
        b.vx = Math.min(210, impactSpeed * 0.25);
        b.vy -= (60 + Math.random() * 90);
        const force = b.mass * (1.2 + impactSpeed * 0.008);
        netImpulseOnWall -= force;
        wallFlashB = 1.0;
        if (!b.isBot || Math.random() < 0.25) {
          spawnParticles(wallRightFace, b.y, "#00e5ff", b.isBot ? 3 : 8, 320);
          if (!b.isBot) screenShake = Math.min(12, screenShake + 2.2);
        }
      }
    }
  }

  // Ball-to-Ball heavy metallic resolution (2 iterations for stability)
  for (let iter = 0; iter < 2; iter++) {
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i];
        const b = balls[j];
        if (a.side !== b.side) continue; // Separated by full-height Plasma Wall
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const minDist = a.r + b.r;
        if (distSq > 0 && distSq < minDist * minDist) {
          const dist = Math.sqrt(distSq);
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = minDist - dist;
          const totalMass = a.mass + b.mass;
          a.x -= nx * overlap * (b.mass / totalMass);
          a.y -= ny * overlap * (b.mass / totalMass);
          b.x += nx * overlap * (a.mass / totalMass);
          b.y += ny * overlap * (a.mass / totalMass);

          const kx = a.vx - b.vx;
          const ky = a.vy - b.vy;
          const p = 2 * (nx * kx + ny * ky) / totalMass;
          if (p > 0) {
            const bounce = 0.18;
            a.vx -= p * b.mass * nx * bounce;
            a.vy -= p * b.mass * ny * bounce;
            b.vx += p * a.mass * nx * bounce;
            b.vy += p * a.mass * ny * bounce;
          }
        }
      }
    }
  }

  // Move the Plasma Power Wall smoothly with heavy resistance
  wallVel += netImpulseOnWall * 1.65;
  wallVel *= Math.pow(0.06, dt); // Heavy hydraulic damping
  wallX += wallVel * dt;

  // Check Instant Knockout against Left or Right Plasma Saws
  const koLeftX = ARENA.left + SAW_MARGIN + 42;
  const koRightX = ARENA.right - SAW_MARGIN - 42;

  if (wallX >= koRightX) {
    wallX = koRightX;
    triggerRoundEnd('A', '💥 INSTANT KNOCKOUT!');
    return;
  }
  if (wallX <= koLeftX) {
    wallX = koLeftX;
    triggerRoundEnd('B', '💥 INSTANT KNOCKOUT!');
    return;
  }

  // Check 50s timer expiration
  if (roundTimer <= 0) {
    roundTimer = 0;
    const winSide = wallX >= ARENA.centerX ? 'A' : 'B';
    triggerRoundEnd(winSide, '⏱️ TIME OVER VICTORY!');
  }
}

// ============================================================================
// 6. RENDERING HELPERS (Auto-Fitted Text, Rounded Cards, Cyber Grid)
// ============================================================================
function drawRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Automatically shrinks font size so long labels (e.g. NIGHT OWL vs EARLY BIRD) NEVER overflow
function drawFittedText(text, x, y, maxWidth, maxFontSize, minFontSize = 14, weight = "900", align = "center") {
  let size = maxFontSize;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  while (size > minFontSize) {
    ctx.font = `${weight} ${size}px 'Segoe UI', sans-serif`;
    if (ctx.measureText(text).width <= maxWidth) break;
    size -= 2;
  }
  ctx.fillText(text, x, y);
}

function drawAvatarCircle(x, y, r, name, avatarUrl, borderColor, seed = 1) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();

  const img = getAvatarImage(avatarUrl);
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
  } else {
    const hue = (seed * 57) % 360;
    const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    grad.addColorStop(0, `hsl(${hue}, 80%, 58%)`);
    grad.addColorStop(1, `hsl(${(hue + 40) % 360}, 85%, 26%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);

    const initials = (name || "P").replace(/[^a-zA-Z0-9]/g, "").slice(0, 2).toUpperCase() || "★";
    ctx.fillStyle = "#fff";
    ctx.font = `900 ${Math.floor(r * 0.85)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(initials, x, y + 2);
  }
  ctx.restore();

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.lineWidth = Math.max(3, r * 0.1);
  ctx.strokeStyle = borderColor;
  ctx.stroke();
}

    ctx.moveTo(x, ARENA.top);
    ctx.lineTo(x, ARENA.bottom);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(ARENA.left, y);

    // Small circular winning topic badge in bottom-right of avatar

    // Winner username fitted cleanly

  });

  rightZoneGrad.addColorStop(1, "rgba(0, 212, 255, 0.08)");

    drawPlasmaSaw(ARENA.left + 22, sy, 46, sawAngle, "#ff2a5f");
    drawPlasmaSaw(ARENA.right - 22, sy, 46, -sawAngle, "#00e5ff");
  }

  // 6. CENTER PLASMA POWER WALL (Replaces Stickmen!)

  // 7. RENDER BALLS (Heavy Metallic Spheres)
  for (const b of balls) {
    const col = b.side === 'A' ? "#ff2a5f" : "#00e5ff";
    ctx.save();

    if (b.isBot) {
      // Small dark drone ball without text
      const dGrad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 4, b.x, b.y, b.r);
      dGrad.addColorStop(0, b.side === 'A' ? "#ff758f" : "#90e0ef");
      dGrad.addColorStop(0.5, b.side === 'A' ? "#800f2f" : "#004e89");
      dGrad.addColorStop(1, "#090d16");
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = dGrad;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = col;

      gloss.addColorStop(0, "rgba(255,255,255,0.32)");
      gloss.addColorStop(0.45, "rgba(255,255,255,0.0)");
      gloss.addColorStop(1, "rgba(0,0,0,0.38)");
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = gloss;
      ctx.fill();

      // Player Name Pill
      const pillW = Math.max(110, Math.min(200, b.r * 2.2));
      drawRoundRect(b.x - pillW * 0.5, b.y + b.r - 18, pillW, 30, 10);
      ctx.fillStyle = "rgba(6, 10, 24, 0.9)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = col;
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      drawFittedText(b.name, b.x, b.y + b.r - 3, pillW - 14, 18, 12, "800");

      // Animated "⬇️ YOU!" pointer for new/active real players

        drawRoundRect(b.x - 68, b.y - b.r - 48 + bounceY, 136, 34, 12);

        ctx.fill();

        drawFittedText("⬇️ YOU!", b.x, b.y - b.r - 31 + bounceY, 120, 20, 14, "900");
      }
    }
    ctx.restore();
  }

  // Render Sparks
  for (const p of sparks) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Render Floating Texts
  for (const ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, ft.life);
    ctx.fillStyle = ft.color;
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 5;
    ctx.font = `900 ${ft.size}px 'Segoe UI', sans-serif`;
    ctx.textAlign = "center";
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  ctx.restore(); // End Arena Clip

  // 8. BOTTOM LIVE FEED & VEADOTUBE AVATAR SAFE ZONE (y: 1550..1920)

function drawPlasmaSaw(x, y, radius, angle, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const teeth = 12;
  ctx.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const r = i % 2 === 0 ? radius : radius * 0.68;
    const a = (i * Math.PI) / teeth;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = "#161f38";
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = color;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.32, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawPlasmaPowerWall() {
  ctx.save();

  // Outer energy glow
  const glowW = 54 + (wallFlashA + wallFlashB) * 28;
  const wallGrad = ctx.createLinearGradient(wallX - glowW, 0, wallX + glowW, 0);
  wallGrad.addColorStop(0, "rgba(255, 42, 95, 0)");
  wallGrad.addColorStop(0.38, `rgba(255, 42, 95, ${0.45 + wallFlashA * 0.4})`);
  wallGrad.addColorStop(0.5, "#ffffff");
  wallGrad.addColorStop(0.62, `rgba(0, 229, 255, ${0.45 + wallFlashB * 0.4})`);
  wallGrad.addColorStop(1, "rgba(0, 229, 255, 0)");

  ctx.fillStyle = wallGrad;
  ctx.fillRect(wallX - glowW, ARENA.top, glowW * 2, ARENA.height);

  // Solid metallic core pillar
  drawRoundRect(wallX - WALL_HalfWidth, ARENA.top + 6, WALL_HalfWidth * 2, ARENA.height - 12, 12);
  ctx.fillStyle = "#e0f7ff";
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#ffd000";
  ctx.stroke();

  // Animated electric arcs along the wall height
  ctx.beginPath();
  ctx.strokeStyle = "#ffe600";
  ctx.lineWidth = 3;
  for (let y = ARENA.top + 20; y < ARENA.bottom - 20; y += 35) {
    const jitter = (Math.random() - 0.5) * 26;
    if (y === ARENA.top + 20) ctx.moveTo(wallX + jitter, y);
    else ctx.lineTo(wallX + jitter, y);
  }
  ctx.stroke();

  // Center Clash Shield Icon on the Wall
  const midY = (ARENA.top + ARENA.bottom) * 0.5;
  ctx.beginPath();
  ctx.arc(wallX, midY, 34, 0, Math.PI * 2);
  ctx.fillStyle = "#0b132b";
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#ffd000";
  ctx.stroke();
  ctx.fillStyle = "#ffd000";
  drawFittedText("⚡", wallX, midY + 2, 40, 32, 20);

  ctx.restore();
}

// ============================================================================
// 8. TIKFINITY WEBSOCKET INTEGRATION (ws://localhost:21213/) & CONTROLS
// ============================================================================
let wsStatus = "Disconnected";
function connectTikFinity() {
  try {
    const ws = new WebSocket("ws://localhost:21213/");
    ws.onopen = () => {
      wsStatus = "Connected ✅";
      updateDebugStatus();
    };
    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        const ev = msg.event || msg.type || "";
        const d = msg.data || msg;
        const user = d.uniqueId || d.nickname || d.user || "Viewer";
        const avatar = d.profilePictureUrl || d.avatarUrl || null;

        if (ev === "chat" || d.comment) {
          const text = String(d.comment || d.text || "").trim().toLowerCase();
          const side = parseVoteSide(text);
          if (side) {
            handleViewerJoin(user, side, avatar, 1.2, "CHAT");
          }
        } else if (ev === "like" || d.likeCount) {
          // Assign liker to their current team or whichever side is slightly losing for drama
          const existing = playerStats.get(user);
          const side = existing ? existing.side : (wallX > ARENA.centerX ? 'B' : 'A');
          handleViewerJoin(user, side, avatar, 0.8, "LIKE");
        } else if (ev === "gift" || d.giftId || d.diamondCount) {
          const diamonds = Number(d.diamondCount || 5);
          const existing = playerStats.get(user);
          const side = existing ? existing.side : (Math.random() < 0.5 ? 'A' : 'B');
          handleViewerJoin(user, side, avatar, Math.min(6, 2 + diamonds * 0.25), "GIFT");
        }
      } catch (err) {}
    };
    ws.onclose = () => {
      wsStatus = "Reconnecting... 🔄";
      updateDebugStatus();
      setTimeout(connectTikFinity, 4000);
    };
    ws.onerror = () => { ws.close(); };
  } catch (e) {}
}

function parseVoteSide(text) {
  if (!text) return null;
  const clean = text.toLowerCase().trim();
  if (clean === "a" || clean === "1" || clean === "left" || clean.includes(currentMatch.keyA) || clean.includes(currentMatch.nameA.toLowerCase())) {
    return "A";
  }
  if (clean === "b" || clean === "2" || clean === "right" || clean.includes(currentMatch.keyB) || clean.includes(currentMatch.nameB.toLowerCase())) {
    return "B";
  }
  return null;
}

function updateDebugStatus() {
  const el = document.getElementById('dbg-info');
  if (!el) return;
  el.innerHTML = `TikFinity WS: <b>${wsStatus}</b><br>Zbývá unikátních otázek v balíčku: <b>${deck.length} / ${RAW_MATCHUPS.length}</b>`;
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'h') {
    const p = document.getElementById('debug-panel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
    updateDebugStatus();
  } else if (k === 'a') simChat('A');
  else if (k === 'b') simChat('B');
  else if (k === 'c') simCombo();
  else if (k === 'l') simLike();
  else if (k === '1') simGift('A');
  else if (k === '2') simGift('B');
  else if (k === 'n') nextMatchupNow();
});

// ============================================================================
// 9. BOOTSTRAP
// ============================================================================
connectTikFinity();
startNewRound();

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  updatePhysics(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
