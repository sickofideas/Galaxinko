  window.addEventListener('beforeunload',()=>{closed=true;clearTimeout(retry);ws?.close();});
  window.Wars={
    version:VERSION,
    snapshot:()=>({mode,phase:battle.phase,arenaRadius:courtSize.radius,resultsInMs:Math.max(0,(battle.resultsAt||0)-battle.t),spotlight:giftBanner&&performance.now()-giftBanner.at<3000&&battle.phase==='playing'?giftBanner.p.id:null,roundHistory:battle.history.map(r=>({...r})),crater:battle.crater?{team:battle.crater.team,ageMs:performance.now()-battle.crater.at}:null,collapse:battle.collapse?{mode:battle.collapse.mode,team:battle.collapse.team,ships:battle.collapse.ships.length,ageMs:performance.now()-battle.collapse.at}:null,round:battle.round,durationMs:battle.duration,players:battle.players.size,humans:battle.humanCount(),onCourt:battle.roster().length,drones:[...battle.players.values()].filter(p=>p.bot).length,active:battle.activePlayers.size,heartPilots:battle.heartPlayers.size,expectedLikers:battle.roundExpected,teamLikes:[...battle.teamLikes],bossScale:battle.teamLikes.map((n,team)=>(1+bossGrowth(n))*battle.cores[team].sizeScale),hp:[...battle.hp],maxHp:battle.maxHp,damage:[...battle.damage],wins:[...battle.wins],blocks:battle.stats.blocks,remainingMs:Math.max(0,battle.end-battle.t),projectiles:battle.projectiles.length,fadingShots:battle.fading.length,aimedShots:battle.projectiles.filter(s=>s.aimed).length,bombs:battle.projectiles.filter(s=>s.bomb).length,burstShots:battle.projectiles.filter(s=>s.burst).length,queuedBurstShots:battle.bursts.reduce((n,b)=>n+b.remaining,0),queued:priority.length+ordinary.length+likes.size,connected,members,dropped,invalid,feed:{packets:feed.packets,accepted:feed.accepted,byType:{...feed.byType},lastType:feed.lastType,secondsSinceLast:feed.lastAt?Math.floor((performance.now()-feed.lastAt)/1000):null},fps,renderMs,workMs,sfx:{enabled:sound,state:audioCtx?.state||'ready',played:soundEvents},hudPulse:hudPulse.map(p=>p?{kind:p.kind,amount:p.amount,ageMs:performance.now()-p.at}:null),portraits:[...pics.values()].filter(v=>v.state==='ready').length,cores:battle.cores.map(o=>({model:o.model,name:BOSSES[o.model].name,sizeScale:o.sizeScale,radius:battle.coreRadius(battle.cores.indexOf(o)),x:o.x,y:o.y,spinBoost:o.spinBoost||0,spinAngle:o.spinPhase||0,knock:o.lastKnock||0,giftHitUntil:o.giftHitUntil||0})),result:battle.phase==='results'?{participants:battle.result.participants,top:battle.result.top.map(p=>({id:p.id,team:p.team,points:p.roundPoints,likes:p.roundLikes})),rest:battle.result.rest.map(p=>({id:p.id,team:p.team,points:p.roundPoints,likes:p.roundLikes}))}:null}),
    player:id=>{const p=battle.get(id),t=performance.now();return p?{name:p.name,team:p.team,color:pilotTint(p),energy:p.energy,points:p.points,roundPoints:p.roundPoints,roundLikes:p.roundLikes,shots:p.shots,totalShots:p.totalShots,pendingShots:p.pendingShots,hits:p.hitShots,welcomeShots:p.welcomeShots,entryMs:Math.max(0,(p.entry?.until||0)-t),title:pilotTitle(p),badges:[...(p.badges||[])],nextPower:p.nextPower||1,spinRate:p.spinRate,spinBoost:p.spinBoost,portraitAngle:avatarTilt(p,t),spreadSize:performance.now()<p.spreadUntil?p.spreadSize:1,spreadMs:Math.max(0,p.spreadUntil-performance.now()),ship:SHIPS[shipModel(p)],aimStreak:p.aimStreak,bestStreak:p.bestStreak,aimAngle:aimAngle(p,t),aimReady:aimReady(p,t),heartActive:p.pendingShots>0||t<p.boostUntil,sizeScale:1+playerGrowth(p),avatar:!!pics.get(p.avatar)?.img,x:p.x,y:p.y}:null;},
    ballistics:()=>({welcomes:battle.stats.welcomes,received:battle.stats.likes,fired:[...battle.players.values()].filter(p=>!p.bot).reduce((n,p)=>n+p.totalShots,0),pending:[...battle.players.values()].filter(p=>!p.bot).reduce((n,p)=>n+p.pendingShots,0),active:battle.projectiles.length,shots:battle.projectiles.filter(s=>s.aimed).map(s=>({id:s.id,x:s.lastX,y:s.lastY,vx:s.vx,vy:s.vy,bounces:s.bounces,born:s.start,color:s.color,burst:s.burst,bomb:s.bomb,welcome:s.welcome,speed:s.speed,damage:s.damage,power:s.power,head:!!s.avatar})),angles:battle.projectiles.filter(s=>s.aimed&&!battle.get(s.id)?.bot).map(s=>({id:s.id,angle:s.initialAngle,currentAngle:s.angle,team:s.team}))}),
    positions:()=>battle.roster().map(p=>({id:p.id,team:p.team,bot:p.bot,x:p.x,y:p.y})),
    inject:e=>{if(mode==='test')battle.accept(e,performance.now());},
    testAge:(id,ms)=>{if(mode==='test'){const p=battle.get(id);if(p)p.last-=Math.max(0,ms);}},
    nextRound:()=>{if(mode==='test')battle.start(performance.now());},
    testFinish:()=>{if(mode==='test'){battle.hp=[Math.floor(battle.maxHp*.25),Math.floor(battle.maxHp*.65)];battle.finish(performance.now());}}
  };
  for(let team=0;team<2;team++)for(let model=0;model<SHIPS.length;model++)shipSprite(model,team);
  for(let team=0;team<2;team++)for(let i=0;i<72;i++){boltSprite(team,false,i*Math.PI*2/72);boltSprite(team,false,i*Math.PI*2/72,true);boltSprite(team,true,i*Math.PI*2/72);}
  newBattle('live');connect();requestAnimationFrame(loop);
})();
