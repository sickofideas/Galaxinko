        ctx.clip();
        ctx.drawImage(qImg, qx - 24, qy - 24, 48, 48);
        ctx.restore();
        ctx.beginPath(); ctx.arc(qx, qy, 24, 0, Math.PI * 2);
        ctx.lineWidth = 3.5; ctx.strokeStyle = q.side === 'A' ? TEAM_A : TEAM_B; ctx.stroke();
        drawText(q.name, qx, qy + 38, 15, WHITE, 'center', 88);
      }
    }

    ctx.restore();
  }

  function render(now) {
    if (darkPreview) {
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 1920);
      bgGrad.addColorStop(0, '#060919');
      bgGrad.addColorStop(0.5, '#0b132b');
      bgGrad.addColorStop(1, '#050711');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1080, 1920);

      // Subtle animated cyber-grid inside the arena so OBS needs no external Minecraft video
      ctx.save();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.07)';
      ctx.lineWidth = 2;
      const gShift = (now * 0.04) % 72;
      for (let gx = ARENA_LEFT; gx <= ARENA_RIGHT; gx += 72) {
        ctx.beginPath();
        ctx.moveTo(gx, ARENA_TOP);
        ctx.lineTo(gx, ARENA_BOTTOM);
        ctx.stroke();
      }
      for (let gy = ARENA_TOP + gShift; gy <= ARENA_BOTTOM; gy += 72) {
        ctx.beginPath();
        ctx.moveTo(ARENA_LEFT, gy);
        ctx.lineTo(ARENA_RIGHT, gy);
        ctx.stroke();
      }
      ctx.restore();
    } else {
      ctx.fillStyle = GREEN;
      ctx.fillRect(0, 0, 1080, 1920);
    }

    ctx.save();
    if (game.shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
    }

    const counts = game.getCounts();
    const pctA = counts.total ? Math.round((counts.a / counts.total) * 100) : 50;
    const pctB = counts.total ? 100 - pctA : 50;

    drawTopBarAndHeaders(pctA, pctB, counts, now);
    drawChamber('A');
    drawChamber('B');

    drawCenterClashFighters(pctA, pctB, now);

    for (let i = 0; i < game.bumpers.length; i++) {
      drawBumperPeg(game.bumpers[i], now);
    }

    for (let i = 0; i < game.shockwaves.length; i++) {
      const sw = game.shockwaves[i];
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(2, 6 * sw.life);
      ctx.strokeStyle = sw.color;
      ctx.stroke();
    }

    for (let i = 0; i < game.balls.length; i++) {
      drawVoterBall(game.balls[i], now);
    }

    drawStarlightForgeModal(now);

    for (let i = 0; i < game.laserBeams.length; i++) {
      const lb = game.laserBeams[i];
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(lb.fromX, lb.fromY);
      ctx.lineTo(lb.toX, lb.toY);
      ctx.lineWidth = 9 * lb.life;
      ctx.strokeStyle = lb.color;
      ctx.stroke();
      ctx.lineWidth = 3.5 * lb.life;
      ctx.strokeStyle = WHITE;
      ctx.stroke();
      drawText(lb.label, lb.fromX, lb.fromY - 24, 21, lb.color, 'center', 280);
      ctx.restore();
    }

    for (let i = 0; i < game.giftMeteors.length; i++) {
      const gm = game.giftMeteors[i];
      const gt = GIFT_TIERS[gm.tier || 1];
      const u = clamp(gm.progress, 0, 1);
      const mx = lerp(gm.fromX, gm.toX, u);
      const my = lerp(gm.fromY, gm.toY, u * u);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(lerp(gm.fromX, mx, 0.45), lerp(gm.fromY, my, 0.45));
      ctx.lineTo(mx, my);
      ctx.lineWidth = 14;
      ctx.strokeStyle = gt.border;
      ctx.stroke();
      ctx.lineWidth = 5;
      ctx.strokeStyle = WHITE;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mx, my, 28, 0, Math.PI * 2);
      ctx.fillStyle = gt.glow;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = OUTLINE;
      ctx.stroke();
      drawText(gm.badge + ' · ' + gm.name, mx, my - 42, 23, gt.glow, 'center', 320);
      ctx.restore();
    }

    for (let i = 0; i < game.chips.length; i++) {
      const ch = game.chips[i];
      ctx.save();
      ctx.translate(ch.x, ch.y);
      ctx.rotate(ch.rot);
      if (ch.isSpark) {
        roundPath(-5, -5, 10, 10, 5);
        ctx.fillStyle = ch.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = OUTLINE;
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 1.4);
        ctx.lineWidth = 6;
        ctx.strokeStyle = OUTLINE;
        ctx.stroke();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = ch.color;
        ctx.stroke();
      }
      ctx.restore();
    }

    for (let i = 0; i < game.popups.length; i++) {
      const pp = game.popups[i];
      drawText(pp.text, pp.x, pp.y, pp.size, pp.color, 'center', 340);
    }

    if (game.banner && now < game.banner.until) {
      gradPanel(160, 1475, 760, 58, 18, '#1e293b', '#090d16', game.banner.color, 4);
      drawText(game.banner.text, 540, 1504, 26, game.banner.color, 'center', 720);
    }

    if (sound && (!audioCtx || audioCtx.state !== 'running')) {
      gradPanel(90, 38, 900, 74, 20, '#b91c1c', '#7f1d1d', GOLD, 5);
      drawText('🔇 CLICK ANYWHERE IN CHROME TO ACTIVATE SOUND', 540, 75, 30, WHITE, 'center', 860);
    }

    ctx.restore();
  }

  const urlInput = $('url');
  const statusEl = $('status');
  let mode = 'live', ws = null, connected = false, retry = 0, attempt = 0, closed = false;
  let packets = 0, accepted = 0, invalid = 0;

  function connect() {
    clearTimeout(retry);
    try {
      if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); }
    } catch (e) {}
    connected = false;
    let target;
    try {
      target = new URL(urlInput.value);
      if (target.protocol !== 'ws:' && target.protocol !== 'wss:') return;
    } catch (e) { return; }

    try {
      ws = new WebSocket(target.href);
      const current = ws;
      const handshake = setTimeout(() => {
        try { if (current.readyState === WebSocket.CONNECTING) current.close(); } catch (e) {}
      }, 12000);
      ws.onopen = () => { clearTimeout(handshake); connected = true; attempt = 0; };
      ws.onmessage = e => {
        if (typeof e.data !== 'string' || e.data.length > 200000) { invalid++; return; }
        try {
          packets++;
          const evt = packet(JSON.parse(e.data));
          if (!evt) return;
          if (evt.type === 'streamend') { game.nextRound(); return; }
          if (mode === 'live' && game.accept(evt)) accepted++;
        } catch (err) { invalid++; }
      };
      ws.onerror = () => {};
      ws.onclose = () => {
        clearTimeout(handshake);
        connected = false;
        if (!closed) retry = setTimeout(connect, Math.min(30000, 1500 * Math.pow(2, Math.min(attempt++, 5))));
      };
    } catch (e) {
      if (!closed) retry = setTimeout(connect, 30000);
    }
  }

  let lastTime = performance.now(), acc = 0, fpsCount = 0, fps = 60, fpsAt = lastTime;
  const STEP = 1 / 60;

  function loop(t) {
    try {
      const dt = clamp((t - lastTime) / 1000, 0, 0.1);
      lastTime = t;
      acc += dt;
      let steps = 0;
      while (acc >= STEP && steps++ < 4) {
        game.tick(STEP);
        acc -= STEP;
      }
      if (steps >= 4) acc = 0;
      render(t);
      fpsCount++;
      if (t - fpsAt >= 1000) {
        fps = Math.round((fpsCount * 1000) / (t - fpsAt));
        fpsAt = t;
        fpsCount = 0;
        if (panelEl.style.display === 'block') {
          statusEl.textContent = (connected ? 'SOCKET OPEN' : 'SOCKET OFF') + ' · Mode: ' + mode.toUpperCase() + ' · Phase: ' + game.phase + ' · Real: ' + game.getRealPlayerCount() + ' · Total Balls: ' + game.balls.length + ' · ' + fps + ' FPS';
        }
      }
    } catch (err) {
      if (errBox) {
        errBox.style.display = 'block';
        errBox.textContent = 'LOOP ERR: ' + (err.message || err);
      }
    }
    requestAnimationFrame(loop);
  }

  let testSeq = 1;
  const TEST_NAMES = ['alex_99', 'mia.vibes', 'lucas_gg', 'emma.xo', 'noah_7', 'chloe.tt', 'leo_king', 'zoe.star', 'max_pro', 'lily.lu', 'sam_live', 'ruby_x'];

  function spawnTestVoter(side) {
    const id = 'tester_' + (testSeq++);
    const name = TEST_NAMES[testSeq % TEST_NAMES.length];
    game.accept({ type: 'chat', id: id, name: name, text: side, eventId: 'test:' + performance.now() + ':' + Math.random() });
  }

  function triggerTestGift(coins) {
    const humanList = Array.from(game.players.values()).filter(p => !p.isBot);
    const p = humanList[humanList.length - 1] || { id: 'vip_you', name: 'max_pro' };
    game.accept({ type: 'gift', id: p.id, name: p.name, coins: coins, eventId: 'tgift:' + performance.now() + ':' + Math.random() });
  }

  $('toggle').onclick = () => { panelEl.style.display = 'none'; };
  $('dark').onclick = () => { darkPreview = !darkPreview; };
  $('sfx').onclick = toggleSound;
  $('ttsBtn').onclick = () => {
    ttsEnabled = !ttsEnabled;
    updateSoundUI();
    if (ttsEnabled) speakTTS('Voice commentary is on.', true);
  };
  $('botBtn').onclick = () => {
    autoCrowdEnabled = !autoCrowdEnabled;
    updateSoundUI();
  };
  $('audioTest').onclick = testSound;
  $('volume').oninput = e => setSoundLevel(Number(e.target.value) / 100);
  $('connect').onclick = connect;

  $('test').onclick = () => { mode = 'test'; spawnTestVoter('A'); spawnTestVoter('B'); };
  $('live').onclick = () => { mode = 'live'; game.nextRound(); };
  $('voteA').onclick = () => spawnTestVoter('A');
  $('voteB').onclick = () => spawnTestVoter('B');
  $('heart').onclick = () => {
    const list = Array.from(game.players.values()).filter(p => !p.isBot);
    const p = list[list.length - 1] || { id: 'you', name: 'alex_99' };
    game.accept({ type: 'like', id: p.id, name: p.name, count: 15 });
  };
  $('gift1').onclick = () => triggerTestGift(1);
  $('gift2').onclick = () => triggerTestGift(25);
  $('gift3').onclick = () => triggerTestGift(150);
  $('gift4').onclick = () => triggerTestGift(600);

  $('crowd').onclick = () => {
    for (let i = 0; i < 16; i++) spawnTestVoter(i % 3 === 0 ? 'A' : 'B');
  };
  $('skipPhase').onclick = () => {
    if (game.phase === 'VOTE') game.startShredPhase(false);
    else if (game.phase === 'SHRED') game.startForgePhase();
    else if (game.phase === 'FORGE') game.startShowcasePhase();
    else game.nextRound();
  };

  ['click', 'pointerdown', 'keydown', 'mousemove', 'touchstart'].forEach(evtName => {
    window.addEventListener(evtName, () => {
      if (sound && (!audioCtx || audioCtx.state !== 'running')) unlockAudio(true);
    }, { passive: true });
  });

  window.addEventListener('dblclick', () => togglePanel());

  window.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k = String(e.key || '').toLowerCase();
    if (k === 'h') togglePanel();
    else if (k === 'a') $('voteA').click();
    else if (k === 'b') $('voteB').click();
    else if (k === ' ') { e.preventDefault(); $('heart').click(); }
    else if (k === '1') $('gift1').click();
    else if (k === '2') $('gift2').click();
    else if (k === '3') $('gift3').click();
    else if (k === 'g') $('gift4').click();
    else if (k === 'n') $('skipPhase').click();
  });

  window.addEventListener('beforeunload', () => { closed = true; clearTimeout(retry); try { if (ws) ws.close(); } catch (e) {} });

  render(performance.now());
  unlockAudio(false);
  updateSoundUI();
  connect();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
