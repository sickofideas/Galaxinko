<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxinko FRONTIER</title><style>html,body{margin:0;background:#00ff00;color:white;font-family:Arial}</style></head><body><noscript>Zapni JavaScript pro spuštění hry.</noscript><script>
/* GALAXINKO FRONTIER 3.0 — standalone Canvas game, no external libraries.
   Chat: MODRA / CERVENA / JOIN, 1 / 2 / 3, TURBO / STIT / OPRAV.
   TikFinity Desktop ws://localhost:21213/. H opens streamer controls.
   Node: require('./sketch.js') exposes the same simulation used by the browser.

(function(root) {
  'use strict';
  const VERSION='3.2 CHROMA', ROUND_MS=90000, BREAK_MS=10000, ACTIVE_MS=180000;
  const TEAM=['MODŘÍ','ČERVENÍ'], COLOR=['#5cd9ff','#ff7496'];
  const NODES=[{x:315,y:695,name:'AURORA'},{x:765,y:845,name:'NOVA'},{x:385,y:1050,name:'ATLAS'}];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const numeric=(v,f=0)=>Number.isFinite(Number(v))?Number(v):f;
  const clean=s=>Array.from(String(s??'').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2060-\u206f]/g,'').trim()).slice(0,24).join('')||'Pilot';
  const command=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/^!/, '');
  function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
  function packet(raw) {
    if(!raw || typeof raw!=='object' || !raw.data || typeof raw.data!=='object')return null;
    const type=String(raw.event||raw.type||'').toLowerCase();
    if(!['chat','like','gift','follow','share','subscribe','streamend'].includes(type))return null;
    const d=raw.data,u=d.user||d,g=d.giftDetails||d.extendedGiftInfo||d.gift||{};
    if(type==='streamend')return {type};
    const id=u.uniqueId??d.uniqueId??u.userId??d.userId;
    if(id===undefined||id===null||!String(id).length||String(id).length>180)return null;
    const repeat=Math.floor(clamp(numeric(d.repeatCount,1),1,1000000));
    const end=[true,1,'true'].includes(d.repeatEnd);
    if(type==='gift' && numeric(d.giftType??g.giftType??g.type)===1&&!end)return null;
    const mid=d.msgId??d.common?.msgId;
    return {type,id:String(id),name:clean(u.nickname||d.nickname||u.uniqueId||d.uniqueId),
      text:String(d.comment||'').slice(0,300),repeat,likeCount:clamp(numeric(d.likeCount,1),1,10000),
      eventId:mid==null?null:type+':'+mid+(type==='gift'?':'+repeat+':'+end:'')};
  }

  class Game {
    constructor(options={}) {
      this.emit=options.emit||(()=>{});this.demo=!!options.demo;
      this.players=new Map();this.seen=new Map();this.nodes=NODES.map(n=>({...n,control:0,owner:-1}));
      this.now=0;this.phase='lobby';this.round=0;this.ends=0;this.scores=[0,0];this.wins=[0,0];
      this.result=null;this.final=false;this.shots=[];this.feed=[];this.ack=null;
      this.nextBotThink=0;this.nextSweep=0;this.lastLead=-1;this.lastLeadNotice=-Infinity;
      this.stats={events:0,gifts:0,rounds:0,commands:0,rejected:0};
    }
    notice(text,team=-1,kind='info') {
      this.feed.unshift({text,team,kind,at:this.now});if(this.feed.length>5)this.feed.pop();
      this.emit({kind:'notice',text,team});
    }
    acknowledge(p,text,kind='action') {
      this.ack={name:p.name,id:p.id,text,team:p.team,kind,at:this.now};
      this.emit({kind:'ack',team:p.team,text});
    }
    add(id,name,team,bot=false) {
      if(this.players.has(id))return this.players.get(id);
      if(this.players.size>=120){const drone=!bot&&[...this.players.values()].find(p=>p.bot);if(drone)this.players.delete(drone.id);else return null;}
      const h=hash(id),base=team===0?{x:165,y:585}:{x:915,y:585};
      const p={id,name:clean(name),team,bot,target:h%3,hp:100,x:base.x,y:base.y,
        last:this.now,angle:(h%628)/100,shootAt:this.now+900+(h%600),respawn:0,
        turboUntil:0,shieldUntil:0,goldUntil:0,cool:{turbo:0,stit:0,oprav:0},
        routeAt:-Infinity,tapAt:-Infinity,lastChat:-Infinity,contribution:0,kills:0,
        joinedRound:this.round,teamLocked:false,recent:this.now};
      this.players.set(id,p);return p;
    }
    humans() {return [...this.players.values()].filter(p=>!p.bot&&this.now-p.last<ACTIVE_MS);}
    start(now) {
      this.now=now;this.phase='playing';this.round++;this.ends=now+ROUND_MS;this.final=false;
      this.scores=[0,0];this.result=null;this.shots=[];this.lastLead=-1;
      this.nodes.forEach(n=>{n.control=0;n.owner=-1;});
      for(const [id,p] of this.players) {
        if(!p.bot && now-p.last>=ACTIVE_MS){this.players.delete(id);continue;}
        p.hp=100;p.respawn=0;p.contribution=0;p.kills=0;p.teamLocked=false;
        p.cool={turbo:0,stit:0,oprav:0};p.turboUntil=0;p.shieldUntil=now+1500;p.shootAt=now+1000;
        p.x=p.team===0?165:915;p.y=585;
      }
      this.notice('Obsaďte majáky. Držené majáky vyrábějí energii.');
      this.emit({kind:'round'});
    }
    accept(e,now) {
      this.now=now;
      if(!e||!e.id)return false;
      if(e.eventId){if(this.seen.has(e.eventId))return false;this.seen.set(e.eventId,now);if(this.seen.size>6000)this.seen.delete(this.seen.keys().next().value);}
      this.stats.events++;
      let p=this.players.get(e.id);
      if(e.type==='gift') {
        this.stats.gifts+=e.repeat;if(p)p.goldUntil=now+60000;
        this.ack={name:e.name,id:e.id,text:e.repeat+'× dárek • zlatý průlet',team:p?p.team:-1,kind:'gift',at:now};
        this.emit({kind:'gift',name:e.name,team:p?p.team:-1});return true;
      }
      if(['follow','share','subscribe'].includes(e.type)) {
        this.notice(e.name+(e.type==='follow'?' vítáme na palubě.':e.type==='share'?' sdílí výpravu.':' podporuje posádku.'));return true;
      }
      if(!['chat','like'].includes(e.type))return false;
      const cmd=command(e.text);
      const wanted=/^(modra|modri|blue)$/.test(cmd)?0:/^(cervena|cerveni|red)$/.test(cmd)?1:-1;
      if(!p) {
        const h=this.humans(),a=h.filter(x=>x.team===0).length,b=h.length-a;
        const team=wanted>=0?wanted:a===b?hash(e.id)%2:a<b?0:1;
        p=this.add(e.id,e.name,team);if(!p){this.stats.rejected++;return false;}
        this.acknowledge(p,'PŘIPOJENO • MAJÁK '+(p.target+1),'join');
        this.notice(p.name+' posiluje '+TEAM[p.team]+'.',p.team);
      }
      p.name=clean(e.name);p.last=now;
      if(this.phase==='lobby')this.start(now);
      // Events arriving after the deadline cannot alter the already earned result.
      if(this.phase==='playing'&&now>=this.ends)this.finish();
      if(e.type==='chat'&&wanted>=0) {
        if(this.phase==='results'||!p.teamLocked) {
          if(p.team!==wanted){p.team=wanted;p.x=wanted===0?165:915;p.y=585;}
          this.acknowledge(p,TEAM[p.team]+' • MAJÁK '+(p.target+1),'join');
        } else this.acknowledge(p,'TÝM ZMĚNÍŠ MEZI KOLY','cooldown');
        return true;
      }
      if(this.phase!=='playing')return true;
      if(e.type==='like') {
        if(now-p.tapAt<5000)return true;p.tapAt=now;
        if(p.hp>0){p.turboUntil=Math.max(p.turboUntil,now+1800);this.acknowledge(p,'IMPULS • RYCHLEJŠÍ OBSAZOVÁNÍ');}
        return true;
      }
      if(now-p.lastChat<700)return true;p.lastChat=now;
      if(/^[123]$/.test(cmd)) {
        if(now-p.routeAt<1500)return true;p.routeAt=now;p.target=Number(cmd)-1;p.recent=now;
        this.acknowledge(p,'LETÍŠ K MAJÁKU '+cmd);this.stats.commands++;return true;
      }
      const skill=({turbo:'turbo',utok:'turbo',boost:'turbo',stit:'stit',shield:'stit',oprav:'oprav',lecit:'oprav',heal:'oprav'})[cmd];
      if(skill) {
        if(p.hp<=0){this.acknowledge(p,'NÁVRAT ZA '+Math.max(1,Math.ceil((p.respawn-now)/1000))+' s','cooldown');return true;}
        if(now<p.cool[skill]){this.acknowledge(p,skill.toUpperCase()+' ZA '+Math.ceil((p.cool[skill]-now)/1000)+' s','cooldown');return true;}
        if(skill==='oprav'&&p.hp>=100){this.acknowledge(p,'LOĎ JE V POŘÁDKU • 100 HP','cooldown');return true;}
        p.cool[skill]=now+12000;
        if(skill==='turbo')p.turboUntil=now+4000;
        if(skill==='stit')p.shieldUntil=now+5000;
        if(skill==='oprav')p.hp=Math.min(100,p.hp+45);
        p.recent=now;this.stats.commands++;
        this.acknowledge(p,skill==='turbo'?'TURBO 4 s • DVOJNÁSOBNÝ VÝKON':skill==='stit'?'ŠTÍT 5 s • BLOKUJE ZÁSAHY':'OPRAVENO • '+Math.ceil(p.hp)+' HP');
      }
      return true;
    }
    balanceBots() {
      const humans=this.humans(),counts=[0,0];humans.forEach(p=>counts[p.team]++);
      // Explicit training drones: only fill a sparse side, at most 3 per team.
      const goal=Math.max(2,Math.min(3,...counts.map(n=>Math.max(n,2))));
      for(let team=0;team<2;team++){
        const want=this.demo?3:Math.min(3,Math.max(0,goal-counts[team]));
        const bots=[...this.players.values()].filter(p=>p.bot&&p.team===team);
        while(bots.length>want){const b=bots.pop();this.players.delete(b.id);}
        for(let i=0;i<want;i++)if(!this.players.has('drone-'+team+'-'+i))this.add('drone-'+team+'-'+i,'DRON '+(i+1),team,true);
      }
    }
    finish() {
      if(this.phase!=='playing')return;
      const values=this.scores.map(Math.round),winner=values[0]===values[1]?-1:values[0]>values[1]?0:1;
      if(winner>=0)this.wins[winner]++;
      this.result={scores:values,winner,round:this.round,top:[...this.players.values()].filter(p=>!p.bot&&p.contribution>0)
        .sort((a,b)=>b.contribution-a.contribution).slice(0,3).map(p=>({id:p.id,name:p.name,team:p.team,points:Math.round(p.contribution),kills:p.kills}))};
      this.phase='results';this.restartAt=this.now+BREAK_MS;this.stats.rounds++;this.shots=[];

    }
    tick(now,dt) {
      this.now=now;
      if(now>=this.nextSweep){
        this.nextSweep=now+10000;
        for(const [id,p] of this.players)if(!p.bot&&now-p.last>=ACTIVE_MS)this.players.delete(id);
        for(const [k,t]of this.seen)if(now-t>300000)this.seen.delete(k);
      }
      if(this.phase==='results'){
        if(now>=this.restartAt){if(this.humans().length||this.demo)this.start(now);else this.phase='lobby';}
        return;
      }
      if(this.phase!=='playing')return;
      if(now>=this.ends){this.finish();return;}
      dt=clamp(dt,0,.1);
      if(!this.final&&this.ends-now<=15000){this.final=true;this.notice('FINÁLE • MAJÁKY VYRÁBĚJÍ 2× ENERGII');this.emit({kind:'final'});}
      if(now>=this.nextBotThink){
        this.nextBotThink=now+2200;this.balanceBots();
        for(const p of this.players.values())if(p.bot){
          const ranked=this.nodes.map((n,i)=>({i,value:(p.team===0?n.control:-n.control)+(hash(p.id+Math.floor(now/9000)+i)%60)})).sort((a,b)=>a.value-b.value);
          if(hash(p.id+Math.floor(now/2200))%3===0)p.target=ranked[0].i;
        }
      }
      const live=[...this.players.values()].filter(p=>p.bot||now-p.last<ACTIVE_MS);
      const counts=this.nodes.map(()=>[[],[]]);
      for(const p of live){
        if(p.hp<=0){if(now>=p.respawn){p.hp=100;p.x=p.team===0?165:915;p.y=585;p.shieldUntil=now+2000;this.emit({kind:'respawn',x:p.x,y:p.y,team:p.team});}else continue;}
        const n=this.nodes[p.target],angle=p.angle+now*.00019*(p.team===0?1:-1);
        const radius=85+(hash(p.id)%65),tx=n.x+Math.cos(angle)*radius,ty=n.y+Math.sin(angle)*radius*.75;
        const speed=1-Math.exp(-dt*(p.turboUntil>now?3.8:2));p.x+=(tx-p.x)*speed;p.y+=(ty-p.y)*speed;
        const near=Math.hypot(p.x-n.x,p.y-n.y)<190;
        if(near){counts[p.target][p.team].push(p);p.teamLocked=true;}
      }
      for(let i=0;i<3;i++){
        const n=this.nodes[i],groups=counts[i];
        const power=groups.map(g=>g.reduce((v,p)=>v+(p.bot?0.72:1)*(p.turboUntil>now?2:1),0));
        const difference=power[0]-power[1],change=clamp(difference,-5,5)*20*dt;
        n.control=clamp(n.control+change,-100,100);
        const old=n.owner;
        if(n.control>=99.9)n.owner=0;else if(n.control<=-99.9)n.owner=1;
        else if((n.owner===0&&n.control<0)||(n.owner===1&&n.control>0))n.owner=-1;
        if(old!==n.owner&&n.owner>=0){this.notice(TEAM[n.owner]+' získali '+n.name+'!',n.owner,'capture');this.emit({kind:'capture',x:n.x,y:n.y,team:n.owner});}
        if(n.owner>=0){const gain=dt*8*(this.final?2:1);this.scores[n.owner]+=gain;
          const allies=groups[n.owner];for(const p of allies)p.contribution+=gain/Math.max(1,allies.length);}
        if(difference!==0){const group=groups[difference>0?0:1];for(const p of group)p.contribution+=Math.abs(change)/Math.max(1,group.length)*.12;}
        for(let team=0;team<2;team++)for(const p of groups[team]){
          if(p.hp<=0||now<p.shootAt)continue;
          const enemies=groups[1-team].filter(x=>x.hp>0);
          if(!enemies.length)continue;
          const target=enemies.reduce((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)<Math.hypot(p.x-b.x,p.y-b.y)?a:b);
          p.shootAt=now+(p.turboUntil>now?650:1300);
          const blocked=target.shieldUntil>now,damage=p.bot?10:16;
          if(!blocked)target.hp=Math.max(0,target.hp-damage);
          this.shots.push({x:p.x,y:p.y,tx:target.x,ty:target.y,team:p.team,at:now,blocked});if(this.shots.length>180)this.shots.shift();
          if(target.hp===0){target.respawn=now+4500;p.kills++;p.contribution+=5;
            this.emit({kind:'down',x:target.x,y:target.y,team:target.team});
            if(!target.bot)this.acknowledge(target,'LOĎ SE VRÁTÍ ZA 5 s','respawn');}
        }
      }
      this.shots=this.shots.filter(s=>now-s.at<400);
      const lead=this.scores[0]===this.scores[1]?-1:this.scores[0]>this.scores[1]?0:1;
      if(lead>=0&&lead!==this.lastLead&&Math.abs(this.scores[0]-this.scores[1])>20){
        if(this.lastLead>=0&&now-this.lastLeadNotice>10000){this.notice(TEAM[lead]+' přebírají vedení!',lead);this.emit({kind:'lead',team:lead});this.lastLeadNotice=now;}
        this.lastLead=lead;
      }
    }
  }
  if(typeof module!=='undefined'&&module.exports)module.exports={Game,packet,command,hash};
  if(typeof document==='undefined')return;

    const c=canvas.getContext('2d',{alpha:false}),query=new URLSearchParams(location.search);
    let saved={};try{saved=JSON.parse(localStorage.getItem('frontier-settings-chroma32')||'{}')||{};}catch(_){}
    let chroma=query.has('chroma')?query.get('chroma')!=='0':saved.chroma!==false;
    let names=saved.names!==false,sound=false,voice=false,audio=null,lastTone=0,lastSpeech=-Infinity;
    let mode=query.get('test')==='1'?'test':'attract';

    let connection='Připojuji TikFinity',received=0,malformed=0,lastMessage=0,connected=false;

    const now=()=>performance.now();
    const day=()=>new Date().toLocaleDateString('sv-SE');let archive={day:day(),top:[]};

      g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.055,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.18);

      fx=fx.filter(f=>t-f.at<950);for(const f of fx){const age=(t-f.at)/950;c.globalAlpha=1-age;const col=COLOR[f.team];
        if(f.kind==='down')for(let k=0;k<9;k++){const a=k*Math.PI*2/9;circle(f.x+Math.cos(a)*age*82,f.y+Math.sin(a)*age*82,2+(1-age)*3,col);}
        else {c.save();c.translate(f.x,f.y);c.scale(1,.6);circle(0,0,20+age*180,null,col,3);c.restore();}}
      c.globalAlpha=1;
      if(t-cometAt<5500){const x=-200+(t-cometAt)/5500*1500;glow(x,604,80,'#ffbb5544');line(x-200,675,x,604,'#ffc66a88',10);line(x-100,639,x,604,'#fff3d4',3);circle(x,604,11,'#ffe5a4');}
      c.restore();
      // Join command is a single prominent sign, always above the playfield.
      polygon([[55,326],[1026,326],[1012,458],[69,458]],'#0b1b2ce8','#345a73',1);
      text(mode==='live'?'PŘIDEJ SE DO BITVY · NAPIŠ DO CHATU':'VYBER POSÁDKU · PRVNÍ KOMENTÁŘ SPUSTÍ HRU',540,354,18,'#aac3d9','center',700,920);
      text('MODRÁ',269,399,36,COLOR[0],'center',900);text('VS',540,399,18,'#758da7','center',900);text('ČERVENÁ',810,399,36,COLOR[1],'center',900);
      text(counts[0]+' hráčů · '+blueDrone+' dronů',269,439,18,'#86a8c0','center');text(counts[1]+' hráčů · '+redDrone+' dronů',810,439,18,'#86a8c0','center');
      if(banner&&t-banner.at<2300){const a=clamp((2300-(t-banner.at))/350,0,1);c.globalAlpha=a;rect(228,475,624,42,10,'#0a1727ec','#527087');text(banner.text,540,496,22,banner.team>=0?COLOR[banner.team]:'#ffd28b','center',800);c.globalAlpha=1;}
      const nudge=mode==='attract'?'UKÁZKA: ŠEDÉ LODĚ JSOU CVIČNÉ DRONY':game.final?'FINÁLE: VĚŽE VYRÁBĚJÍ DVOJNÁSOBEK ENERGIE':'1 / 2 / 3  →  VYBER VĚŽ PRO SVOU LOĎ';
      rect(95,1253,890,49,12,game.final?'#fbd092':'#0a182ae8','#344f67');text(nudge,540,1278,22,game.final?'#251f1c':'#c4d9eb','center',800,850);
      // Ability dock. Icon, action and benefit have one consistent visual hierarchy.
      if(chroma)rect(55,1340,970,158,16,'#0b182a');
      line(67,1330,1013,1330,'#395572');
      const local=game.players.get('local-test');
      [['TURBO','2× výkon na 4 s','turbo'],['ŠTÍT','Ochrana na 5 s','stit'],['OPRAV','Obnoví 45 HP','oprav']].forEach((a,i)=>{
        const x=208+i*333,col=i===0?'#ffd393':i===1?'#75d4ff':'#c3afff';
        if(i)line(x-165,1365,x-165,1472,'#56708344');
        const cooldown=mode==='test'&&local?Math.max(0,Math.ceil((local.cool[a[2]]-t)/1000)):0;
        circle(x-104,1405,34,'#142d42',col+'77');
        if(i===0)polygon([[x-98,1383],[x-119,1408],[x-105,1407],[x-111,1425],[x-90,1399],[x-103,1400]],col);
        if(i===1)polygon([[x-104,1383],[x-87,1391],[x-89,1411],[x-104,1426],[x-119,1411],[x-121,1391]],'#244b62',col,2);
        if(i===2){rect(x-107,1388,7,34,2,col);rect(x-120,1401,34,7,2,col);}
        text(a[0],x-50,1390,28,col,'left',900);text(a[1],x-50,1428,20,'#a3bad1','left',600,205);
        text(cooldown?'PŘIPRAVENO ZA '+cooldown+' s':'NAPIŠ '+a[0],x,1472,17,cooldown?'#ffd28b':'#789ab7','center',700);
      });
      line(67,1502,1013,1502,'#395572');
      // Radio strip reserves space for the most recent personal interaction.
      if(chroma)rect(55,1520,970,132,16,'#0b182a');
      const ack=game.ack&&t-game.ack.at<5000?game.ack:null;
      const radioColor=ack?(ack.team>=0?COLOR[ack.team]:'#ffd28b'):'#71c9ef';
      rect(66,1536,5,98,2,radioColor);
      if(ack){
        text(ack.kind==='gift'?'PODPORA POSÁDKY  /  '+(names?ack.name:'Podporovatel'):display(ack),90,1547,21,radioColor,'left',800,900);
        text(ack.text,90,1586,27,'#eff6ff','left',700,900);
        text(ack.kind==='gift'?'Zlatý průlet a speciální označení lodi':'Příkaz přijat · každá schopnost má pauzu 12 s',90,1625,18,'#809fb9');
      }else{
        text('PALUBNÍ RÁDIO',90,1547,17,radioColor,'left',800);
        const f=names?game.feed.find(f=>t-f.at<7000):null;
        text(f?f.text:'Obsaď věže. Braň je. Přetáhni bitvu na svou stranu.',90,1586,25,'#dceaf7','left',600,900);
        text('Loď bojuje automaticky · po zničení se vrátí za 5 s',90,1625,18,'#809fb9');
      }
      if(game.phase==='results'){
        const r=game.result;if(!chroma){c.fillStyle='#030a15a8';c.fillRect(30,316,1020,1015);}
        rect(111,566,858,610,25,'#0c1a2df5',r.winner<0?'#ffdb9c':COLOR[r.winner]);
        const col=r.winner<0?'#ffdb9c':COLOR[r.winner];glow(540,660,250,col+'15');
        text('VÝSLEDEK BITVY '+r.round,540,610,18,'#8cabc5','center',800);
        text(r.winner<0?'VYROVNANÁ BITVA':TEAM[r.winner]+' VÍTĚZÍ',540,670,46,col,'center',900,790);
        text(r.scores[0]+' : '+r.scores[1],540,740,48,'#fff','center',900);
        line(165,791,915,791,'#48677f66');
        text(mode==='live'?'HRDINOVÉ POSÁDKY':'CVÍČNÁ BITVA · PŘIDEJ SE',540,823,19,'#8fb0c9','center',800);
        if(r.top.length)r.top.forEach((p,i)=>{text(String(i+1).padStart(2,'0'),162,875+i*64,20,'#5e7e98');text(display(p),217,875+i*64,27,COLOR[p.team],'left',700,550);text(p.points+' b.',915,875+i*64,27,'#fff','right');});
        else text('Tady bude tvé jméno.',540,930,29,'#c1d5e8','center');
        text('ODVETA ZA '+seconds+' s',540,1099,29,'#ffd28b','center',800);
        text('Mezi koly můžeš změnit tým.',540,1141,20,'#87a6c0','center');
      }
      c.restore();
      if(mode==='attract'){
        rect(155,1710,770,94,19,'#0d1b2d','#46657e');text('PRVNÍ KOMENTÁŘ SPUSTÍ SKUTEČNOU BITVU',540,1738,22,'#d4e4f7','center',800,730);
        text('Klikni a zkus si let · nic se neposílá na TikTok',540,1776,21,'#89aac7','center',600,730);
      }else if(mode==='test'){
        rect(192,1710,696,76,17,'#ffd28b');text('TEST · 1 / 2 / 3 = cíl · T / S / O = schopnosti',540,1737,23,'#29221c','center',800);
        text('H → Připravit LIVE ukončí test',540,1767,19,'#57432e','center');
      }else if(!chroma){text('VÝHRY POSÁDEK '+game.wins[0]+' : '+game.wins[1],540,1734,21,'#7c9bb7','center');}
      if(!chroma&&archive.day===day()&&archive.top[0]&&mode==='live')text('PILOT DNE: '+(names?clean(archive.top[0].name):'anonymní')+' · '+archive.top[0].points+' b.',540,1778,21,'#95b4cf','center');
      if(!connected){rect(222,1830,636,44,11,'#101c30');text('TIKFINITY ODPOJENO · H OTEVŘE NASTAVENÍ',540,1852,19,'#ffd28b','center',700);}
    }

    function frame(t){
      const elapsed=Math.max(0,t-lastFrame);lastFrame=t;frames=.95*frames+.05*elapsed;
      // Fixed simulation steps; a suspended tab does not extend a round or replay minutes of damage.
      if(elapsed>500){stepTime=t;accumulator=0;game.tick(t,0);}else{
        accumulator+=Math.min(elapsed,250);
        while(accumulator>=50){stepTime+=50;game.tick(stepTime,.05);accumulator-=50;}
      }
      if(game.phase==='lobby'&&mode==='live'){newGame('attract');buttons();}
      render(t);
      if(!panel.hidden){$('state').textContent=connection+' • '+(mode==='test'?'TEST: živé události jsou ignorované':mode==='attract'?'UKÁZKA: první hráč spustí LIVE kolo':'ŽIVÁ HRA')+(lastMessage?' • poslední zpráva před '+Math.floor((t-lastMessage)/1000)+' s':'');$('metrics').textContent=Math.round(1000/frames)+' FPS • '+game.players.size+'/120 lodí • zprávy '+received+' • neplatné '+malformed;}
      requestAnimationFrame(frame);
    }
    root.Frontier={version:VERSION,snapshot:()=>({mode,phase:game.phase,round:game.round,scores:game.scores.map(Math.round),humans:game.humans().length,ships:game.players.size,connected,stats:{...game.stats},
      nodes:game.nodes.map(n=>({owner:n.owner,control:n.control})),ack:game.ack?{text:game.ack.text,kind:game.ack.kind}:null,
      local:game.players.has('local-test')?{target:game.players.get('local-test').target,hp:game.players.get('local-test').hp}:null})};
    requestAnimationFrame(frame);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})(typeof window==='undefined'?globalThis:window);

</script></body></html>
