<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxinko: Realistic CNC Judge</title>
<style>
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: #00FF00; /* Chroma Key Green */
    overflow: hidden; font-family: 'Arial Black', Arial, sans-serif;
  }
  #game-container {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; align-items: center;
  }
  canvas {
    display: block; width: min(100vw, 56.25vh); height: min(100vh, 177.77vw);
    aspect-ratio: 9/16;
  }
  /* Admin Panel */
  #admin-panel {
    position: fixed; top: 10px; left: 10px; z-index: 100;
    background: rgba(10, 15, 30, 0.9); padding: 15px; border-radius: 10px;
    border: 2px solid #00f2fe; color: white; font-family: Arial, sans-serif;
    display: none;
  }
  #admin-panel button {
    background: #24304e; color: white; border: 1px solid #00f2fe;
    padding: 8px 12px; margin: 4px; border-radius: 5px; cursor: pointer; font-weight: bold;
  }
  #admin-panel button:hover { background: #00f2fe; color: black; }
  .hotkey-hint { position: fixed; top: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; font-size: 12px; z-index: 99;}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="arena" width="1080" height="1920"></canvas>
</div>

<div class="hotkey-hint">Press 'H' for Admin Panel</div>

<div id="admin-panel">
  <h3>Admin Panel (Live TEST)</h3>
  <button id="btn-sound">Enable Sound</button><br><br>
  <button id="btn-voteA">Vote A (Photo)</button>
  <button id="btn-voteB">Vote B (Photo)</button><br>
  <button id="btn-like">Add Like (SpeedUp)</button>
  <button id="btn-gift">Add Gift (Gold Plating)</button><br><br>
  <button id="btn-end">Force End Round</button>
</div>

<script>
// ==========================================
// KONFIGURACE HRY A ROZLOŽENÍ
// ==========================================
const OPTIONS = {
    A: { title: "PIZZA", emoji: "🍕", color: "#FF4136", x: 90, w: 400 },
    B: { title: "BURGER", emoji: "🍔", color: "#0074D9", x: 590, w: 400 }
};
const ROUND_TIME = 45; 
const W = 1080, H = 1920;
const TUBES_Y = 1100; // Horní hrana zkumavek
const TUBES_H = 700;  // Výška zkumavek
const FLOOR_Y = TUBES_Y + TUBES_H - 40; // Kde se kuličky zastaví

const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d', { alpha: false });

let audioCtx = null;
let soundEnabled = false;

let state = "VOTE"; // VOTE, SHRED, CNC, RESULTS
let roundTimer = ROUND_TIME;
let lastTime = performance.now();

let balls = [];
let particles = [];
let players = {}; 
let avatarCache = {};

let mvpPlayer = null;
let cncProgress = 0; 
let laserPos = { x: 0, y: 0 };
let isGoldPlated = false;

// ==========================================
// ZVUKY
// ==========================================
function unlockAudio() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    soundEnabled = true;
    document.getElementById('btn-sound').innerText = "Sound ON";
}

function playTone(freq, type, duration, vol=0.1) {
    if(!soundEnabled || !audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

// ==========================================
// AVATARY A TEXTURY
// ==========================================
function loadAvatar(url) {
    if(!url) return null;
    if(avatarCache[url]) return avatarCache[url] === 'loading' ? null : avatarCache[url];
    avatarCache[url] = 'loading';
    let img = new Image();
    img.crossOrigin = "Anonymous"; // Zásadní pro TikTok obrázky na Canvasu
    img.onload = () => { avatarCache[url] = img; };
    img.onerror = () => { avatarCache[url] = null; };
    img.src = url;
    return null;
}

// ==========================================
// FYZIKA A SPAWNOVÁNÍ KULIČEK
// ==========================================
function spawnBall(userId, name, avatarUrl, side) {
    let opt = OPTIONS[side];
    // Spawnuje se přesně nad daným skleněným tubusem
    let x = opt.x + opt.w/2 + (Math.random()*100 - 50);
    let y = TUBES_Y - 150 - Math.random() * 100;
    let r = 38; // Zvětšené fotky
    
    balls.push({
        userId: userId, name: name, avatar: avatarUrl, side: side,
        x: x, y: y, vx: (Math.random()-0.5)*100, vy: Math.random()*100, r: r, active: true
    });
    
    playTone(side === 'A' ? 500 : 700, 'sine', 0.1, 0.05);
}

function updatePhysics(dt) {
    let winningSide = getWinningSide();
    
    for(let b of balls) {
        if(!b.active) continue;
        b.vy += 3000 * dt; // Silnější gravitace
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        
        b.vx *= 0.98; b.vy *= 0.98; // Tření vzduchu
        
        let opt = OPTIONS[b.side];
        
        // Zdi skleněného tubusu
        let minX = opt.x + 10 + b.r;
        let maxX = opt.x + opt.w - 10 - b.r;
        if(b.x < minX) { b.x = minX; b.vx *= -0.5; }
        if(b.x > maxX) { b.x = maxX; b.vx *= -0.5; }
        
        // Podlaha tubusu (Otevře se pro poražené během SHRED fáze)
        let floorActive = state === "VOTE" || (state === "SHRED" && b.side === winningSide) || state === "CNC" || state === "RESULTS";
        if(floorActive) {
            if(b.y > FLOOR_Y - b.r) { b.y = FLOOR_Y - b.r; b.vy *= -0.3; }
        }
        
        if(b.y > H + 100) b.active = false; // Úplně zmizí až když propadnou obrazovkou
    }
    
    // Stabilní kolize kuliček mezi sebou
    for(let iter = 0; iter < 4; iter++) {
        for(let i=0; i<balls.length; i++) {
            if(!balls[i].active) continue;
            for(let j=i+1; j<balls.length; j++) {
                if(!balls[j].active) continue;
                if(balls[i].side !== balls[j].side) continue; // Nekolidují přes tubus
                
                let dx = balls[j].x - balls[i].x;
                let dy = balls[j].y - balls[i].y;
                let dist = Math.hypot(dx, dy);
                let minDist = balls[i].r + balls[j].r;
                
                if(dist < minDist && dist > 0.001) {
                    let overlap = minDist - dist;
                    let nx = dx / dist, ny = dy / dist;
                    
                    // Rozstrčení kuliček od sebe
                    balls[i].x -= nx * overlap * 0.5; balls[i].y -= ny * overlap * 0.5;
                    balls[j].x += nx * overlap * 0.5; balls[j].y += ny * overlap * 0.5;
                    
                    let dvx = balls[j].vx - balls[i].vx; let dvy = balls[j].vy - balls[i].vy;
                    let impulse = (dvx * nx + dvy * ny) * 0.4; // 0.4 je tvrdost odrazu
                    if(impulse < 0) {
                        balls[i].vx += nx * impulse; balls[i].vy += ny * impulse;
                        balls[j].vx -= nx * impulse; balls[j].vy -= ny * impulse;
                    }
                }
            }
        }
    }
}

function getWinningSide() {
    let countA = balls.filter(b => b.side === 'A' && b.active).length;
    let countB = balls.filter(b => b.side === 'B' && b.active).length;
    return countA >= countB ? 'A' : 'B';
}

function startCNC() {
    let winSide = getWinningSide();
    let winBalls = balls.filter(b => b.side === winSide && b.active);
    
    if(winBalls.length > 0) {
        // Nalezení MVP
        let best = winBalls[0];
        let maxScore = -1;
        for(let b of winBalls) {
            let p = players[b.userId];
            let score = p ? (p.gifts * 100 + p.likes * 10) : 0;
            if(score > maxScore) { maxScore = score; best = b; }
        }
        mvpPlayer = best;
    } else {
        mvpPlayer = { name: "NOBODY", avatar: null }; 
    }
    
    cncProgress = 0;
    state = "CNC";
    playTone(200, 'square', 1.0, 0.1); // Zapnutí stroje
}

function spawnSparks(x, y) {
    if(particles.length > 200) return;
    for(let i=0; i<4; i++) {
        particles.push({
            x: x + (Math.random()-0.5)*10, y: y,
            vx: (Math.random()-0.5)*1200, vy: -Math.random()*1000 - 300,
            life: 1.0, color: isGoldPlated ? '#FFDC00' : '#FF4136', type: 'spark'
        });
    }
    // Dým
    if(Math.random() > 0.5) {
        particles.push({
            x: x, y: y - 20,
            vx: (Math.random()-0.5)*100, vy: -Math.random()*200 - 100,
            life: 1.0, size: Math.random()*20+20, color: 'rgba(50,50,50,', type: 'smoke'
        });
    }
}

// ==========================================
// VYKRESLOVACÍ FUNKCE (GRAFIKA)
// ==========================================
function drawRoundedRect(x, y, w, h, r, fill, stroke, strokeW) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if(fill) { ctx.fillStyle = fill; ctx.fill(); }
    if(stroke) { ctx.lineWidth = strokeW; ctx.strokeStyle = stroke; ctx.stroke(); }
}

function drawBall(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    
    // Ořez pro profilovku
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.clip();
    
    let img = loadAvatar(b.avatar);
    if(img && img !== 'loading') {
        ctx.drawImage(img, -b.r, -b.r, b.r*2, b.r*2);
    } else {
        ctx.fillStyle = '#222'; ctx.fillRect(-b.r, -b.r, b.r*2, b.r*2);
        ctx.fillStyle = '#fff'; ctx.font = "bold 35px Arial";
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.name.charAt(0).toUpperCase(), 0, 2);
    }
    
    // 3D Stínování (Skleněný/Prostorový efekt)
    let grad = ctx.createRadialGradient(-b.r*0.3, -b.r*0.3, b.r*0.1, 0, 0, b.r);
    grad.addColorStop(0, 'rgba(255,255,255,0.4)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = grad;
    ctx.fillRect(-b.r, -b.r, b.r*2, b.r*2);
    
    ctx.restore();
    
    // Zářící okraj týmu
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.lineWidth = 5; ctx.strokeStyle = OPTIONS[b.side].color;
    ctx.stroke();
}

function drawTubes() {
    for(let key of ['A', 'B']) {
        let opt = OPTIONS[key];
        // Zadní stěna tubusu
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(opt.x, TUBES_Y, opt.w, TUBES_H);
    }
    
    // Kuličky uvnitř
    for(let b of balls) if(b.active) drawBall(b);
    
    for(let key of ['A', 'B']) {
        let opt = OPTIONS[key];
        
        // Přední sklo (Odlesk)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.moveTo(opt.x, TUBES_Y); ctx.lineTo(opt.x + opt.w/2, TUBES_Y);
        ctx.lineTo(opt.x, TUBES_Y + TUBES_H); ctx.fill();
        
        // Kovový rám tubusu
        drawRoundedRect(opt.x, TUBES_Y, opt.w, TUBES_H, 15, null, opt.color, 12);
        drawRoundedRect(opt.x-5, TUBES_Y-5, opt.w+10, TUBES_H+10, 15, null, '#111', 4);
        
        // Nadpis tubusu
        ctx.fillStyle = '#111';
        drawRoundedRect(opt.x + 20, TUBES_Y - 60, opt.w - 40, 80, 10, '#111', opt.color, 4);
        ctx.fillStyle = '#fff'; ctx.font = "900 45px Arial Black"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`[${key}] ${opt.emoji} ${opt.title}`, opt.x + opt.w/2, TUBES_Y - 20);
        
        // Počítadlo procent
        let total = balls.filter(b => b.active).length || 1;
        let count = balls.filter(b => b.side === key && b.active).length;
        let pct = Math.round((count/total)*100);
        
        ctx.fillStyle = opt.color;
        ctx.font = "900 80px Arial Black";
        ctx.lineWidth = 8; ctx.strokeStyle = '#000';
        ctx.strokeText(`${pct}%`, opt.x + opt.w/2, TUBES_Y + TUBES_H - 60);
        ctx.fillText(`${pct}%`, opt.x + opt.w/2, TUBES_Y + TUBES_H - 60);
    }
}

function drawCNC() {
    let px = 140, py = 250, pSize = 800; // Hlavní deska nahoře
    
    // Stín pod deskou
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(px+20, py+20, pSize, pSize);
    
    // Samotná deska
    let plateColor = isGoldPlated ? '#FFD700' : '#8B7355'; // Zlato nebo Dřevo
    drawRoundedRect(px, py, pSize, pSize, 20, plateColor, '#222', 15);
    
    ctx.fillStyle = '#fff'; ctx.font = "900 60px Arial Black"; ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = '#000';
    ctx.strokeText("CNC MASTERPIECE", W/2, py - 40); ctx.fillText("CNC MASTERPIECE", W/2, py - 40);
    
    if(!mvpPlayer) return;
    
    // 2. Gravírování (Odhalovací maska)
    ctx.save();
    let revealH = pSize * cncProgress;
    ctx.beginPath(); ctx.rect(px, py, pSize, revealH); ctx.clip();
    
    let img = loadAvatar(mvpPlayer.avatar);
    if(img && img !== 'loading') {
        ctx.drawImage(img, px + 100, py + 100, pSize - 200, pSize - 200);
        // "Vypálený" filtr přes fotku
        ctx.fillStyle = isGoldPlated ? 'rgba(80, 50, 0, 0.6)' : 'rgba(40, 20, 10, 0.7)';
        ctx.fillRect(px, py, pSize, pSize);
    }
    
    // Nápis dole na desce
    ctx.fillStyle = '#111'; ctx.font = "900 50px Arial Black";
    ctx.fillText("WINNER: " + mvpPlayer.name, px + pSize/2, py + pSize - 40);
    ctx.restore();
    
    // 3. Laser / Hlava
    if(state === "CNC") {
        let scanLines = 25;
        let currentLine = Math.floor(cncProgress * scanLines);
        let lineProgress = (cncProgress * scanLines) % 1;
        
        laserPos.x = px + (currentLine % 2 === 0 ? lineProgress * pSize : (1 - lineProgress) * pSize);
        laserPos.y = py + revealH;
        
        spawnSparks(laserPos.x, laserPos.y);
        if(Math.random() > 0.5) playTone(200 + Math.random()*50, 'sawtooth', 0.1, 0.03); // Řezací zvuk
        
        // Zářící paprsek (Additive blending pro neonový look)
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        
        ctx.beginPath(); ctx.moveTo(laserPos.x, 0); ctx.lineTo(laserPos.x, laserPos.y);
        ctx.lineWidth = 20; ctx.strokeStyle = 'rgba(0, 242, 254, 0.3)'; ctx.stroke();
        ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0, 242, 254, 0.8)'; ctx.stroke();
        ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        
        // Glow bod na desce
        ctx.beginPath(); ctx.arc(laserPos.x, laserPos.y, 20, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.restore();
    }
}

function drawUI() {
    let topText = state === "VOTE" ? `TIME: ${Math.ceil(roundTimer)}s` : state === "SHRED" ? "LOSERS SHREDDED!" : state === "CNC" ? "ENGRAVING MVP..." : "ROUND OVER";
    let color = state === "VOTE" && roundTimer <= 10 ? '#FF4136' : '#00f2fe';
    
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = "900 60px Arial Black"; ctx.lineWidth = 8; ctx.strokeStyle = '#000';
    
    // Pozadí pro horní lištu
    drawRoundedRect(W/2 - 350, 40, 700, 100, 20, 'rgba(10,15,30,0.8)', color, 5);
    ctx.strokeText(topText, W/2, 90); ctx.fillStyle = color; ctx.fillText(topText, W/2, 90);
}

function draw() {
    let now = performance.now();
    let dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    
    // Čisté Chroma zelené pozadí pro OBS Minecraft
    ctx.fillStyle = '#00FF00';
    ctx.fillRect(0, 0, W, H);
    
    // State machine
    if(state === "VOTE") {
        roundTimer -= dt;
        if(roundTimer <= 0) {
            state = "SHRED"; roundTimer = 4;
            playTone(80, 'sawtooth', 3.0, 0.3); // Hluboký dunivý zvuk drcení
        }
    } else if(state === "SHRED") {
        roundTimer -= dt;
        if(roundTimer <= 0) startCNC();
    } else if(state === "CNC") {
        let speedMult = 1.0 + (isGoldPlated ? 1.0 : 0);
        cncProgress += (dt / 15.0) * speedMult; 
        if(cncProgress >= 1.0) {
            cncProgress = 1.0; state = "RESULTS"; roundTimer = 6;
            playTone(400, 'sine', 0.2, 0.1); setTimeout(() => playTone(600, 'sine', 0.5, 0.1), 200);
        }
    } else if(state === "RESULTS") {
        roundTimer -= dt;
        if(roundTimer <= 0) {
            state = "VOTE"; roundTimer = ROUND_TIME;
            balls = []; particles = []; players = {}; isGoldPlated = false; mvpPlayer = null;
        }
    }
    
    updatePhysics(dt);
    
    // Particle update
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.5;
        if(p.type === 'spark') { p.vy += 3000 * dt; } // gravitace na jiskry
        else { p.size += dt * 30; } // dým se zvětšuje
        if(p.life <= 0) particles.splice(i, 1);
    }
    
    // Kreslení odzadu dopředu
    drawCNC();
    drawTubes();
    
    // Kreslení částic
    ctx.save();
    for(let p of particles) {
        if(p.type === 'spark') {
            ctx.globalCompositeOperation = "lighter";
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = p.color + p.life + ')';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
    }
    ctx.restore();
    
    drawUI();
    requestAnimationFrame(draw);
}

// ==========================================
// TIKFINITY INTEGRACE
// ==========================================
let socket;
function connectTikfinity() {
    socket = new WebSocket("ws://localhost:21213/");
    socket.onopen = () => console.log("TikFinity Connected!");
    socket.onclose = () => setTimeout(connectTikfinity, 5000);
    
    socket.onmessage = (e) => {
        try {
            let msg = JSON.parse(e.data);
            let event = msg.event || msg.type || "";
            let data = msg.data || msg;
            
            let name = data.nickname || data.uniqueId || "User";
            let userId = data.uniqueId || data.userId || name;
            let avatar = data.profilePictureUrl || "";
            
            if(!players[userId]) players[userId] = { name: name, avatar: avatar, likes: 0, gifts: 0, voted: false };
            let p = players[userId];
            
            if(event === "chat" && state === "VOTE" && !p.voted) {
                let text = (data.comment || data.text || "").toUpperCase().trim();
                if(text === 'A' || text === 'B') {
                    p.voted = true; spawnBall(userId, name, avatar, text);
                }
            }
            else if(event === "like" && state === "CNC") {
                p.likes += (data.likeCount || 1);
                cncProgress += 0.02; // Okamžité zrychlení
            }
            else if(event === "gift") {
                p.gifts += (data.diamondCount || data.coins || 1);
                if(state === "CNC" && !isGoldPlated) {
                    isGoldPlated = true; playTone(600, 'square', 0.5, 0.1);
                }
            }
        } catch(err) {}
    };
}

// ==========================================
// ADMIN OVLÁDÁNÍ
// ==========================================
document.addEventListener('keydown', (e) => {
    if(e.key.toLowerCase() === 'h') {
        let pnl = document.getElementById('admin-panel');
        pnl.style.display = pnl.style.display === 'none' || pnl.style.display === '' ? 'block' : 'none';
    }
});

// Použití picsum.photos pro testování, abys viděl, že profilovky a 3D efekt koulí fungují
let testId = 1;
document.getElementById('btn-sound').onclick = unlockAudio;
document.getElementById('btn-voteA').onclick = () => { if(state==="VOTE") spawnBall("t"+testId, "TesterA", "https://picsum.photos/100?random="+testId++, "A"); };
document.getElementById('btn-voteB').onclick = () => { if(state==="VOTE") spawnBall("t"+testId, "TesterB", "https://picsum.photos/100?random="+testId++, "B"); };
document.getElementById('btn-like').onclick = () => { if(state==="CNC") cncProgress += 0.05; };
document.getElementById('btn-gift').onclick = () => { isGoldPlated = true; };
document.getElementById('btn-end').onclick = () => { if(state==="VOTE") roundTimer = 0; };

// INIT
connectTikfinity();
requestAnimationFrame(draw);

</script>
</body>
</html>
