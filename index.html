    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;

  }
  #game-container {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: 56.25vh;
    max-width: 100vw;
    height: 100vh;
    max-height: 177.78vw;
  }
  #panel {
    position: fixed; z-index: 9999; top: 10px; left: 10px;
    max-width: 880px; width: 94vw; max-height: 92vh; overflow: auto;
    padding: 16px 20px; background: linear-gradient(145deg, #10162f, #070a17); color: #fff;
    border: 3px solid #00f2fe; border-radius: 18px;
    box-shadow: 0 16px 50px rgba(0,0,0,0.92);
    display: none;
  }
  button, input {
    padding: 8px 13px; margin: 3px; border-radius: 10px;
    background: #1b2647; color: #fff; border: 2px solid #00f2fe;
    font: 700 13px "Segoe UI", Arial, sans-serif;
    cursor: pointer; transition: transform 0.1s, background 0.15s;
  }
  button:hover { background: #00f2fe; color: #050914; transform: translateY(-1px); }
  .btn-gold { border-color: #ffd84d; background: #3b2a08; color: #ffe885; }
  .btn-gold:hover { background: #ffd84d; color: #1a1100; }
  .btn-diamond { border-color: #d48aff; background: #2d1447; color: #f0d1ff; }
  .btn-diamond:hover { background: #d48aff; color: #120421; }
  input { width: 270px; max-width: 68vw; cursor: text; }
  #volume { width: 150px; vertical-align: middle; padding: 0; border: 0; }
  #audioStatus { max-width: 720px; font-size: 13px; color: #9be8ff; margin: 5px 0; }
  #errBox {
    position: fixed; bottom: 8px; left: 8px; z-index: 9999;
    background: #b00020; color: #fff; padding: 6px 12px; border-radius: 6px;
    font: 700 13px monospace; display: none;
  }

  function createFallbackAvatar(seedStr, side) {
    const cnv = document.createElement('canvas');
    cnv.width = cnv.height = 128;
    const g = cnv.getContext('2d');
    const bgGrad = g.createLinearGradient(0, 0, 128, 128);
    if (side === 'A') {
      bgGrad.addColorStop(0, '#ff2a6d');
      bgGrad.addColorStop(1, '#6e0627');
    } else {
      bgGrad.addColorStop(0, '#00f2fe');
      bgGrad.addColorStop(1, '#073b6e');
    }
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, 128, 128);

    g.fillStyle = '#ffdfc4';
    g.beginPath(); g.arc(64, 52, 28, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#141e38';
    g.beginPath(); g.arc(64, 124, 42, Math.PI, Math.PI * 2); g.fill();

    g.fillStyle = side === 'A' ? '#ffd84d' : '#00f2fe';
    g.fillRect(42, 42, 44, 11);
    g.strokeStyle = '#090e20'; g.lineWidth = 4;
    g.strokeRect(42, 42, 44, 11);

    g.beginPath();
    g.arc(64, 60, 10, 0.15 * Math.PI, 0.85 * Math.PI);
    g.stroke();
    return cnv;

  function avatarUrl(d) {
    const u = d.user || d;
    const owners = [u, d, u && u.userDetails, d && d.userDetails];
    const keys = ['profilePictureUrl', 'profilePictureUrls', 'avatarThumb', 'avatarMedium', 'avatarLarger', 'avatarUrl', 'avatar'];
    for (let o = 0; o < owners.length; o++) {
      const owner = owners[o];
      if (!owner) continue;
      for (let k = 0; k < keys.length; k++) {
        const raw = owner[keys[k]];
        const values = typeof raw === 'string' ? [raw] : Array.isArray(raw) ? raw : (raw && (raw.urlList || raw.url_list || [raw.url]));
        if (!values) continue;
        for (let i = 0; i < values.length; i++) {

              const parsed = new URL(val);
              if (parsed.protocol === 'https:' && !parsed.username && !parsed.password) return parsed.href;
            } catch (e) {}
          }
        }
      }
    }
    return '';
  }

    const type = String(raw.event || raw.type || '').toLowerCase();

    const d = raw.data;

  function speakTTS(text, priority) {
    if (!ttsEnabled || !sound || soundLevel === 0) return;
    if (!('speechSynthesis' in window)) return;
    const now = performance.now();
    if (!priority && now - lastSpokenAt < 2800) return;
    try {
      if (priority) window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(String(text));
      utter.lang = 'en-US';
      utter.rate = 1.08;
      utter.pitch = 1.05;
      utter.volume = clamp(soundLevel, 0, 1);
      const voices = window.speechSynthesis.getVoices();

      window.speechSynthesis.speak(utter);
      lastSpokenAt = now;

        filter.type = 'lowpass'; filter.frequency.value = 4800; filter.Q.value = 0.6;

        limiter.attack.value = 0.001; limiter.release.value = 0.06;
        master.gain.value = soundLevel;
        filter.connect(compressor); compressor.connect(master); master.connect(limiter); limiter.connect(audioCtx.destination);
        sfxMix.input = filter; sfxMix.master = master;
        audioCtx.onstatechange = updateSoundUI;
      }
      if (audioCtx.state === 'running') { sfxMix.error = ''; updateSoundUI(); return Promise.resolve(true); }
      const t = performance.now();
      if (audioCtx.state === 'closed' || (!gesture && t - sfxMix.resumeAt < 350)) { updateSoundUI(); return Promise.resolve(false); }
      sfxMix.resumeAt = t;
      updateSoundUI();
      return Promise.resolve(audioCtx.resume()).then(() => {
        sfxMix.error = ''; updateSoundUI(); return audioCtx.state === 'running';
      }, () => { updateSoundUI(); return false; });
    } catch (e) {
      updateSoundUI(); return Promise.resolve(false);
    }
  }

  function sfxTone(freq, duration, volume, panVal, wave, delay, endRatio) {
    if (!sound) return false;
    if (!audioCtx || audioCtx.state !== 'running') unlockAudio(false);
    if (!audioCtx || audioCtx.state !== 'running' || !sfxMix.input || sfxMix.voices.size >= sfxMix.limit) return false;
    try {
      const at = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      const voice = { osc: osc, gain: gain };
      osc.type = wave || 'sine';
      osc.frequency.setValueAtTime(freq, at);
      osc.frequency.exponentialRampToValueAtTime(Math.max(35, freq * (endRatio || 1)), at + duration);
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(volume, at + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
      osc.connect(gain);
      if (pan) { pan.pan.value = clamp(panVal || 0, -1, 1); gain.connect(pan); pan.connect(sfxMix.input); }
      else gain.connect(sfxMix.input);
      sfxMix.voices.add(voice);
      osc.onended = () => { sfxMix.voices.delete(voice); osc.disconnect(); gain.disconnect(); if (pan) pan.disconnect(); };
      osc.start(at); osc.stop(at + duration + 0.02);
      soundEvents++;
      return true;
    } catch (e) { return false; }
  }

  function playSfx(kind, side, tier) {
    const t = performance.now();
    const cd = { vote: 45, bounce: 55, bumper: 45, like: 70, crown: 400, shred: 500, cnc: 55, gift: 250, win: 600 }[kind] || 65;
    const prev = sfxMix.last.has(kind) ? sfxMix.last.get(kind) : -Infinity;
    if (t - prev < cd) return;
    sfxMix.last.set(kind, t);
    const pan = side === 'A' ? -0.3 : side === 'B' ? 0.3 : 0;
    if (kind === 'vote') {
      const f = side === 'A' ? 520 : 660;
      sfxTone(f, 0.12, 0.065, pan, 'sine', 0, 1.32);
      sfxTone(f * 1.5, 0.09, 0.035, pan, 'triangle', 0.03, 1.15);
    } else if (kind === 'bumper') {
      const note = SFX_NOTES[Math.floor(Math.random() * SFX_NOTES.length)] * 2;
      sfxTone(note, 0.11, 0.055, pan, 'triangle', 0, 1.25);
    } else if (kind === 'bounce') {
      sfxTone(190 + Math.random() * 90, 0.06, 0.022, pan, 'sine', 0, 0.85);
    } else if (kind === 'like') {
      sfxTone(SFX_NOTES[Math.floor(Math.random() * SFX_NOTES.length)] * 2, 0.1, 0.045, pan, 'sine', 0, 1.2);
    } else if (kind === 'crown') {
      [0, 3, 5].forEach((n, i) => sfxTone(SFX_NOTES[n] * 2, 0.22, 0.06, pan, 'triangle', i * 0.055, 1.05));
    } else if (kind === 'shred') {
      sfxTone(130, 0.65, 0.11, pan, 'sawtooth', 0, 0.38);
      sfxTone(82, 0.75, 0.09, 0, 'triangle', 0.06, 0.45);
    } else if (kind === 'cnc') {
      const f = 260 + (Math.random() * 120);
      sfxTone(f, 0.065, 0.028, (Math.random() - 0.5) * 0.4, 'sawtooth', 0, 0.92);
    } else if (kind === 'gift') {
      const gt = tier || 1;
      const notes = gt >= 4 ? [0, 2, 4, 5, 6, 7] : gt >= 2 ? [0, 2, 4, 6, 7] : [0, 3, 5];
      notes.forEach((n, i) => sfxTone(SFX_NOTES[n] * (gt >= 3 ? 2.5 : 2), 0.38, 0.095, 0, gt >= 3 ? 'triangle' : 'sine', i * 0.06, 1.04));
      if (gt >= 3) sfxTone(110, 0.7, 0.1, 0, 'sawtooth', 0, 0.5);
    } else if (kind === 'win') {
      [0, 2, 4, 7].forEach((n, i) => sfxTone(SFX_NOTES[n] * 2, 0.4, 0.085, 0, 'triangle', i * 0.08, 1.02));
    }
  }

  function testSound() {
    sound = true;
    if (soundLevel === 0) setSoundLevel(0.85);
    applySoundLevel();
    return unlockAudio(true).then(ready => {
      if (!ready) return false;
      playSfx('win');
      speakTTS('Galaxinko Trophy Forge Three Point Oh is ready!', true);
      return true;
    });
  }

  function toggleSound() {
    if (!sound || soundLevel === 0) {
      sound = true; applySoundLevel(); return testSound();
    }
    sound = false; applySoundLevel(); return Promise.resolve(false);
  }

  const pics = new Map();
  const engravedCache = new Map();
  let portraitJobs = 0;

  function requestPic(url) {
    if (!url || pics.has(url) || pics.size >= MAX) return;
    pics.set(url, { state: 'waiting' });
    pumpPics();
  }

  function pumpPics() {
    pics.forEach((entry, u) => {
      if (portraitJobs >= 4 || entry.state !== 'waiting') return;
      entry.state = 'loading';
      portraitJobs++;
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.referrerPolicy = 'no-referrer';
      let done = false;
      const finish = ok => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        img.onload = img.onerror = null;
        if (ok && img.naturalWidth) {
          const thumb = document.createElement('canvas');
          thumb.width = thumb.height = 128;
          const g = thumb.getContext('2d');
          const side = Math.min(img.naturalWidth, img.naturalHeight);
          g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 128, 128);
          entry.img = thumb;
          entry.state = 'ready';
        } else {
          entry.state = 'failed';
        }
        portraitJobs--;
        pumpPics();
      };
      const timer = setTimeout(() => finish(false), 7500);
      img.onload = () => finish(true);
      img.onerror = () => finish(false);
      img.src = u;
    });
  }

  function getPlayerImage(p) {
    const picEntry = p.avatar ? pics.get(p.avatar) : null;
    if (picEntry && picEntry.state === 'ready') return picEntry.img;
    if (!p.fallbackCanvas) {
      p.fallbackCanvas = createFallbackAvatar(p.id, p.side || 'A');
    }
    return p.fallbackCanvas;
  }

  // Builds a circular embossed metallic/gold/diamond/mythic relief of the MVP portrait
  function buildEngravedPortrait(p, forgeTier) {
    const picEntry = p.avatar ? pics.get(p.avatar) : null;
    const cacheKey = p.id + ':t' + forgeTier + ':' + (picEntry ? picEntry.state : 'fb');
    if (engravedCache.has(cacheKey)) return engravedCache.get(cacheKey);

    const size = 440;
    const cnv = document.createElement('canvas');
    cnv.width = cnv.height = size;
    const g = cnv.getContext('2d');
    const srcImg = getPlayerImage(p);

    g.drawImage(srcImg, 0, 0, size, size);
    try {
      const imgData = g.getImageData(0, 0, size, size);
      const d = imgData.data;
      const copy = new Uint8ClampedArray(d);
      const cx = size / 2, cy = size / 2;
      for (let y = 1; y < size - 1; y++) {
        for (let x = 1; x < size - 1; x++) {
          const i = (y * size + x) * 4;
          const iPrev = ((y - 1) * size + (x - 1)) * 4;
          const dist = Math.hypot(x - cx, y - cy);
          const ringGroove = 0.9 + 0.1 * Math.sin(dist * 0.85);
          const lum = (0.299 * copy[i] + 0.587 * copy[i + 1] + 0.114 * copy[i + 2]) / 255;
          const lumPrev = (0.299 * copy[iPrev] + 0.587 * copy[iPrev + 1] + 0.114 * copy[iPrev + 2]) / 255;
          const emboss = clamp((lum - lumPrev) * 2.4, -0.38, 0.48);
          const val = clamp((Math.pow(lum, 0.86) * 0.84 + 0.16 + emboss) * ringGroove, 0, 1);

          if (forgeTier >= 4) {
            const wave = 0.5 + 0.5 * Math.sin((x + y) * 0.035);
            d[i]     = Math.round(75 + val * 180);
            d[i + 1] = Math.round(30 + val * (135 + wave * 50));
            d[i + 2] = Math.round(55 + val * (110 + (1 - wave) * 90));
          } else if (forgeTier === 3) {
            d[i]     = Math.round(45 + val * 175);
            d[i + 1] = Math.round(55 + val * 195);
            d[i + 2] = Math.round(95 + val * 160);
          } else if (forgeTier === 2) {
            d[i]     = Math.round(70 + val * 185);
            d[i + 1] = Math.round(45 + val * 165);
            d[i + 2] = Math.round(10 + val * 75);
          } else if (forgeTier === 1) {
            d[i]     = Math.round(68 + val * 182);
            d[i + 1] = Math.round(34 + val * 135);
            d[i + 2] = Math.round(22 + val * 95);
          } else {
            d[i]     = Math.round(25 + val * 160);
            d[i + 1] = Math.round(50 + val * 195);
            d[i + 2] = Math.round(75 + val * 180);
          }
        }
      }
      g.putImageData(imgData, 0, 0);
    } catch (e) {}

    if (engravedCache.size > 24) engravedCache.delete(engravedCache.keys().next().value);
    engravedCache.set(cacheKey, cnv);
    return cnv;
  }

  const VOTE_DURATION = 35.0;
  const SHRED_DURATION = 3.6;
  const CNC_DURATION = 8.5;
  const SHOW_DURATION = 4.2;

  class TrophyForgeGame {
    constructor() {
      this.players = new Map();
      this.aliases = new Map();
      this.seen = new Map();
      this.balls = [];
      this.chips = [];
      this.shockwaves = [];
      this.popups = [];
      this.laserBeams = [];
      this.giftMeteors = [];
      this.nextRoundQueue = [];
      this.hallOfFame = [];
      this.bumpers = [];
      this.qIndex = -1;
      this.question = QUESTIONS[0];
      this.phase = 'VOTE';
      this.timer = VOTE_DURATION;
      this.cncProgress = 0;
      this.forgeSlide = 0;
      this.trapdoorAngle = 0;
      this.forgeTier = 0;
      this.mvp = null;
      this.leaderA = null;
      this.leaderB = null;
      this.winningSide = 'A';
      this.sawAngle = 0;
      this.shake = 0;
      this.banner = null;
      this.round = 0;
      this.lastSpokenCountdown = 6;
      this.pacerSpawned = false;
      this.initBumpers();
      this.nextRound();
    }

    initBumpers() {
      this.bumpers = [];
      const setups = [
        { side: 'A', box: CHAMBER_A, col: TEAM_A },
        { side: 'B', box: CHAMBER_B, col: TEAM_B }
      ];
      setups.forEach(s => {
        const cx = (s.box.left + s.box.right) / 2;
        this.bumpers.push(
          { side: s.side, x: cx - 105, y: 690, r: 24, hitAt: -999, color: s.col },
          { side: s.side, x: cx + 105, y: 690, r: 24, hitAt: -999, color: s.col },
          { side: s.side, x: cx,       y: 865, r: 28, hitAt: -999, color: GOLD }
        );
      });
    }

    nextRound() {
      this.round++;
      this.qIndex = (this.qIndex + 1 + Math.floor(Math.random() * 3)) % QUESTIONS.length;
      this.question = QUESTIONS[this.qIndex];
      this.phase = 'VOTE';
      this.timer = VOTE_DURATION;
      this.lastSpokenCountdown = 6;
      this.cncProgress = 0;
      this.forgeSlide = 0;
      this.trapdoorAngle = 0;
      this.forgeTier = 0;
      this.mvp = null;
      this.leaderA = null;
      this.leaderB = null;
      this.balls = [];
      this.chips = [];
      this.shockwaves = [];
      this.popups = [];
      this.laserBeams = [];
      this.giftMeteors = [];
      this.pacerSpawned = false;

      this.players.forEach(p => {
        p.side = null;
        p.roundLikes = 0;
        p.roundGifts = 0;
        p.roundScore = 0;
        p.giftTier = 0;
      });

      speakTTS('Round ' + this.round + '! ' + this.question.a + ', or ' + this.question.b + '? Type A or B!', false);

      if (this.nextRoundQueue.length > 0) {
        const queued = this.nextRoundQueue.slice(0, 40);
        this.nextRoundQueue = [];
        queued.forEach(item => {
          const p = this.players.get(item.playerId);
          if (p) {
            p.roundScore += 35;
            this.castVote(p, item.side, true);
          }
        });
      }
    }

    addPopup(x, y, text, color, size) {
      if (this.popups.length > 40) this.popups.shift();
      this.popups.push({ x: x, y: y, text: text, color: color || WHITE, size: size || 24, life: 1.0 });
    }

    addShockwave(x, y, maxR, color) {
      if (this.shockwaves.length > 30) this.shockwaves.shift();
      this.shockwaves.push({ x: x, y: y, r: 10, maxR: maxR || 95, color: color || WHITE, life: 1.0 });
    }

    addLaserBeam(fromX, fromY, toX, toY, color, label) {
      if (this.laserBeams.length > 16) this.laserBeams.shift();
      this.laserBeams.push({ fromX: fromX, fromY: fromY, toX: toX, toY: toY, color: color, label: label, life: 1.0 });
    }

    updateChamberLeaders() {
      let bestA = null, maxA = -1;
      let bestB = null, maxB = -1;

      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (b.isPacer || b.isClone) continue;
        const p = this.players.get(b.playerId);
        if (!p) continue;
        if (b.side === 'A' && p.roundScore > maxA) {
          maxA = p.roundScore;
          bestA = p.id;
        } else if (b.side === 'B' && p.roundScore > maxB) {
          maxB = p.roundScore;
          bestB = p.id;
        }
      }

      if (bestA && bestA !== this.leaderA && this.leaderA !== null) {
        const pA = this.players.get(bestA);
        if (pA) {
          this.addPopup((CHAMBER_A.left + CHAMBER_A.right) / 2, 535, '👑 ' + pA.name + ' TOOK #1 IN [A]!', GOLD, 24);
          playSfx('crown', 'A');
        }
      }
      if (bestB && bestB !== this.leaderB && this.leaderB !== null) {
        const pB = this.players.get(bestB);
        if (pB) {
          this.addPopup((CHAMBER_B.left + CHAMBER_B.right) / 2, 535, '👑 ' + pB.name + ' TOOK #1 IN [B]!', GOLD, 24);
          playSfx('crown', 'B');
        }
      }

      this.leaderA = bestA;
      this.leaderB = bestB;
    }

    getPlayer(id, userId) {
      const sId = String(id);
      const sUid = userId ? String(userId) : '';
      const key = this.aliases.get(sId) || (sUid && this.aliases.get(sUid)) || sId;
      return this.players.get(key);
    }

    ensurePlayer(e) {
      let p = this.getPlayer(e.id, e.userId);
      if (!p) {
        if (this.players.size >= MAX) {
          const firstKey = this.players.keys().next().value;
          this.players.delete(firstKey);
        }
        p = {
          id: String(e.id),
          name: clean(e.name || e.id),
          avatar: e.avatar || '',
          side: null,
          roundLikes: 0,
          roundGifts: 0,
          roundScore: 0,
          giftTier: 0,
          winStreak: 0,
          lastShareAt: -Infinity
        };
        this.players.set(p.id, p);
      }
      if (e.name) p.name = clean(e.name);
      if (e.avatar) { p.avatar = e.avatar; requestPic(p.avatar); }
      [e.id, e.userId].forEach(alias => {
        if (alias && String(alias) !== p.id && this.aliases.size < MAX * 3) {
          this.aliases.set(String(alias), p.id);
        }
      });
      return p;
    }

    spawnPacerBots() {
      if (this.pacerSpawned || this.phase !== 'VOTE') return;
      this.pacerSpawned = true;
      const pacers = [
        { id: 'pacer_a1', name: 'PACER_A1', side: 'A' },
        { id: 'pacer_b1', name: 'PACER_B1', side: 'B' },
        { id: 'pacer_a2', name: 'PACER_A2', side: 'A' },
        { id: 'pacer_b2', name: 'PACER_B2', side: 'B' }
      ];
      pacers.forEach(bot => {
        const box = bot.side === 'A' ? CHAMBER_A : CHAMBER_B;
        const x = (box.left + box.right) / 2 + (Math.random() - 0.5) * 160;
        this.balls.push({
          playerId: bot.id,
          name: bot.name,
          side: bot.side,
          x: x, y: box.top + 40 + Math.random() * 40,
          vx: (Math.random() - 0.5) * 380,
          vy: 160 + Math.random() * 120,
          r: 34, targetR: 34,
          angle: 0, omega: (Math.random() - 0.5) * 6,
          squashX: 1, squashY: 1,
          trail: [], giftTier: 0,
          isPacer: true, isClone: false, shredded: false
        });
      });
    }

    removePacerBots() {
      for (let i = this.balls.length - 1; i >= 0; i--) {
        if (this.balls[i].isPacer) this.balls.splice(i, 1);
      }
    }

    spawnBall(p, side, bonusRadius, isClone) {
      if (this.balls.length >= 160) return;
      if (!isClone) this.removePacerBots();
      const box = side === 'A' ? CHAMBER_A : CHAMBER_B;
      const baseR = clamp((isClone ? 28 : 38) + (bonusRadius || 0), 26, 84);
      const x = box.left + baseR + 24 + Math.random() * (box.right - box.left - (baseR + 24) * 2);
      const y = box.top + 38 + (isClone ? Math.random() * 35 : 0);
      const b = {
        playerId: p.id,
        name: p.name,
        side: side,
        x: x, y: y,
        vx: (Math.random() - 0.5) * 380,
        vy: 150 + Math.random() * 150,
        r: baseR,
        targetR: baseR,
        angle: (Math.random() - 0.5) * 0.8,
        omega: (Math.random() - 0.5) * 7,
        squashX: 1.22,
        squashY: 0.78,
        trail: [],
        giftTier: p.giftTier || 0,
        isPacer: false,
        isClone: !!isClone,
        shredded: false
      };
      this.balls.push(b);
      this.addShockwave(x, y, 80, side === 'A' ? TEAM_A : TEAM_B);
      if (!isClone) {
        this.addPopup(x, y + 30, side === 'A' ? 'VOTE A!' : 'VOTE B!', side === 'A' ? TEAM_A_GLOW : TEAM_B_GLOW, 24);
        playSfx('vote', side);
      }
      this.updateChamberLeaders();
    }

    queueForNextRound(p, side) {
      let existing = null;
      for (let i = 0; i < this.nextRoundQueue.length; i++) {
        if (this.nextRoundQueue[i].playerId === p.id) { existing = this.nextRoundQueue[i]; break; }
      }
      if (existing) {
        existing.side = side;
      } else if (this.nextRoundQueue.length < 40) {
        this.nextRoundQueue.push({ playerId: p.id, name: p.name, side: side });
      }
      const fromX = side === 'A' ? 180 : 900;
      this.addLaserBeam(fromX, 1380, 540, 680, side === 'A' ? TEAM_A : TEAM_B, p.name + ' QUEUED [' + side + ']!');
      if (this.phase === 'CNC') {
        this.cncProgress = clamp(this.cncProgress + 0.018, 0, 1);
        this.spawnCNCChips(540 + (Math.random() - 0.5) * 140, 680, 8);
      }
      playSfx('vote', side);
    }

    castVote(p, side, fromQueue) {
      if (this.phase !== 'VOTE') {
        this.queueForNextRound(p, side);
        return;
      }
      let existingBall = null;
      for (let i = 0; i < this.balls.length; i++) {
        if (this.balls[i].playerId === p.id && !this.balls[i].isClone) {
          existingBall = this.balls[i];
          break;
        }
      }
      p.side = side;
      p.roundScore += fromQueue ? 40 : 20;
      if (existingBall) {
        if (existingBall.side !== side) {
          const box = side === 'A' ? CHAMBER_A : CHAMBER_B;
          existingBall.side = side;
          existingBall.x = (box.left + box.right) / 2 + (Math.random() - 0.5) * 110;
          existingBall.y = box.top + 45;
          existingBall.vx = (Math.random() - 0.5) * 320;
          existingBall.vy = 120;
          existingBall.squashX = 1.25;
          existingBall.squashY = 0.75;
          this.addPopup(existingBall.x, existingBall.y, 'SWITCHED TO ' + side + '!', GOLD, 24);
        } else {
          existingBall.targetR = Math.min(82, existingBall.targetR + 4.5);
          existingBall.vy = -650 - Math.random() * 180;
          existingBall.vx += (Math.random() - 0.5) * 380;
          existingBall.omega = (Math.random() - 0.5) * 12;
          existingBall.squashX = 0.76;
          existingBall.squashY = 1.28;
          this.addShockwave(existingBall.x, existingBall.y, 90, side === 'A' ? TEAM_A : TEAM_B);
          this.addPopup(existingBall.x, existingBall.y - 30, 'BOUNCE +SCORE!', GOLD, 22);
        }
        playSfx('vote', side);
        this.updateChamberLeaders();
      } else {
        const tierInfo = GIFT_TIERS[p.giftTier || 0];
        this.spawnBall(p, side, tierInfo.ballBonusR, false);
      }
    }

    accept(e) {
      if (!e) return false;
      const now = performance.now();
      if (e.eventId) {
        if (this.seen.has(e.eventId)) return false;
        this.seen.set(e.eventId, now);
        if (this.seen.size > 8000) this.seen.delete(this.seen.keys().next().value);
      }

      const p = this.ensurePlayer(e);

      if (e.type === 'member') {
        if (this.phase === 'VOTE' && !p.side) {
          const countA = this.balls.filter(b => b.side === 'A' && !b.isPacer).length;
          const countB = this.balls.filter(b => b.side === 'B' && !b.isPacer).length;
          this.castVote(p, countA <= countB ? 'A' : 'B', false);
        }
        return true;
      }

      if (e.type === 'chat') {
        const msg = String(e.text || '').trim().toUpperCase();
        const countA = this.balls.filter(b => b.side === 'A' && !b.isPacer).length;
        const countB = this.balls.filter(b => b.side === 'B' && !b.isPacer).length;
        const defaultSide = p.side || (countA <= countB ? 'A' : 'B');
        if (msg === 'A' || msg === '1' || msg.indexOf('A ') === 0 || msg === this.question.a) {
          this.castVote(p, 'A', false);
        } else if (msg === 'B' || msg === '2' || msg.indexOf('B ') === 0 || msg === this.question.b) {
          this.castVote(p, 'B', false);
        } else {
          this.castVote(p, defaultSide, false);
        }
        return true;
      }

      if (e.type === 'like') {
        const count = clamp(e.count || 1, 1, 200);
        p.roundLikes += count;
        p.roundScore += count * 6;
        if (this.phase === 'VOTE') {
          if (!p.side) {
            const countA = this.balls.filter(b => b.side === 'A' && !b.isPacer).length;
            const countB = this.balls.filter(b => b.side === 'B' && !b.isPacer).length;
            this.castVote(p, countA <= countB ? 'A' : 'B', false);
          }
          for (let i = 0; i < this.balls.length; i++) {
            const b = this.balls[i];
            if (b.playerId === p.id && !b.isClone) {
              const tierBonus = GIFT_TIERS[p.giftTier || 0].ballBonusR;
              b.targetR = clamp(38 + tierBonus + Math.sqrt(p.roundLikes) * 3.5, 38, 86);
              b.vy = -520 - Math.random() * 220;
              b.vx += (Math.random() - 0.5) * 360;
              b.omega = (Math.random() - 0.5) * 14;
              b.squashX = 0.78;
              b.squashY = 1.25;
              this.addShockwave(b.x, b.y, b.r + 45, GOLD);
              this.addPopup(b.x, b.y - b.r, '♥ +' + count * 6 + ' PTS!', GOLD, 24);
            }
          }
          this.updateChamberLeaders();
          playSfx('like', p.side || 'A');
        } else if (this.phase === 'CNC') {
          this.cncProgress = clamp(this.cncProgress + count * 0.006, 0, 1);
          this.addLaserBeam(540 + (Math.random() - 0.5) * 600, 1380, 540, 680, GOLD, p.name + ' ♥ BOOST!');
          playSfx('like', 'A');
        }
        return true;
      }

      if (e.type === 'share' || e.type === 'follow') {
        if (now - p.lastShareAt > 5000) {
          p.lastShareAt = now;
          const countA = this.balls.filter(b => b.side === 'A' && !b.isPacer).length;
          const countB = this.balls.filter(b => b.side === 'B' && !b.isPacer).length;
          const side = p.side || (countA <= countB ? 'A' : 'B');
          p.side = side;
          p.roundScore += 65;
          if (this.phase === 'VOTE') {
            this.spawnBall(p, side, 12, false);
          } else {
            this.queueForNextRound(p, side);
          }
          this.banner = { text: '⚡ ' + p.name + ' DROPPED A SUPER ORB!', color: GOLD, until: now + 2400 };
        }
        return true;
      }

      if (e.type === 'gift' || e.type === 'subscribe') {
        const coins = Math.max(1, e.coins || 1);
        const tierInfo = getGiftTierInfo(coins);
        p.roundGifts += coins;
        p.roundScore += coins * tierInfo.scoreMult;
        p.giftTier = Math.max(p.giftTier || 0, tierInfo.tier);
        this.forgeTier = Math.max(this.forgeTier, tierInfo.tier);
        this.shake = 10 + tierInfo.tier * 5;
        playSfx('gift', p.side || 'A', tierInfo.tier);

        const countA = this.balls.filter(b => b.side === 'A' && !b.isPacer).length;
        const countB = this.balls.filter(b => b.side === 'B' && !b.isPacer).length;
        const side = p.side || (countA <= countB ? 'A' : 'B');
        p.side = side;

        const targetBox = side === 'A' ? CHAMBER_A : CHAMBER_B;
        const targetX = (targetBox.left + targetBox.right) / 2;
        if (this.giftMeteors.length < 8) {
          this.giftMeteors.push({
            playerId: p.id,
            name: p.name,
            tier: tierInfo.tier,
            badge: tierInfo.badge,
            coins: coins,
            fromX: 540, fromY: 90,
            toX: this.phase === 'VOTE' ? targetX : 540,
            toY: this.phase === 'VOTE' ? 660 : 690,
            progress: 0
          });
        }

        if (this.phase === 'VOTE') {
          let mainBall = null;
          for (let i = 0; i < this.balls.length; i++) {
            if (this.balls[i].playerId === p.id && !this.balls[i].isClone) { mainBall = this.balls[i]; break; }
          }
          if (!mainBall) {
            this.spawnBall(p, side, tierInfo.ballBonusR, false);
          } else {
            mainBall.giftTier = p.giftTier;
            mainBall.targetR = clamp(38 + tierInfo.ballBonusR + Math.sqrt(p.roundLikes) * 3, 48, 88);
            mainBall.vy = -740;
            mainBall.squashX = 0.72; mainBall.squashY = 1.34;
            this.addShockwave(mainBall.x, mainBall.y, 175, tierInfo.border);
            this.addPopup(mainBall.x, mainBall.y - 45, tierInfo.badge + '!', tierInfo.glow, 28);
          }
          for (let c = 0; c < tierInfo.clones; c++) {
            this.spawnBall(p, side, Math.max(0, tierInfo.ballBonusR - 14), true);
          }
          if (tierInfo.tier >= 2) {
            for (let i = 0; i < this.balls.length; i++) {
              const b = this.balls[i];
              if (b.side === side) {
                b.vy = -450 - Math.random() * 300;
                b.vx += (Math.random() - 0.5) * 420;
              }
            }
          }
          this.updateChamberLeaders();
        } else {
          this.queueForNextRound(p, side);
          this.spawnCNCChips(540, 680, 24);
        }

        this.banner = {
          text: tierInfo.badge + ' UNLOCKED BY ' + p.name + '!',
          color: tierInfo.glow,
          until: now + 3800
        };
        if (tierInfo.tier >= 2) {
          speakTTS(tierInfo.name + ' unlocked by ' + p.name + '!', false);
        }
        return true;
      }

      return false;
    }

    getCounts() {
      let a = 0, b = 0;
      for (let i = 0; i < this.balls.length; i++) {
        const ball = this.balls[i];
        const tierWeight = (ball.giftTier || 0) * 2;
        const sizeWeight = ball.r > 54 ? 2 : 1;
        const weight = ball.isClone ? 1 : (sizeWeight + tierWeight);
        if (ball.side === 'A') a += weight;
        else b += weight;
      }
      return { a: a, b: b, total: a + b };
    }

    startShredPhase() {
      this.phase = 'SHRED';
      this.timer = SHRED_DURATION;
      this.trapdoorAngle = 0;
      const counts = this.getCounts();
      this.winningSide = counts.a >= counts.b ? 'A' : 'B';
      this.shake = 16;
      playSfx('shred');

      this.players.forEach(p => {
        if (p.side === this.winningSide) p.winStreak = (p.winStreak || 0) + 1;
        else if (p.side) p.winStreak = 0;
      });

      const winners = this.balls
        .filter(b => b.side === this.winningSide && !b.isPacer && !b.isClone)
        .map(b => this.players.get(b.playerId))
        .filter(Boolean);

      if (winners.length > 0) {
        winners.sort((x, y) => y.roundScore - x.roundScore);
        this.mvp = winners[0];
        this.forgeTier = Math.max(this.forgeTier, this.mvp.giftTier || 0);
      } else {
        this.mvp = {
          id: 'mvp_default',
          name: this.winningSide === 'A' ? this.question.a : this.question.b,
          avatar: '',
          side: this.winningSide,
          roundScore: 100,
          winStreak: 1,
          giftTier: this.forgeTier
        };
      }

      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (b.side === this.winningSide) {
          b.vy = -480 - Math.random() * 250;
          b.vx = (Math.random() - 0.5) * 320;
        }
      }
    }

    startCNCPhase() {
      this.phase = 'CNC';
      this.timer = CNC_DURATION;
      this.cncProgress = 0;
      this.forgeSlide = 0;
      this.shake = 10;
      playSfx('vote', this.winningSide);
      if (this.mvp) {
        speakTTS('Team ' + this.winningSide + ' wins! Forging medallion for ' + this.mvp.name + '!', false);
      }
    }

    startShowcasePhase() {
      this.phase = 'SHOWCASE';
      this.timer = SHOW_DURATION;
      this.cncProgress = 1;
      this.shake = 12;
      playSfx('win');
      for (let i = 0; i < 6; i++) {
        this.spawnCNCChips(320 + i * 88, 660, 14);
      }
      if (this.mvp) {
        this.hallOfFame.unshift({
          id: this.mvp.id,
          name: this.mvp.name,
          avatar: this.mvp.avatar,
          side: this.winningSide,
          tier: this.forgeTier,
          streak: this.mvp.winStreak || 1
        });
        if (this.hallOfFame.length > 5) this.hallOfFame.pop();
      }
    }

    spawnCNCChips(x, y, count) {
      if (this.chips.length > 240) return;
      const tierInfo = GIFT_TIERS[this.forgeTier || 0];
      const n = count || 4;
      for (let i = 0; i < n; i++) {
        const isSpark = Math.random() < 0.68;
        this.chips.push({
          x: x + (Math.random() - 0.5) * 16,
          y: y + (Math.random() - 0.5) * 8,
          vx: (Math.random() - 0.5) * 760,
          vy: -220 - Math.random() * 580,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 22,
          life: 1.0,
          isSpark: isSpark,
          color: isSpark ? tierInfo.spark1 : tierInfo.spark2
        });
      }
    }

    tick(dt) {
      this.sawAngle += dt * 18;
      this.shake = Math.max(0, this.shake - dt * 28);

      if (this.phase === 'VOTE') {
        this.timer -= dt;

        if (this.timer < VOTE_DURATION - 2.2 && !this.pacerSpawned && this.balls.length === 0) {
          this.spawnPacerBots();
        }

        const secLeft = Math.ceil(this.timer);
        if (secLeft <= 5 && secLeft >= 1 && secLeft < this.lastSpokenCountdown) {
          this.lastSpokenCountdown = secLeft;
          speakTTS(String(secLeft), true);
        }

        if (this.timer <= 8 && Math.random() < dt * 3.8 && this.balls.length > 0) {
          const b = this.balls[Math.floor(Math.random() * this.balls.length)];
          if (b.y > CHAMBER_A.bottom - 180) {
            b.vy = -390 - Math.random() * 190;
            b.vx += (Math.random() - 0.5) * 240;
            b.squashX = 0.84; b.squashY = 1.18;
          }
        }
        if (this.timer <= 0) this.startShredPhase();
      } else if (this.phase === 'SHRED') {
        this.timer -= dt;
        this.trapdoorAngle = clamp(this.trapdoorAngle + dt * 3.4, 0, 1);
        if (this.timer <= 0) this.startCNCPhase();
      } else if (this.phase === 'CNC') {
        this.forgeSlide = clamp(this.forgeSlide + dt * 3.5, 0, 1);
        if (this.forgeSlide >= 0.85) {
          const speedMult = GIFT_TIERS[this.forgeTier || 0].speedMult;
          this.cncProgress += (dt / CNC_DURATION) * speedMult;
          if (this.cncProgress >= 1) this.startShowcasePhase();
        }
      } else if (this.phase === 'SHOWCASE') {
        this.forgeSlide = 1;
        this.timer -= dt;
        if (this.timer <= 0) this.nextRound();
      }

      const loseSide = this.winningSide === 'A' ? 'B' : 'A';
      const now = performance.now();

      for (let i = this.balls.length - 1; i >= 0; i--) {
        const b = this.balls[i];
        b.r += (b.targetR - b.r) * Math.min(1, dt * 9);
        b.squashX += (1 - b.squashX) * Math.min(1, dt * 14);
        b.squashY += (1 - b.squashY) * Math.min(1, dt * 14);

        if (Math.hypot(b.vx, b.vy) > 260) {
          b.trail.push({ x: b.x, y: b.y, r: b.r * 0.88 });
          if (b.trail.length > 5) b.trail.shift();
        } else if (b.trail.length > 0) {
          b.trail.shift();
        }

        b.vy += 1780 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.angle += b.omega * dt;
        b.vx *= Math.pow(0.993, dt * 60);
        b.vy *= Math.pow(0.995, dt * 60);
        b.omega *= Math.pow(0.98, dt * 60);

        const box = b.side === 'A' ? CHAMBER_A : CHAMBER_B;

        if (b.x < box.left + b.r + 10) {
          b.x = box.left + b.r + 10;
          if (b.vx < -120) { b.squashX = 0.78; b.squashY = 1.24; playSfx('bounce', b.side); }
          b.vx = Math.abs(b.vx) * 0.74;
          b.omega = b.vy * 0.012;
        }
        if (b.x > box.right - b.r - 10) {
          b.x = box.right - b.r - 10;
          if (b.vx > 120) { b.squashX = 0.78; b.squashY = 1.24; playSfx('bounce', b.side); }
          b.vx = -Math.abs(b.vx) * 0.74;
          b.omega = -b.vy * 0.012;
        }

        for (let k = 0; k < this.bumpers.length; k++) {
          const bmp = this.bumpers[k];
          if (bmp.side !== b.side) continue;
          const dx = b.x - bmp.x;
          const dy = b.y - bmp.y;
          const dist = Math.hypot(dx, dy);
          const minD = b.r + bmp.r;
          if (dist < minD && dist > 0.001) {
            const nx = dx / dist;
            const ny = dy / dist;
            b.x = bmp.x + nx * (minD + 1);
            b.y = bmp.y + ny * (minD + 1);
            const speed = Math.max(360, Math.hypot(b.vx, b.vy) * 0.92);
            b.vx = nx * speed + (Math.random() - 0.5) * 90;
            b.vy = ny * speed;
            b.omega = (Math.random() - 0.5) * 14;
            b.squashX = 1.26;
            b.squashY = 0.74;
            bmp.hitAt = now;
            this.addShockwave(bmp.x, bmp.y, bmp.r + 42, bmp.color);
            playSfx('bumper', b.side);
          }
        }

        const floorClosed = this.phase === 'VOTE' || b.side === this.winningSide;
        if (floorClosed) {
          if (b.y > box.bottom - b.r - 10) {
            b.y = box.bottom - b.r - 10;
            if (b.vy > 160) {
              b.squashX = clamp(1 + b.vy / 2200, 1.06, 1.34);
              b.squashY = clamp(1 - b.vy / 2600, 0.68, 0.94);
              if (b.vy > 280) playSfx('bounce', b.side);
            }
            b.vy = -Math.abs(b.vy) * 0.68;
            if (Math.abs(b.vy) < 55) b.vy = 0;
            b.omega = b.vx * 0.018;
          }
        } else {
          if (!b.shredded && b.y >= box.bottom - 5) {
            b.shredded = true;
            this.shake = Math.max(this.shake, 9);
            this.spawnCNCChips(b.x, box.bottom + 10, 14);
            this.addShockwave(b.x, box.bottom + 10, 95, TEAM_A);
            playSfx('cnc', loseSide);
          }
          if (b.y > 1580) {
            this.balls.splice(i, 1);
            continue;
          }
        }
      }

      for (let pass = 0; pass < 4; pass++) {
        for (let i = 0; i < this.balls.length; i++) {
          const b1 = this.balls[i];
          for (let j = i + 1; j < this.balls.length; j++) {
            const b2 = this.balls[j];
            if (b1.side !== b2.side) continue;
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const d2 = dx * dx + dy * dy;
            const minD = b1.r + b2.r + 2;
            if (d2 >= minD * minD) continue;
            const d = Math.sqrt(d2) || 0.01;
            const nx = dx / d;
            const ny = dy / d;
            const overlap = (minD - d) * 0.52;
            b1.x -= nx * overlap; b1.y -= ny * overlap;
            b2.x += nx * overlap; b2.y += ny * overlap;

            const rvx = b2.vx - b1.vx;
            const rvy = b2.vy - b1.vy;
            const velAlongNormal = rvx * nx + rvy * ny;
            if (velAlongNormal < 0) {
              const restitution = pass === 0 ? 0.66 : 0.35;
              const imp = -(1 + restitution) * velAlongNormal * 0.5;
              b1.vx -= nx * imp; b1.vy -= ny * imp;
              b2.vx += nx * imp; b2.vy += ny * imp;

              if (pass === 0 && Math.abs(velAlongNormal) > 210) {
                b1.squashX = 1.15; b1.squashY = 0.86;
                b2.squashX = 1.15; b2.squashY = 0.86;
                b1.omega = (b1.vx - b2.vx) * 0.012;
                b2.omega = -b1.omega;
              }
            }
          }
        }
      }

      for (let i = this.chips.length - 1; i >= 0; i--) {
        const ch = this.chips[i];
        ch.vy += 1750 * dt;
        ch.x += ch.vx * dt;
        ch.y += ch.vy * dt;
        ch.rot += ch.vrot * dt;
        ch.life -= dt * 1.55;
        if (ch.life <= 0) this.chips.splice(i, 1);
      }

      for (let i = this.shockwaves.length - 1; i >= 0; i--) {
        const sw = this.shockwaves[i];
        sw.r = lerp(sw.r, sw.maxR, dt * 10);
        sw.life -= dt * 2.6;
        if (sw.life <= 0) this.shockwaves.splice(i, 1);
      }

      for (let i = this.popups.length - 1; i >= 0; i--) {
        const pp = this.popups[i];
        pp.y -= 65 * dt;
        pp.life -= dt * 1.35;
        if (pp.life <= 0) this.popups.splice(i, 1);
      }

      for (let i = this.laserBeams.length - 1; i >= 0; i--) {
        const lb = this.laserBeams[i];
        lb.life -= dt * 2.4;
        if (lb.life <= 0) this.laserBeams.splice(i, 1);
      }

      for (let i = this.giftMeteors.length - 1; i >= 0; i--) {
        const gm = this.giftMeteors[i];
        gm.progress += dt * 2.2;
        if (gm.progress >= 1) {
          this.addShockwave(gm.toX, gm.toY, 160, GIFT_TIERS[gm.tier].glow);
          this.spawnCNCChips(gm.toX, gm.toY, 18);
          this.giftMeteors.splice(i, 1);
        }
      }
    }
  }

  const canvas = $('arena');
  const ctx = canvas.getContext('2d', { alpha: false });
  let darkPreview = false;
  const game = new TrophyForgeGame();

  function roundPath(x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function gradPanel(x, y, w, h, r, cTop, cBot, borderCol, lineW) {
    roundPath(x, y, w, h, r);
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, cTop);
    g.addColorStop(1, cBot);
    ctx.fillStyle = g;
    ctx.fill();
    if (lineW > 0 && borderCol) {
      ctx.lineWidth = lineW;
      ctx.strokeStyle = borderCol;
      ctx.stroke();
    }
  }

  function drawText(str, x, y, size, color, align, maxW, outlineCol) {
    const col = color || WHITE;
    const al = align || 'center';
    const mw = maxW || 950;
    ctx.font = '900 ' + size + 'px "Segoe UI", "Trebuchet MS", Arial, sans-serif';
    ctx.textAlign = al;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(6, Math.round(size * 0.22));
    ctx.strokeStyle = outlineCol || OUTLINE;
    let text = String(str);
    while (text.length > 1 && ctx.measureText(text).width > mw) text = text.slice(0, -1);
    ctx.strokeText(text, x, y);
    ctx.fillStyle = col;
    ctx.fillText(text, x, y);
  }

  function drawPlasmaSaw(cx, cy, r, angle, accentCol) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.beginPath();
    const teeth = 16;
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i * Math.PI) / teeth;
      const rad = i % 2 === 0 ? r : r * 0.68;
      if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.45, accentCol);
    g.addColorStop(1, '#26334d');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.26, 0, Math.PI * 2);
    ctx.fillStyle = OUTLINE;
    ctx.fill();
    ctx.restore();
  }

  function drawBumperPeg(bmp, now) {
    const age = now - bmp.hitAt;
    const pulse = age < 220 ? (1 + (1 - age / 220) * 0.35) : 1;
    const r = bmp.r * pulse;

    ctx.save();
    ctx.translate(bmp.x, bmp.y);
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
    ctx.fillStyle = OUTLINE;
    ctx.fill();

    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.25, 2, 0, 0, r);
    g.addColorStop(0, WHITE);
    g.addColorStop(0.5, age < 220 ? GOLD_HOT : bmp.color);
    g.addColorStop(1, '#121c38');
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.52, 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = WHITE;
    ctx.stroke();
    ctx.restore();
  }

  function drawVoterBall(b, now) {
    const p = game.players.get(b.playerId) || { id: b.playerId, name: b.name, side: b.side, winStreak: 0, giftTier: 0 };
    const img = getPlayerImage(p);
    const gTier = b.giftTier || p.giftTier || 0;
    const tierInfo = GIFT_TIERS[gTier];

        const hy = 203;
        const img = getPlayerImage(h);
        const hTier = GIFT_TIERS[h.tier || 0];
        ctx.save();
        ctx.beginPath(); ctx.arc(hx, hy - 8, 28, 0, Math.PI * 2);
        ctx.fillStyle = OUTLINE; ctx.fill();
        ctx.clip();
        ctx.drawImage(img, hx - 28, hy - 36, 56, 56);
        ctx.restore();
        ctx.beginPath(); ctx.arc(hx, hy - 8, 28, 0, Math.PI * 2);
        ctx.lineWidth = 4; ctx.strokeStyle = hTier.border; ctx.stroke();
        const stTxt = (h.streak && h.streak >= 2) ? (' 🔥' + h.streak) : '';
        drawText(h.name + stTxt, hx, hy + 31, 15, WHITE, 'center', 135);
      }
    }

    const counts = game.getCounts();
    const pctA = counts.total ? Math.round((counts.a / counts.total) * 100) : 50;
    const pctB = counts.total ? 100 - pctA : 50;
    drawTugOfWarBar(counts, pctA, pctB, now);

    drawChamber('A', pctA, now);
    drawChamber('B', pctB, now);
    drawCenterElectricDivider(now);

    for (let i = 0; i < game.bumpers.length; i++) {
      drawBumperPeg(game.bumpers[i], now);
    }

    for (let i = 0; i < game.shockwaves.length; i++) {
      const sw = game.shockwaves[i];
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(2, 7 * sw.life);
      ctx.strokeStyle = sw.color;
      ctx.stroke();
    }

    for (let i = 0; i < game.balls.length; i++) {
      drawVoterBall(game.balls[i], now);
    }

    drawCNCForgeModal(now);

    for (let i = 0; i < game.laserBeams.length; i++) {
      const lb = game.laserBeams[i];
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(lb.fromX, lb.fromY);
      ctx.lineTo(lb.toX, lb.toY);
      ctx.lineWidth = 10 * lb.life;
      ctx.strokeStyle = lb.color;
      ctx.stroke();
      ctx.lineWidth = 4 * lb.life;
      ctx.strokeStyle = WHITE;
      ctx.stroke();
      drawText(lb.label, lb.fromX, lb.fromY - 25, 22, lb.color, 'center', 300);
      ctx.restore();
    }

    // Orbital Gift Meteors streaking into the chambers
    for (let i = 0; i < game.giftMeteors.length; i++) {
      const gm = game.giftMeteors[i];
      const gt = GIFT_TIERS[gm.tier || 1];
      const u = clamp(gm.progress, 0, 1);
      const mx = lerp(gm.fromX, gm.toX, u);
      const my = lerp(gm.fromY, gm.toY, u * u);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(lerp(gm.fromX, mx, 0.45), lerp(gm.fromY, my, 0.45));
      ctx.lineTo(mx, my);
      ctx.lineWidth = 16;
      ctx.strokeStyle = gt.border;
      ctx.stroke();
      ctx.lineWidth = 6;
      ctx.strokeStyle = WHITE;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mx, my, 32, 0, Math.PI * 2);
      ctx.fillStyle = gt.glow;
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = OUTLINE;
      ctx.stroke();
      drawText( gm.badge + ' · ' + gm.name, mx, my - 46, 24, gt.glow, 'center', 340);
      ctx.restore();
    }

    for (let i = 0; i < game.chips.length; i++) {
      const ch = game.chips[i];
      ctx.save();
      ctx.translate(ch.x, ch.y);
      ctx.rotate(ch.rot);
      if (ch.isSpark) {
        roundPath(-5, -5, 10, 10, 5);
        ctx.fillStyle = ch.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = OUTLINE;
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 1.4);
        ctx.lineWidth = 6;
        ctx.strokeStyle = OUTLINE;
        ctx.stroke();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = ch.color;
        ctx.stroke();
      }
      ctx.restore();
    }

    for (let i = 0; i < game.popups.length; i++) {
      const pp = game.popups[i];
      drawText(pp.text, pp.x, pp.y, pp.size, pp.color, 'center', 360);
    }

    if (game.banner && now < game.banner.until) {
      gradPanel(110, 1478, 860, 62, 18, '#1d2d5c', '#0c142b', game.banner.color, 5);
      drawText(game.banner.text, 540, 1509, 28, game.banner.color, 'center', 820);
    }

    ctx.restore();
  }

  const urlInput = $('url');
  const statusEl = $('status');
  let mode = 'live', ws = null, connected = false, retry = 0, attempt = 0, closed = false;
  let packets = 0, accepted = 0, invalid = 0;

  function connect() {
    clearTimeout(retry);
    try {
      if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); }
    } catch (e) {}
    connected = false;
    let target;
    try {
      target = new URL(urlInput.value);
      if (target.protocol !== 'ws:' && target.protocol !== 'wss:') return;
    } catch (e) { return; }

    try {
      ws = new WebSocket(target.href);
      const current = ws;
      const handshake = setTimeout(() => {
        try { if (current.readyState === WebSocket.CONNECTING) current.close(); } catch (e) {}
      }, 12000);
      ws.onopen = () => { clearTimeout(handshake); connected = true; attempt = 0; };
      ws.onmessage = e => {
        if (typeof e.data !== 'string' || e.data.length > 200000) { invalid++; return; }
        try {
          packets++;
          const evt = packet(JSON.parse(e.data));
          if (!evt) return;
          if (evt.type === 'streamend') { game.nextRound(); return; }
          if (mode === 'live' && game.accept(evt)) accepted++;
        } catch (err) { invalid++; }
      };
      ws.onerror = () => {};
      ws.onclose = () => {
        clearTimeout(handshake);
        connected = false;
        if (!closed) retry = setTimeout(connect, Math.min(30000, 1500 * Math.pow(2, Math.min(attempt++, 5))));
      };
    } catch (e) {
      if (!closed) retry = setTimeout(connect, 30000);
    }
  }

  let lastTime = performance.now(), acc = 0, fpsCount = 0, fps = 60, fpsAt = lastTime;
  const STEP = 1 / 60;

  function loop(t) {
    try {
      const dt = clamp((t - lastTime) / 1000, 0, 0.1);
      lastTime = t;
      acc += dt;
      let steps = 0;
      while (acc >= STEP && steps++ < 4) {
        game.tick(STEP);
        acc -= STEP;
      }
      if (steps >= 4) acc = 0;
      render(t);
      fpsCount++;
      if (t - fpsAt >= 1000) {
        fps = Math.round((fpsCount * 1000) / (t - fpsAt));
        fpsAt = t;
        fpsCount = 0;
        if (panelEl.style.display === 'block') {
          statusEl.textContent = (connected ? 'SOCKET OPEN' : 'SOCKET OFF') + ' · Mode: ' + mode.toUpperCase() + ' · Phase: ' + game.phase + ' · Tier: T' + game.forgeTier + ' · Balls: ' + game.balls.length + ' · Queue: ' + game.nextRoundQueue.length + ' · ' + fps + ' FPS';
        }
      }
    } catch (err) {
      if (errBox) {
        errBox.style.display = 'block';
        errBox.textContent = 'LOOP ERR: ' + (err.message || err);
      }
    }
    requestAnimationFrame(loop);
  }

  let testSeq = 1;
  const TEST_NAMES = ['Alex', 'Mia', 'Lucas', 'Emma', 'Noah', 'Chloe', 'Leo', 'Zoe', 'Max', 'Lily', 'Sam', 'Ruby'];

  function spawnTestVoter(side) {
    const id = 'tester_' + (testSeq++);
    const name = TEST_NAMES[testSeq % TEST_NAMES.length] + '_' + (testSeq % 99);
    game.accept({ type: 'chat', id: id, name: name, text: side, eventId: 'test:' + performance.now() + ':' + Math.random() });
  }

  function triggerTestGift(coins) {
    const humanList = Array.from(game.players.values());
    const p = humanList[humanList.length - 1] || { id: 'vip_you', name: 'VIP_HERO' };
    game.accept({ type: 'gift', id: p.id, name: p.name, coins: coins, eventId: 'tgift:' + performance.now() + ':' + Math.random() });
  }

  $('toggle').onclick = () => { panelEl.style.display = 'none'; };
  $('dark').onclick = () => { darkPreview = !darkPreview; };
  $('sfx').onclick = toggleSound;
  $('ttsBtn').onclick = () => {
    ttsEnabled = !ttsEnabled;
    updateSoundUI();
    if (ttsEnabled) speakTTS('Voice announcer enabled!', true);
  };
  $('audioTest').onclick = testSound;
  $('volume').oninput = e => setSoundLevel(Number(e.target.value) / 100);
  $('connect').onclick = connect;

  $('test').onclick = () => { mode = 'test'; spawnTestVoter('A'); spawnTestVoter('B'); };
  $('live').onclick = () => { mode = 'live'; game.nextRound(); };
  $('voteA').onclick = () => spawnTestVoter('A');
  $('voteB').onclick = () => spawnTestVoter('B');
  $('heart').onclick = () => {
    const list = Array.from(game.players.values());
    const p = list[list.length - 1] || { id: 'you', name: 'YOU' };
    game.accept({ type: 'like', id: p.id, name: p.name, count: 15 });
  };
  $('gift1').onclick = () => triggerTestGift(1);
  $('gift2').onclick = () => triggerTestGift(25);
  $('gift3').onclick = () => triggerTestGift(150);
  $('gift4').onclick = () => triggerTestGift(600);

  $('crowd').onclick = () => {
    for (let i = 0; i < 24; i++) spawnTestVoter(i % 2 === 0 ? 'A' : 'B');
  };
  $('skipPhase').onclick = () => {
    if (game.phase === 'VOTE') game.startShredPhase();
    else if (game.phase === 'SHRED') game.startCNCPhase();
    else if (game.phase === 'CNC') game.startShowcasePhase();
    else game.nextRound();
  };

  ['click', 'pointerdown', 'keydown', 'mousemove', 'touchstart'].forEach(evtName => {
    window.addEventListener(evtName, () => {
      if (sound && (!audioCtx || audioCtx.state !== 'running')) unlockAudio(true);
    }, { passive: true });
  });

  window.addEventListener('dblclick', () => togglePanel());

  window.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k = String(e.key || '').toLowerCase();
    if (k === 'h') togglePanel();
    else if (k === 'a') $('voteA').click();
    else if (k === 'b') $('voteB').click();
    else if (k === ' ') { e.preventDefault(); $('heart').click(); }
    else if (k === '1') $('gift1').click();
    else if (k === '2') $('gift2').click();
    else if (k === '3') $('gift3').click();
    else if (k === 'g') $('gift4').click();
    else if (k === 'n') $('skipPhase').click();
  });

  window.addEventListener('beforeunload', () => { closed = true; clearTimeout(retry); try { if (ws) ws.close(); } catch (e) {} });

  render(performance.now());
  unlockAudio(false);
  updateSoundUI();
  connect();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
