<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxinko Trophy Forge 4.0</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #00ff00; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select: none;
  }
  #game-container {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: 56.25vh;
    max-width: 100vw;
    height: 100vh;
    max-height: 177.78vw;
  }
  #panel {
    position: fixed; z-index: 9999; top: 10px; left: 10px;
    max-width: 880px; width: 94vw; max-height: 92vh; overflow: auto;
    padding: 18px 22px; background: #0f1423; color: #fff;
    border: 2px solid #38bdf8; border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.92);
    display: none;
  }
  button, input {
    padding: 8px 14px; margin: 3px; border-radius: 10px;
    background: #1e293b; color: #f8fafc; border: 2px solid #38bdf8;
    font: 700 13px "Segoe UI", system-ui, sans-serif;
    cursor: pointer; transition: transform 0.12s, background 0.15s;
  }
  button:hover { background: #38bdf8; color: #090d16; transform: translateY(-1px); }
  .btn-gold { border-color: #fbbf24; background: #3b2a08; color: #fde68a; }
  .btn-gold:hover { background: #fbbf24; color: #1a1100; }
  .btn-diamond { border-color: #c084fc; background: #2d1447; color: #f3e8ff; }
  .btn-diamond:hover { background: #c084fc; color: #120421; }
  input { width: 270px; max-width: 68vw; cursor: text; }
  #volume { width: 150px; vertical-align: middle; padding: 0; border: 0; }
  #audioStatus { max-width: 720px; font-size: 13px; color: #7dd3fc; margin: 5px 0; }
  #errBox {
    position: fixed; bottom: 8px; left: 8px; z-index: 9999;
    background: #b00020; color: #fff; padding: 6px 12px; border-radius: 6px;
    font: 700 13px monospace; display: none;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="arena" width="1080" height="1920"></canvas>
</div>

<div id="errBox"></div>

<section id="panel">
  <b>GALAXINKO: TROPHY FORGE 4.0 — CLEAN VIRAL EDITION (Press H or Double-Click)</b>
  <p>
    <button id="toggle" type="button">Hide · H</button>
    <button id="dark" type="button">Chroma / Dark Preview</button>
    <button id="sfx" type="button">SOUND ON</button>
    <button id="ttsBtn" type="button">VOICE TTS: ON</button>
    <button id="audioTest" type="button">TEST AUDIO + VOICE</button>
  </p>
  <p>
    <label for="volume">SOUND VOLUME</label>
    <input id="volume" type="range" min="0" max="100" step="5" value="85">
    <output id="volumeValue" for="volume">85%</output>
  </p>
  <p id="audioStatus" role="status">Soft ASMR Sound & Natural Voice TTS enabled by default.</p>
  <p>
    <button id="test" type="button">START TEST MODE</button>
    <button id="live" type="button">RETURN TO LIVE</button>
    <button id="voteA" type="button">VOTE A · [A]</button>
    <button id="voteB" type="button">VOTE B · [B]</button>

    <button id="crowd" type="button">SPAWN 30 VOTERS</button>
    <button id="skipPhase" type="button">NEXT PHASE · [N]</button>

  <p>
    <b>GIFT SCALING TEST:</b>
    <button id="gift1" class="btn-gold" type="button">T1 ROSE (1c) · [1]</button>
    <button id="gift2" class="btn-gold" type="button">T2 GOLD (25c) · [2]</button>
    <button id="gift3" class="btn-diamond" type="button">T3 DIAMOND (150c) · [3]</button>
    <button id="gift4" class="btn-diamond" type="button">T4 SUPERNOVA (600c) · [G]</button>
  </p>
  <p>
    <input id="url" aria-label="TikFinity URL" value="ws://localhost:21213/">
    <button id="connect" type="button">Connect</button>
  </p>
  <p id="status"></p>

    { a: 'SAMURAI', ea: '🥷', b: 'VIKING', eb: '🪓' }
  ];

  function createFallbackAvatar(seedStr, side) {
    const cnv = document.createElement('canvas');
    cnv.width = cnv.height = 128;
    const g = cnv.getContext('2d');
    const h = hash(seedStr);
    const palettes = [
      ['#ff2a5f', '#be123c'],
      ['#00d2ff', '#0284c7'],
      ['#8b5cf6', '#4c1d95'],
      ['#f59e0b', '#b45309'],
      ['#ec4899', '#831843']
    ];
    const pal = palettes[h % palettes.length];
    const bgGrad = g.createLinearGradient(0, 0, 128, 128);
    bgGrad.addColorStop(0, side === 'A' ? '#ff2a5f' : pal[0]);
    bgGrad.addColorStop(1, side === 'B' ? '#0284c7' : pal[1]);
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, 128, 128);

    // Subtle modern silhouette + initial
    g.fillStyle = 'rgba(255,255,255,0.16)';
    g.beginPath(); g.arc(64, 48, 24, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(64, 122, 42, Math.PI, Math.PI * 2); g.fill();

    const letter = String(seedStr || 'P').replace(/^starter_\d+$/, 'S').charAt(0).toUpperCase();
    g.font = '900 54px "Segoe UI", sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#ffffff';
    g.fillText(letter, 64, 66);
    return cnv;
  }

  function avatarUrl(d) {
    const u = d.user || d;
    const owners = [u, d, u && u.userDetails, d && d.userDetails];
    const keys = ['profilePictureUrl', 'profilePictureUrls', 'avatarThumb', 'avatarMedium', 'avatarLarger', 'avatarUrl', 'avatar'];
    for (let o = 0; o < owners.length; o++) {
      const owner = owners[o];
      if (!owner) continue;
      for (let k = 0; k < keys.length; k++) {
        const raw = owner[keys[k]];
        const values = typeof raw === 'string' ? [raw] : Array.isArray(raw) ? raw : (raw && (raw.urlList || raw.url_list || [raw.url]));
        if (!values) continue;
        for (let i = 0; i < values.length; i++) {
          const val = values[i];
          if (typeof val === 'string' && val.length < 4096) {
            try {
              const parsed = new URL(val);
              if (parsed.protocol === 'https:' && !parsed.username && !parsed.password) return parsed.href;
            } catch (e) {}
          }
        }
      }
    }
    return '';
  }

  function packet(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const type = String(raw.event || raw.type || '').toLowerCase();
    if (type === 'streamend') return { type: 'streamend' };
    const d = raw.data;
    if (!d || typeof d !== 'object' || ['member', 'roomuser', 'chat', 'like', 'gift', 'share', 'follow', 'subscribe'].indexOf(type) === -1) return null;
    const u = d.user || d;
    const g = d.giftDetails || d.extendedGiftInfo || d.gift || {};
    let id = u.uniqueId !== undefined ? u.uniqueId : (u.unique_id !== undefined ? u.unique_id : (d.uniqueId !== undefined ? d.uniqueId : (d.unique_id !== undefined ? d.unique_id : (u.userId !== undefined ? u.userId : (u.id !== undefined ? u.id : d.userId)))));
    if (id == null || !String(id).length || String(id).length > 180) return null;
    const repeat = Math.floor(clamp(num(d.repeatCount, 1), 1, 1000000));
    const gType = num(d.giftType !== undefined ? d.giftType : (g.giftType !== undefined ? g.giftType : g.type));
    if (type === 'gift' && gType === 1 && d.repeatEnd !== true && d.repeatEnd !== 1 && d.repeatEnd !== 'true') return null;
    const msgId = d.msgId !== undefined ? d.msgId : (d.common && d.common.msgId);
    const unitCoins = d.diamondCount !== undefined ? d.diamondCount : (g.diamondCount !== undefined ? g.diamondCount : g.diamond_count);
    const coins = unitCoins == null ? num(d.coins !== undefined ? d.coins : g.coins) : num(unitCoins) * repeat;
    const giftName = clean(d.giftName || g.giftName || g.name || 'Gift');
    return {
      type: type === 'roomuser' ? 'member' : type,
      id: String(id),
      userId: String(u.userId || u.id || d.userId || ''),
      name: clean(u.nickname || d.nickname || id),
      avatar: avatarUrl(d),
      text: String(d.comment !== undefined ? d.comment : (d.text || '')).slice(0, 160),
      count: Math.floor(clamp(num(d.likeCount, 1), 1, 10000)),
      repeat: repeat,
      coins: clamp(coins, 0, 1e9),
      giftName: giftName,
      eventId: msgId == null ? '' : type + ':' + msgId + (type === 'gift' ? ':' + repeat : '')
    };
  }

  const SFX_CHORD = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
  let sound = true, ttsEnabled = true, audioCtx = null, soundEvents = 0, soundLevel = 0.85;
  try {
    const saved = localStorage.getItem('galaxinko-sfx-volume');
    if (saved !== null && Number.isFinite(Number(saved))) soundLevel = clamp(Number(saved), 0, 1);
  } catch (e) {}

  let lastSpokenAt = 0;
  let cachedVoice = null;

  function pickHumanVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || !voices.length) return null;
    const preferred = [
      /Natural/i, /Online/i, /Aria/i, /Guy/i, /Jenny/i, /Google US English/i, /Samantha/i, /Siri/i
    ];
    const enVoices = voices.filter(v => /^en[-_](US|GB|CA|AU)/i.test(v.lang) || /^en/i.test(v.lang));
    for (let i = 0; i < preferred.length; i++) {
      const match = enVoices.find(v => preferred[i].test(v.name));
      if (match) return match;
    }
    return enVoices[0] || voices[0];
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickHumanVoice(); };
  }

  function formatSpokenWord(w) {
    return String(w || '').toLowerCase()
      .replace('gta 6', 'G T A six')
      .replace('ps5', 'P S five')
      .replace('100k', 'one hundred K')
      .replace('1m', 'one million');
  }

  function speakTTS(text, priority) {
    if (!ttsEnabled || !sound || soundLevel === 0) return;
    if (!('speechSynthesis' in window)) return;
    const now = performance.now();
    if (!priority && now - lastSpokenAt < 3200) return;
    try {
      if (priority) window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(String(text));
      if (!cachedVoice) cachedVoice = pickHumanVoice();
      if (cachedVoice) utter.voice = cachedVoice;
      utter.lang = 'en-US';
      utter.rate = 0.98 + (Math.random() - 0.5) * 0.04;
      utter.pitch = 0.98 + (Math.random() - 0.5) * 0.04;
      utter.volume = clamp(soundLevel, 0, 1);
      window.speechSynthesis.speak(utter);
      lastSpokenAt = now;
    } catch (e) {}
  }

  const sfxMix = {
    input: null, master: null, voices: new Set(), limit: 14,
    resumeAt: -Infinity, error: '', uiKey: '', last: new Map()
  };

  function updateSoundUI() {
    const available = !!(window.AudioContext || window.webkitAudioContext);
    const running = audioCtx && audioCtx.state === 'running';
    const muted = soundLevel === 0;
    const key = [available, sound, ttsEnabled, audioCtx && audioCtx.state, soundLevel, sfxMix.error].join('|');
    if (key === sfxMix.uiKey) return;
    sfxMix.uiKey = key;
    const button = $('sfx');
    if (button) button.textContent = !available ? 'AUDIO UNAVAILABLE' : !sound ? 'SOUND OFF' : muted ? 'SOUND MUTED' : 'SOUND ON';
    const ttsBtn = $('ttsBtn');
    if (ttsBtn) ttsBtn.textContent = ttsEnabled ? 'VOICE TTS: ON' : 'VOICE TTS: OFF';
    const volume = $('volume');
    if (volume) volume.value = String(Math.round(soundLevel * 100));
    const value = $('volumeValue');
    if (value) value.textContent = Math.round(soundLevel * 100) + '%';
    const info = $('audioStatus');
    if (info) info.textContent = !available ? 'Web Audio unavailable.' : !sound ? 'Sound is off.' : running ? 'Soft ASMR Audio & Natural Voice active.' : 'Sound & TTS ready (auto-starts on click/OBS).';
  }

  function applySoundLevel() {
    if (sfxMix.master && audioCtx) {
      const at = audioCtx.currentTime;
      sfxMix.master.gain.cancelScheduledValues(at);
      sfxMix.master.gain.setTargetAtTime(sound && soundLevel > 0 ? soundLevel : 0.0001, at, 0.02);
    }
    updateSoundUI();
  }

  function setSoundLevel(val) {
    soundLevel = clamp(num(val, 0.85), 0, 1);
    try { localStorage.setItem('galaxinko-sfx-volume', String(soundLevel)); } catch (e) {}
    applySoundLevel();
  }

  function unlockAudio(gesture) {
    if (!sound) { updateSoundUI(); return Promise.resolve(false); }
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) { updateSoundUI(); return Promise.resolve(false); }
    try {
      if (!audioCtx) {
        audioCtx = new Audio();
        const filter = audioCtx.createBiquadFilter();
        const compressor = audioCtx.createDynamicsCompressor();
        const master = audioCtx.createGain();
        // Warm lowpass filter removes harsh arcade/slot-machine highs
        filter.type = 'lowpass'; filter.frequency.value = 1850; filter.Q.value = 0.5;
        compressor.threshold.value = -20; compressor.knee.value = 14; compressor.ratio.value = 4;
        compressor.attack.value = 0.008; compressor.release.value = 0.18;
        master.gain.value = soundLevel;
        filter.connect(compressor); compressor.connect(master); master.connect(audioCtx.destination);
        sfxMix.input = filter; sfxMix.master = master;
        audioCtx.onstatechange = updateSoundUI;
      }
      if (audioCtx.state === 'running') { sfxMix.error = ''; updateSoundUI(); return Promise.resolve(true); }
      const t = performance.now();
      if (audioCtx.state === 'closed' || (!gesture && t - sfxMix.resumeAt < 350)) { updateSoundUI(); return Promise.resolve(false); }
      sfxMix.resumeAt = t;
      updateSoundUI();
      return Promise.resolve(audioCtx.resume()).then(() => {
        sfxMix.error = ''; updateSoundUI(); return audioCtx.state === 'running';
      }, () => { updateSoundUI(); return false; });
    } catch (e) {
      updateSoundUI(); return Promise.resolve(false);
    }
  }

  function sfxTone(freq, duration, volume, panVal, wave, delay, endRatio) {
    if (!sound) return false;
    if (!audioCtx || audioCtx.state !== 'running') unlockAudio(false);
    if (!audioCtx || audioCtx.state !== 'running' || !sfxMix.input || sfxMix.voices.size >= sfxMix.limit) return false;
    try {
      const at = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      const voice = { osc: osc, gain: gain };
      osc.type = wave || 'sine';
      osc.frequency.setValueAtTime(freq, at);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * (endRatio || 1)), at + duration);
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(volume, at + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
      osc.connect(gain);
      if (pan) { pan.pan.value = clamp(panVal || 0, -1, 1); gain.connect(pan); pan.connect(sfxMix.input); }
      else gain.connect(sfxMix.input);
      sfxMix.voices.add(voice);
      osc.onended = () => { sfxMix.voices.delete(voice); osc.disconnect(); gain.disconnect(); if (pan) pan.disconnect(); };
      osc.start(at); osc.stop(at + duration + 0.02);
      soundEvents++;
      return true;
    } catch (e) { return false; }
  }

  // Soft physical marimba/wood/water-drop ASMR sounds (no casino slot bleeps)
  function playSfx(kind, side, tier) {
    const t = performance.now();
    const cd = { vote: 65, bounce: 75, bumper: 65, like: 85, crown: 500, shred: 600, cnc: 80, gift: 320, win: 700 }[kind] || 75;
    const prev = sfxMix.last.has(kind) ? sfxMix.last.get(kind) : -Infinity;
    if (t - prev < cd) return;
    sfxMix.last.set(kind, t);
    const pan = side === 'A' ? -0.25 : side === 'B' ? 0.25 : 0;

    if (kind === 'vote') {
      // Soft water-drop pop
      const base = side === 'A' ? 240 : 290;
      sfxTone(base, 0.09, 0.055, pan, 'sine', 0, 1.65);
    } else if (kind === 'bumper') {
      // Warm wooden marimba tap
      const note = SFX_CHORD[Math.floor(Math.random() * SFX_CHORD.length)];
      sfxTone(note, 0.085, 0.045, pan, 'sine', 0, 0.96);
    } else if (kind === 'bounce') {
      sfxTone(135 + Math.random() * 45, 0.055, 0.02, pan, 'sine', 0, 0.78);
    } else if (kind === 'like') {
      sfxTone(310 + Math.random() * 90, 0.08, 0.038, pan, 'sine', 0, 1.35);
    } else if (kind === 'crown') {
      [0, 2, 4].forEach((n, i) => sfxTone(SFX_CHORD[n], 0.18, 0.045, pan, 'sine', i * 0.06, 1.02));
    } else if (kind === 'shred') {
      // Deep hydraulic press thud
      sfxTone(95, 0.55, 0.09, pan, 'triangle', 0, 0.42);
      sfxTone(62, 0.65, 0.08, 0, 'sine', 0.05, 0.5);
    } else if (kind === 'cnc') {
      // Soft muted carving hum
      const f = 175 + (Math.random() * 45);
      sfxTone(f, 0.06, 0.018, (Math.random() - 0.5) * 0.3, 'triangle', 0, 0.95);
    } else if (kind === 'gift') {
      const gt = tier || 1;
      const notes = gt >= 3 ? [0, 2, 3, 5] : [0, 2, 4];
      notes.forEach((n, i) => sfxTone(SFX_CHORD[n], 0.32, 0.065, 0, 'sine', i * 0.075, 1.01));
    } else if (kind === 'win') {
      [0, 2, 3, 5].forEach((n, i) => sfxTone(SFX_CHORD[n], 0.38, 0.06, 0, 'sine', i * 0.09, 1.0));
    }
  }

  function testSound() {
    sound = true;
    if (soundLevel === 0) setSoundLevel(0.85);
    applySoundLevel();
    return unlockAudio(true).then(ready => {
      if (!ready) return false;
      playSfx('win');
      speakTTS('Hey guys, welcome back! Let us see who takes the crown this round.', true);
      return true;
    });
  }

  function toggleSound() {
    if (!sound || soundLevel === 0) {
      sound = true; applySoundLevel(); return testSound();
    }
    sound = false; applySoundLevel(); return Promise.resolve(false);
  }

  const pics = new Map();
  const engravedCache = new Map();
  let portraitJobs = 0;

  function requestPic(url) {
    if (!url || pics.has(url) || pics.size >= MAX) return;
    pics.set(url, { state: 'waiting' });
    pumpPics();
  }

  function pumpPics() {
    pics.forEach((entry, u) => {
      if (portraitJobs >= 4 || entry.state !== 'waiting') return;
      entry.state = 'loading';
      portraitJobs++;
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.referrerPolicy = 'no-referrer';
      let done = false;
      const finish = ok => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        img.onload = img.onerror = null;
        if (ok && img.naturalWidth) {
          const thumb = document.createElement('canvas');
          thumb.width = thumb.height = 128;
          const g = thumb.getContext('2d');
          const side = Math.min(img.naturalWidth, img.naturalHeight);
          g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 128, 128);
          entry.img = thumb;
          entry.state = 'ready';
        } else {
          entry.state = 'failed';
        }
        portraitJobs--;
        pumpPics();
      };
      const timer = setTimeout(() => finish(false), 7500);
      img.onload = () => finish(true);
      img.onerror = () => finish(false);
      img.src = u;
    });
  }

  function getPlayerImage(p) {
    const picEntry = p.avatar ? pics.get(p.avatar) : null;
    if (picEntry && picEntry.state === 'ready') return picEntry.img;
    if (!p.fallbackCanvas) {
      p.fallbackCanvas = createFallbackAvatar(p.name || p.id, p.side || 'A');
    }
    return p.fallbackCanvas;
  }

  function buildEngravedPortrait(p, forgeTier) {
    const picEntry = p.avatar ? pics.get(p.avatar) : null;
    const cacheKey = p.id + ':t' + forgeTier + ':' + (picEntry ? picEntry.state : 'fb');
    if (engravedCache.has(cacheKey)) return engravedCache.get(cacheKey);

    const size = 440;
    const cnv = document.createElement('canvas');
    cnv.width = cnv.height = size;
    const g = cnv.getContext('2d');
    const srcImg = getPlayerImage(p);

    g.drawImage(srcImg, 0, 0, size, size);
    try {
      const imgData = g.getImageData(0, 0, size, size);
      const d = imgData.data;
      const copy = new Uint8ClampedArray(d);
      const cx = size / 2, cy = size / 2;
      for (let y = 1; y < size - 1; y++) {
        for (let x = 1; x < size - 1; x++) {
          const i = (y * size + x) * 4;
          const iPrev = ((y - 1) * size + (x - 1)) * 4;
          const dist = Math.hypot(x - cx, y - cy);
          const ringGroove = 0.92 + 0.08 * Math.sin(dist * 0.8);
          const lum = (0.299 * copy[i] + 0.587 * copy[i + 1] + 0.114 * copy[i + 2]) / 255;
          const lumPrev = (0.299 * copy[iPrev] + 0.587 * copy[iPrev + 1] + 0.114 * copy[iPrev + 2]) / 255;
          const emboss = clamp((lum - lumPrev) * 2.2, -0.35, 0.45);
          const val = clamp((Math.pow(lum, 0.88) * 0.84 + 0.16 + emboss) * ringGroove, 0, 1);

          if (forgeTier >= 4) {
            const wave = 0.5 + 0.5 * Math.sin((x + y) * 0.035);
            d[i]     = Math.round(75 + val * 180);
            d[i + 1] = Math.round(30 + val * (135 + wave * 50));
            d[i + 2] = Math.round(55 + val * (110 + (1 - wave) * 90));
          } else if (forgeTier === 3) {
            d[i]     = Math.round(45 + val * 175);
            d[i + 1] = Math.round(55 + val * 195);
            d[i + 2] = Math.round(95 + val * 160);
          } else if (forgeTier === 2) {
            d[i]     = Math.round(70 + val * 185);
            d[i + 1] = Math.round(45 + val * 165);
            d[i + 2] = Math.round(10 + val * 75);
          } else if (forgeTier === 1) {
            d[i]     = Math.round(68 + val * 182);
            d[i + 1] = Math.round(34 + val * 135);
            d[i + 2] = Math.round(22 + val * 95);
          } else {
            d[i]     = Math.round(25 + val * 160);
            d[i + 1] = Math.round(50 + val * 195);
            d[i + 2] = Math.round(75 + val * 180);
          }
        }
      }
      g.putImageData(imgData, 0, 0);
    } catch (e) {}

    if (engravedCache.size > 24) engravedCache.delete(engravedCache.keys().next().value);
    engravedCache.set(cacheKey, cnv);
    return cnv;
  }

  const VOTE_DURATION = 35.0;
  const SHRED_DURATION = 3.8;
  const CNC_DURATION = 8.5;
  const SHOW_DURATION = 4.2;

  class TrophyForgeGame {
    constructor() {
      this.players = new Map();
      this.aliases = new Map();
      this.seen = new Map();
      this.balls = [];
      this.chips = [];
      this.shockwaves = [];
      this.popups = [];
      this.laserBeams = [];
      this.giftMeteors = [];
      this.nextRoundQueue = [];
      this.hallOfFame = [];
      this.bumpers = [];
      this.qIndex = -1;
      this.question = QUESTIONS[0];
      this.phase = 'VOTE';
      this.timer = VOTE_DURATION;
      this.cncProgress = 0;
      this.forgeSlide = 0;
      this.trapdoorAngle = 0;
      this.crusherY = 0;
      this.splitX = 540;
      this.targetSplitX = 540;
      this.forgeTier = 0;
      this.mvp = null;
      this.leaderA = null;
      this.leaderB = null;
      this.winningSide = 'A';
      this.sawAngle = 0;
      this.shake = 0;
      this.banner = null;
      this.round = 0;
      this.lastSpokenCountdown = 6;
      this.startersSpawned = false;
      this.nextRound();
    }

    getChamberBox(side) {
      if (side === 'A') {
        return { left: ARENA_LEFT, right: Math.round(this.splitX - GAP_HALF), top: ARENA_TOP, bottom: ARENA_BOTTOM };
      }
      return { left: Math.round(this.splitX + GAP_HALF), right: ARENA_RIGHT, top: ARENA_TOP, bottom: ARENA_BOTTOM };
    }

    getCrowdScale(side) {
      let count = 0;
      for (let i = 0; i < this.balls.length; i++) {
        if (this.balls[i].side === side) count++;
      }
      if (count <= 8) return 1.0;
      return clamp(Math.pow(8 / count, 0.30), 0.44, 1.0);
    }

    updateBumpers() {
      const boxA = this.getChamberBox('A');
      const boxB = this.getChamberBox('B');
      const cxA = (boxA.left + boxA.right) / 2;
      const cxB = (boxB.left + boxB.right) / 2;
      const spreadA = Math.min(100, (boxA.right - boxA.left) * 0.24);
      const spreadB = Math.min(100, (boxB.right - boxB.left) * 0.24);

      if (this.bumpers.length !== 6) {
        this.bumpers = [
          { side: 'A', x: cxA - spreadA, y: 690, r: 22, hitAt: -999, color: TEAM_A },
          { side: 'A', x: cxA + spreadA, y: 690, r: 22, hitAt: -999, color: TEAM_A },
          { side: 'A', x: cxA,           y: 865, r: 26, hitAt: -999, color: GOLD },
          { side: 'B', x: cxB - spreadB, y: 690, r: 22, hitAt: -999, color: TEAM_B },
          { side: 'B', x: cxB + spreadB, y: 690, r: 22, hitAt: -999, color: TEAM_B },
          { side: 'B', x: cxB,           y: 865, r: 26, hitAt: -999, color: GOLD }
        ];
      } else {
        this.bumpers[0].x = cxA - spreadA;
        this.bumpers[1].x = cxA + spreadA;
        this.bumpers[2].x = cxA;
        this.bumpers[3].x = cxB - spreadB;
        this.bumpers[4].x = cxB + spreadB;
        this.bumpers[5].x = cxB;
      }
    }

    nextRound() {
      this.round++;
      this.qIndex = (this.qIndex + 1 + Math.floor(Math.random() * 3)) % QUESTIONS.length;
      this.question = QUESTIONS[this.qIndex];
      this.phase = 'VOTE';
      this.timer = VOTE_DURATION;
      this.lastSpokenCountdown = 6;
      this.cncProgress = 0;
      this.forgeSlide = 0;
      this.trapdoorAngle = 0;
      this.crusherY = 0;
      this.targetSplitX = 540;
      this.forgeTier = 0;
      this.mvp = null;
      this.leaderA = null;
      this.leaderB = null;
      this.balls = [];
      this.chips = [];
      this.shockwaves = [];
      this.popups = [];
      this.laserBeams = [];
      this.giftMeteors = [];
      this.startersSpawned = false;
      this.updateBumpers();

      this.players.forEach(p => {
        p.side = null;
        p.roundLikes = 0;
        p.roundGifts = 0;
        p.roundScore = 0;
        p.giftTier = 0;
      });

      const aWord = formatSpokenWord(this.question.a);
      const bWord = formatSpokenWord(this.question.b);
      const prompts = [
        'Alright guys, ' + aWord + ', or ' + bWord + '? Drop an A or B in the chat!',
        'New match! Would you pick ' + aWord + ', or ' + bWord + '? Type A or B!',
        'Here we go, ' + aWord + ' versus ' + bWord + '! Which side are you on?'
      ];
      speakTTS(prompts[this.round % prompts.length], false);

      if (this.nextRoundQueue.length > 0) {
        const queued = this.nextRoundQueue.slice(0, 40);
        this.nextRoundQueue = [];
        queued.forEach(item => {
          const p = this.players.get(item.playerId);
          if (p) {
            p.roundScore += 35;
            this.castVote(p, item.side, true);
          }
        });
      }
    }

    addPopup(x, y, text, color, size) {
      if (this.popups.length > 35) this.popups.shift();
      this.popups.push({ x: x, y: y, text: text, color: color || WHITE, size: size || 24, life: 1.0 });
    }

    addShockwave(x, y, maxR, color) {
      if (this.shockwaves.length > 28) this.shockwaves.shift();
      this.shockwaves.push({ x: x, y: y, r: 12, maxR: maxR || 95, color: color || WHITE, life: 1.0 });
    }

    addLaserBeam(fromX, fromY, toX, toY, color, label) {
      if (this.laserBeams.length > 14) this.laserBeams.shift();
      this.laserBeams.push({ fromX: fromX, fromY: fromY, toX: toX, toY: toY, color: color, label: label, life: 1.0 });
    }

    updateChamberLeaders() {
      let bestA = null, maxA = -1;
      let bestB = null, maxB = -1;

      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (b.isStarter || b.isClone) continue;
        const p = this.players.get(b.playerId);
        if (!p) continue;
        if (b.side === 'A' && p.roundScore > maxA) {
          maxA = p.roundScore;
          bestA = p.id;
        } else if (b.side === 'B' && p.roundScore > maxB) {
          maxB = p.roundScore;
          bestB = p.id;
        }
      }

      if (bestA && bestA !== this.leaderA && this.leaderA !== null) {
        const pA = this.players.get(bestA);
        const boxA = this.getChamberBox('A');
        if (pA) {
          this.addPopup((boxA.left + boxA.right) / 2, 515, '👑 ' + pA.name + ' #1!', GOLD, 24);
          playSfx('crown', 'A');
        }
      }
      if (bestB && bestB !== this.leaderB && this.leaderB !== null) {
        const pB = this.players.get(bestB);
        const boxB = this.getChamberBox('B');
        if (pB) {
          this.addPopup((boxB.left + boxB.right) / 2, 515, '👑 ' + pB.name + ' #1!', GOLD, 24);
          playSfx('crown', 'B');
        }
      }

      this.leaderA = bestA;
      this.leaderB = bestB;
    }

    getPlayer(id, userId) {
      const sId = String(id);
      const sUid = userId ? String(userId) : '';
      const key = this.aliases.get(sId) || (sUid && this.aliases.get(sUid)) || sId;
      return this.players.get(key);
    }

    ensurePlayer(e) {
      let p = this.getPlayer(e.id, e.userId);
      if (!p) {
        if (this.players.size >= MAX) {
          const firstKey = this.players.keys().next().value;
          this.players.delete(firstKey);
        }
        p = {
          id: String(e.id),
          name: clean(e.name || e.id),
          avatar: e.avatar || '',
          side: null,
          roundLikes: 0,
          roundGifts: 0,
          roundScore: 0,
          giftTier: 0,
          winStreak: 0,
          lastShareAt: -Infinity
        };
        this.players.set(p.id, p);
      }
      if (e.name) p.name = clean(e.name);
      if (e.avatar) { p.avatar = e.avatar; requestPic(p.avatar); }
      [e.id, e.userId].forEach(alias => {
        if (alias && String(alias) !== p.id && this.aliases.size < MAX * 3) {
          this.aliases.set(String(alias), p.id);
        }
      });
      return p;
    }

    spawnStarterBalls() {
      if (this.startersSpawned || this.phase !== 'VOTE') return;
      this.startersSpawned = true;
      STARTER_PROFILES.forEach(st => {
        const box = this.getChamberBox(st.side);
        const x = (box.left + box.right) / 2 + (Math.random() - 0.5) * 140;
        this.balls.push({
          playerId: st.id,
          name: st.name,
          side: st.side,
          x: x, y: box.top + 45 + Math.random() * 40,
          vx: (Math.random() - 0.5) * 340,
          vy: 140 + Math.random() * 100,
          r: 38, baseR: 38,
          angle: 0, omega: (Math.random() - 0.5) * 5,
          squashX: 1, squashY: 1,
          likeGlowUntil: 0,
          trail: [], giftTier: 0,
          isStarter: true, isClone: false, shredded: false
        });
      });
    }

    removeStarterBalls() {
      for (let i = this.balls.length - 1; i >= 0; i--) {
        if (this.balls[i].isStarter) this.balls.splice(i, 1);
      }
    }

    spawnBall(p, side, bonusRadius, isClone) {
      if (this.balls.length >= 160) return;
      if (!isClone) this.removeStarterBalls();
      const box = this.getChamberBox(side);
      const baseR = clamp((isClone ? 30 : 42) + (bonusRadius || 0), 28, 92);
      const rScaled = baseR * this.getCrowdScale(side);
      const x = box.left + rScaled + 20 + Math.random() * Math.max(20, (box.right - box.left - (rScaled + 20) * 2));
      const y = box.top + 42 + (isClone ? Math.random() * 35 : 0);
      const b = {
        playerId: p.id,
        name: p.name,
        side: side,
        x: x, y: y,
        vx: (Math.random() - 0.5) * 360,
        vy: 140 + Math.random() * 140,
        r: rScaled * 0.5,
        baseR: baseR,
        angle: (Math.random() - 0.5) * 0.6,
        omega: (Math.random() - 0.5) * 6,
        squashX: 1.2,
        squashY: 0.8,
        likeGlowUntil: 0,
        trail: [],
        giftTier: p.giftTier || 0,
        isStarter: false,
        isClone: !!isClone,
        shredded: false
      };
      this.balls.push(b);
      this.addShockwave(x, y, 75, side === 'A' ? TEAM_A : TEAM_B);
      if (!isClone) playSfx('vote', side);
      this.updateChamberLeaders();
    }

    queueForNextRound(p, side) {
      let existing = null;
      for (let i = 0; i < this.nextRoundQueue.length; i++) {
        if (this.nextRoundQueue[i].playerId === p.id) { existing = this.nextRoundQueue[i]; break; }
      }
      if (existing) {
        existing.side = side;
      } else if (this.nextRoundQueue.length < 40) {
        this.nextRoundQueue.push({ playerId: p.id, name: p.name, side: side });
      }
      const fromX = side === 'A' ? 200 : 880;
      this.addLaserBeam(fromX, 1360, 540, 680, side === 'A' ? TEAM_A : TEAM_B, p.name + ' [' + side + ']');
      if (this.phase === 'CNC') {
        this.cncProgress = clamp(this.cncProgress + 0.018, 0, 1);
        this.spawnCNCChips(540 + (Math.random() - 0.5) * 140, 680, 7);
      }
      playSfx('vote', side);
    }

    castVote(p, side, fromQueue) {
      if (this.phase !== 'VOTE') {
        this.queueForNextRound(p, side);
        return;
      }
      let existingBall = null;
      for (let i = 0; i < this.balls.length; i++) {
        if (this.balls[i].playerId === p.id && !this.balls[i].isClone) {
          existingBall = this.balls[i];
          break;
        }
      }
      p.side = side;
      p.roundScore += fromQueue ? 40 : 20;
      if (existingBall) {
        if (existingBall.side !== side) {
          const box = this.getChamberBox(side);
          existingBall.side = side;
          existingBall.x = (box.left + box.right) / 2 + (Math.random() - 0.5) * 90;
          existingBall.y = box.top + 45;
          existingBall.vx = (Math.random() - 0.5) * 300;
          existingBall.vy = 120;
          existingBall.squashX = 1.22;
          existingBall.squashY = 0.78;
        } else {
          existingBall.baseR = Math.min(92, existingBall.baseR + 5);
          existingBall.vy = -620 - Math.random() * 160;
          existingBall.vx += (Math.random() - 0.5) * 340;
          existingBall.omega = (Math.random() - 0.5) * 10;
          existingBall.squashX = 0.78;
          existingBall.squashY = 1.24;
          this.addShockwave(existingBall.x, existingBall.y, 85, side === 'A' ? TEAM_A : TEAM_B);
        }
        playSfx('vote', side);
        this.updateChamberLeaders();
      } else {
        const tierInfo = GIFT_TIERS[p.giftTier || 0];
        this.spawnBall(p, side, tierInfo.ballBonusR, false);
      }
    }

    accept(e) {
      if (!e) return false;
      const now = performance.now();
      if (e.eventId) {
        if (this.seen.has(e.eventId)) return false;
        this.seen.set(e.eventId, now);
        if (this.seen.size > 8000) this.seen.delete(this.seen.keys().next().value);
      }

      const p = this.ensurePlayer(e);

      if (e.type === 'member') {
        if (this.phase === 'VOTE' && !p.side) {
          const countA = this.balls.filter(b => b.side === 'A' && !b.isStarter).length;
          const countB = this.balls.filter(b => b.side === 'B' && !b.isStarter).length;
          this.castVote(p, countA <= countB ? 'A' : 'B', false);
        }
        return true;
      }

      if (e.type === 'chat') {
        const msg = String(e.text || '').trim().toUpperCase();
        const countA = this.balls.filter(b => b.side === 'A' && !b.isStarter).length;
        const countB = this.balls.filter(b => b.side === 'B' && !b.isStarter).length;
        const defaultSide = p.side || (countA <= countB ? 'A' : 'B');
        if (msg === 'A' || msg === '1' || msg.indexOf('A ') === 0 || msg === this.question.a) {
          this.castVote(p, 'A', false);
        } else if (msg === 'B' || msg === '2' || msg.indexOf('B ') === 0 || msg === this.question.b) {
          this.castVote(p, 'B', false);
        } else {
          this.castVote(p, defaultSide, false);
        }
        return true;
      }

      if (e.type === 'like') {
        const count = clamp(e.count || 1, 1, 200);
        p.roundLikes += count;
        p.roundScore += count * 8;
        if (this.phase === 'VOTE') {
          if (!p.side) {
            const countA = this.balls.filter(b => b.side === 'A' && !b.isStarter).length;
            const countB = this.balls.filter(b => b.side === 'B' && !b.isStarter).length;
            this.castVote(p, countA <= countB ? 'A' : 'B', false);
          }
          for (let i = 0; i < this.balls.length; i++) {
            const b = this.balls[i];
            if (b.playerId === p.id && !b.isClone) {
              const tierBonus = GIFT_TIERS[p.giftTier || 0].ballBonusR;
              // Likes visibly inflate the player's ball and trigger a golden supercharge ring
              b.baseR = clamp(42 + tierBonus + Math.pow(p.roundLikes, 0.58) * 5.2, 42, 96);
              b.likeGlowUntil = now + 2200;
              b.vy = -540 - Math.random() * 200;
              b.vx += (Math.random() - 0.5) * 340;
              b.omega = (Math.random() - 0.5) * 12;
              b.squashX = 0.76;
              b.squashY = 1.26;
              this.addShockwave(b.x, b.y, b.r + 52, GOLD);
              this.addPopup(b.x, b.y - b.r, '♥ +' + count, GOLD_HOT, 24);
            }
          }
          this.updateChamberLeaders();
          playSfx('like', p.side || 'A');
        } else if (this.phase === 'CNC') {
          this.cncProgress = clamp(this.cncProgress + count * 0.006, 0, 1);
          this.addLaserBeam(540 + (Math.random() - 0.5) * 500, 1360, 540, 680, GOLD, '♥ ' + p.name);
          playSfx('like', 'A');
        }
        return true;
      }

      if (e.type === 'share' || e.type === 'follow') {
        if (now - p.lastShareAt > 5000) {
          p.lastShareAt = now;
          const countA = this.balls.filter(b => b.side === 'A' && !b.isStarter).length;
          const countB = this.balls.filter(b => b.side === 'B' && !b.isStarter).length;
          const side = p.side || (countA <= countB ? 'A' : 'B');
          p.side = side;
          p.roundScore += 65;
          if (this.phase === 'VOTE') {
            this.spawnBall(p, side, 14, false);
          } else {
            this.queueForNextRound(p, side);
          }
        }
        return true;
      }

      if (e.type === 'gift' || e.type === 'subscribe') {
        const coins = Math.max(1, e.coins || 1);
        const tierInfo = getGiftTierInfo(coins);
        p.roundGifts += coins;
        p.roundScore += coins * tierInfo.scoreMult;
        p.giftTier = Math.max(p.giftTier || 0, tierInfo.tier);
        this.forgeTier = Math.max(this.forgeTier, tierInfo.tier);
        this.shake = 8 + tierInfo.tier * 4;
        playSfx('gift', p.side || 'A', tierInfo.tier);

        const countA = this.balls.filter(b => b.side === 'A' && !b.isStarter).length;
        const countB = this.balls.filter(b => b.side === 'B' && !b.isStarter).length;
        const side = p.side || (countA <= countB ? 'A' : 'B');
        p.side = side;

        const targetBox = this.getChamberBox(side);
        const targetX = (targetBox.left + targetBox.right) / 2;
        if (this.giftMeteors.length < 8) {
          this.giftMeteors.push({
            playerId: p.id,
            name: p.name,
            tier: tierInfo.tier,
            badge: tierInfo.badge,
            coins: coins,
            fromX: 540, fromY: 110,
            toX: this.phase === 'VOTE' ? targetX : 540,
            toY: this.phase === 'VOTE' ? 660 : 690,
            progress: 0
          });
        }

        if (this.phase === 'VOTE') {
          let mainBall = null;
          for (let i = 0; i < this.balls.length; i++) {
            if (this.balls[i].playerId === p.id && !this.balls[i].isClone) { mainBall = this.balls[i]; break; }
          }
          if (!mainBall) {
            this.spawnBall(p, side, tierInfo.ballBonusR, false);
          } else {
            mainBall.giftTier = p.giftTier;
            mainBall.baseR = clamp(42 + tierInfo.ballBonusR + Math.sqrt(p.roundLikes) * 3, 52, 98);
            mainBall.vy = -700;
            mainBall.squashX = 0.72; mainBall.squashY = 1.32;
            this.addShockwave(mainBall.x, mainBall.y, 165, tierInfo.border);
            this.addPopup(mainBall.x, mainBall.y - 45, tierInfo.badge, tierInfo.glow, 28);
          }
          for (let c = 0; c < tierInfo.clones; c++) {
            this.spawnBall(p, side, Math.max(0, tierInfo.ballBonusR - 14), true);
          }
          if (tierInfo.tier >= 2) {
            for (let i = 0; i < this.balls.length; i++) {
              const b = this.balls[i];
              if (b.side === side) {
                b.vy = -420 - Math.random() * 280;
                b.vx += (Math.random() - 0.5) * 380;
              }
            }
          }
          this.updateChamberLeaders();
        } else {
          this.queueForNextRound(p, side);
          this.spawnCNCChips(540, 680, 22);
        }

        this.banner = {
          text: tierInfo.badge + ' · ' + p.name,
          color: tierInfo.glow,
          until: now + 3400
        };
        if (tierInfo.tier >= 2) {
          speakTTS('Huge shoutout to ' + p.name + ' for unlocking the ' + tierInfo.name + ' forge!', false);
        }
        return true;
      }

      return false;
    }

    getCounts() {
      let a = 0, b = 0;
      for (let i = 0; i < this.balls.length; i++) {
        const ball = this.balls[i];
        const tierWeight = (ball.giftTier || 0) * 3;
        const likeWeight = ball.baseR > 54 ? Math.floor((ball.baseR - 40) / 10) : 0;
        const weight = ball.isClone ? 1 : (1 + likeWeight + tierWeight);
        if (ball.side === 'A') a += weight;
        else b += weight;
      }
      return { a: a, b: b, total: a + b };
    }

    startShredPhase() {
      this.phase = 'SHRED';
      this.timer = SHRED_DURATION;
      this.trapdoorAngle = 0;
      this.crusherY = 0;
      const counts = this.getCounts();
      this.winningSide = counts.a >= counts.b ? 'A' : 'B';
      this.shake = 14;
      playSfx('shred');

      this.players.forEach(p => {
        if (p.side === this.winningSide) p.winStreak = (p.winStreak || 0) + 1;
        else if (p.side) p.winStreak = 0;
      });

      const winners = this.balls
        .filter(b => b.side === this.winningSide && !b.isStarter && !b.isClone)
        .map(b => this.players.get(b.playerId))
        .filter(Boolean);

      if (winners.length > 0) {
        winners.sort((x, y) => y.roundScore - x.roundScore);
        this.mvp = winners[0];
        this.forgeTier = Math.max(this.forgeTier, this.mvp.giftTier || 0);
      } else {
        this.mvp = {
          id: 'mvp_default',
          name: this.winningSide === 'A' ? this.question.a : this.question.b,
          avatar: '',
          side: this.winningSide,
          roundScore: 100,
          winStreak: 1,
          giftTier: this.forgeTier
        };
      }

      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (b.side === this.winningSide) {
          b.vy = -450 - Math.random() * 220;
          b.vx = (Math.random() - 0.5) * 300;
        }
      }
    }

    startCNCPhase() {
      this.phase = 'CNC';
      this.timer = CNC_DURATION;
      this.cncProgress = 0;
      this.forgeSlide = 0;
      this.shake = 8;
      playSfx('vote', this.winningSide);
      if (this.mvp) {
        const winWord = formatSpokenWord(this.winningSide === 'A' ? this.question.a : this.question.b);
        speakTTS(winWord + ' takes the win! Engraving the medallion for ' + this.mvp.name + '.', false);
      }
    }

    startShowcasePhase() {
      this.phase = 'SHOWCASE';
      this.timer = SHOW_DURATION;
      this.cncProgress = 1;
      this.shake = 10;
      playSfx('win');
      for (let i = 0; i < 5; i++) {
        this.spawnCNCChips(320 + i * 95, 660, 12);
      }
      if (this.mvp) {
        this.hallOfFame.unshift({
          id: this.mvp.id,
          name: this.mvp.name,
          avatar: this.mvp.avatar,
          side: this.winningSide,
          tier: this.forgeTier,
          streak: this.mvp.winStreak || 1
        });
        if (this.hallOfFame.length > 5) this.hallOfFame.pop();
      }
    }

    spawnCNCChips(x, y, count, customCol) {
      if (this.chips.length > 240) return;
      const tierInfo = GIFT_TIERS[this.forgeTier || 0];
      const n = count || 4;
      for (let i = 0; i < n; i++) {
        const isSpark = Math.random() < 0.68;
        this.chips.push({
          x: x + (Math.random() - 0.5) * 18,
          y: y + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 720,
          vy: -200 - Math.random() * 540,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 20,
          life: 1.0,
          isSpark: isSpark,
          color: customCol || (isSpark ? tierInfo.spark1 : tierInfo.spark2)
        });
      }
    }

    tick(dt) {
      this.sawAngle += dt * 16;
      this.shake = Math.max(0, this.shake - dt * 26);

      // Smooth Dynamic Squeeze: dominant side physically pushes the center wall!
      const counts = this.getCounts();
      const ratioA = counts.total > 0 ? clamp(counts.a / counts.total, 0.22, 0.78) : 0.5;
      if (this.phase === 'VOTE') {
        this.targetSplitX = lerp(310, 770, ratioA);
      } else if (this.phase === 'SHRED') {
        this.targetSplitX = this.winningSide === 'A' ? 670 : 410;
      } else {
        this.targetSplitX = 540;
      }
      this.splitX += (this.targetSplitX - this.splitX) * Math.min(1, dt * 4.5);
      this.updateBumpers();

      if (this.phase === 'VOTE') {
        this.timer -= dt;

        if (this.timer < VOTE_DURATION - 1.8 && !this.startersSpawned && this.balls.length === 0) {
          this.spawnStarterBalls();
        }

        const secLeft = Math.ceil(this.timer);
        if (secLeft <= 5 && secLeft >= 1 && secLeft < this.lastSpokenCountdown) {
          this.lastSpokenCountdown = secLeft;
          speakTTS(String(secLeft), true);
        }

        if (this.timer <= 8 && Math.random() < dt * 3.8 && this.balls.length > 0) {
          const b = this.balls[Math.floor(Math.random() * this.balls.length)];
          if (b.y > ARENA_BOTTOM - 180) {
            b.vy = -380 - Math.random() * 180;
            b.vx += (Math.random() - 0.5) * 220;
            b.squashX = 0.85; b.squashY = 1.16;
          }
        }
        if (this.timer <= 0) this.startShredPhase();
      } else if (this.phase === 'SHRED') {
        this.timer -= dt;
        this.trapdoorAngle = clamp(this.trapdoorAngle + dt * 3.2, 0, 1);
        this.crusherY = clamp(this.crusherY + dt * 0.72, 0, 1);
        if (this.timer <= 0) this.startCNCPhase();
      } else if (this.phase === 'CNC') {
        this.forgeSlide = clamp(this.forgeSlide + dt * 3.5, 0, 1);
        if (this.forgeSlide >= 0.85) {
          const speedMult = GIFT_TIERS[this.forgeTier || 0].speedMult;
          this.cncProgress += (dt / CNC_DURATION) * speedMult;
          if (this.cncProgress >= 1) this.startShowcasePhase();
        }
      } else if (this.phase === 'SHOWCASE') {
        this.forgeSlide = 1;
        this.timer -= dt;
        if (this.timer <= 0) this.nextRound();
      }

      const loseSide = this.winningSide === 'A' ? 'B' : 'A';
      const scaleA = this.getCrowdScale('A');
      const scaleB = this.getCrowdScale('B');
      const now = performance.now();

      for (let i = this.balls.length - 1; i >= 0; i--) {
        const b = this.balls[i];
        const cScale = b.side === 'A' ? scaleA : scaleB;
        const desiredR = clamp(b.baseR * cScale, 20, 92);
        b.r += (desiredR - b.r) * Math.min(1, dt * 7);
        b.squashX += (1 - b.squashX) * Math.min(1, dt * 12);
        b.squashY += (1 - b.squashY) * Math.min(1, dt * 12);

        if (Math.hypot(b.vx, b.vy) > 250) {
          b.trail.push({ x: b.x, y: b.y, r: b.r * 0.85 });
          if (b.trail.length > 5) b.trail.shift();
        } else if (b.trail.length > 0) {
          b.trail.shift();
        }

        b.vy += 1720 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.angle += b.omega * dt;
        b.vx *= Math.pow(0.993, dt * 60);
        b.vy *= Math.pow(0.995, dt * 60);
        b.omega *= Math.pow(0.98, dt * 60);

        const box = this.getChamberBox(b.side);

        if (b.x < box.left + b.r + 10) {
          b.x = box.left + b.r + 10;
          if (b.vx < -120) { b.squashX = 0.80; b.squashY = 1.20; playSfx('bounce', b.side); }
          b.vx = Math.abs(b.vx) * 0.74;
          b.omega = b.vy * 0.011;
        }
        if (b.x > box.right - b.r - 10) {
          b.x = box.right - b.r - 10;
          if (b.vx > 120) { b.squashX = 0.80; b.squashY = 1.20; playSfx('bounce', b.side); }
          b.vx = -Math.abs(b.vx) * 0.74;
          b.omega = -b.vy * 0.011;
        }

        for (let k = 0; k < this.bumpers.length; k++) {
          const bmp = this.bumpers[k];
          if (bmp.side !== b.side) continue;
          const dx = b.x - bmp.x;
          const dy = b.y - bmp.y;
          const dist = Math.hypot(dx, dy);
          const minD = b.r + bmp.r;
          if (dist < minD && dist > 0.001) {
            const nx = dx / dist;
            const ny = dy / dist;
            b.x = bmp.x + nx * (minD + 1);
            b.y = bmp.y + ny * (minD + 1);
            const speed = Math.max(350, Math.hypot(b.vx, b.vy) * 0.90);
            b.vx = nx * speed + (Math.random() - 0.5) * 80;
            b.vy = ny * speed;
            b.omega = (Math.random() - 0.5) * 12;
            b.squashX = 1.24;
            b.squashY = 0.76;
            bmp.hitAt = now;
            this.addShockwave(bmp.x, bmp.y, bmp.r + 40, bmp.color);
            playSfx('bumper', b.side);
          }
        }

        const floorClosed = this.phase === 'VOTE' || b.side === this.winningSide;
        if (floorClosed) {
          if (b.y > box.bottom - b.r - 10) {
            b.y = box.bottom - b.r - 10;
            if (b.vy > 160) {
              b.squashX = clamp(1 + b.vy / 2300, 1.05, 1.30);
              b.squashY = clamp(1 - b.vy / 2700, 0.72, 0.95);
              if (b.vy > 280) playSfx('bounce', b.side);
            }
            b.vy = -Math.abs(b.vy) * 0.68;
            if (Math.abs(b.vy) < 55) b.vy = 0;
            b.omega = b.vx * 0.016;
          }
        } else {
          // Hydraulic press pushes losing balls down into the plasma shredder
          const pressBottomY = lerp(box.top + 80, box.bottom - 35, this.crusherY);
          if (b.y - b.r < pressBottomY) {
            b.y = pressBottomY + b.r;
            b.vy = Math.max(b.vy, 560);
            b.squashX = 1.32;
            b.squashY = 0.68;
          }
          if (!b.shredded && b.y >= box.bottom - 12) {
            b.shredded = true;
            this.shake = Math.max(this.shake, 9);
            const burstCol = loseSide === 'A' ? TEAM_A : TEAM_B;
            this.spawnCNCChips(b.x, box.bottom + 8, 18, burstCol);
            this.addShockwave(b.x, box.bottom + 8, 110, burstCol);
            playSfx('cnc', loseSide);
            this.balls.splice(i, 1);
            continue;
          }
        }
      }

      // Multi-pass elastic ball-to-ball collision
      for (let pass = 0; pass < 4; pass++) {
        for (let i = 0; i < this.balls.length; i++) {
          const b1 = this.balls[i];
          for (let j = i + 1; j < this.balls.length; j++) {
            const b2 = this.balls[j];
            if (b1.side !== b2.side) continue;
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const d2 = dx * dx + dy * dy;
            const minD = b1.r + b2.r + 2;
            if (d2 >= minD * minD) continue;
            const d = Math.sqrt(d2) || 0.01;
            const nx = dx / d;
            const ny = dy / d;
            const overlap = (minD - d) * 0.52;
            b1.x -= nx * overlap; b1.y -= ny * overlap;
            b2.x += nx * overlap; b2.y += ny * overlap;

            const rvx = b2.vx - b1.vx;
            const rvy = b2.vy - b1.vy;
            const velAlongNormal = rvx * nx + rvy * ny;
            if (velAlongNormal < 0) {
              const restitution = pass === 0 ? 0.64 : 0.34;
              const imp = -(1 + restitution) * velAlongNormal * 0.5;
              b1.vx -= nx * imp; b1.vy -= ny * imp;
              b2.vx += nx * imp; b2.vy += ny * imp;

              if (pass === 0 && Math.abs(velAlongNormal) > 220) {
                b1.squashX = 1.14; b1.squashY = 0.87;
                b2.squashX = 1.14; b2.squashY = 0.87;
              }
            }
          }
        }
      }

      for (let i = this.chips.length - 1; i >= 0; i--) {
        const ch = this.chips[i];
        ch.vy += 1720 * dt;
        ch.x += ch.vx * dt;
        ch.y += ch.vy * dt;
        ch.rot += ch.vrot * dt;
        ch.life -= dt * 1.55;
        if (ch.life <= 0) this.chips.splice(i, 1);
      }

      for (let i = this.shockwaves.length - 1; i >= 0; i--) {
        const sw = this.shockwaves[i];
        sw.r = lerp(sw.r, sw.maxR, dt * 10);
        sw.life -= dt * 2.6;
        if (sw.life <= 0) this.shockwaves.splice(i, 1);
      }

      for (let i = this.popups.length - 1; i >= 0; i--) {
        const pp = this.popups[i];
        pp.y -= 65 * dt;
        pp.life -= dt * 1.4;
        if (pp.life <= 0) this.popups.splice(i, 1);
      }

      for (let i = this.laserBeams.length - 1; i >= 0; i--) {
        const lb = this.laserBeams[i];
        lb.life -= dt * 2.4;
        if (lb.life <= 0) this.laserBeams.splice(i, 1);
      }

      for (let i = this.giftMeteors.length - 1; i >= 0; i--) {
        const gm = this.giftMeteors[i];
        gm.progress += dt * 2.2;
        if (gm.progress >= 1) {
          this.addShockwave(gm.toX, gm.toY, 155, GIFT_TIERS[gm.tier].glow);
          this.spawnCNCChips(gm.toX, gm.toY, 16);
          this.giftMeteors.splice(i, 1);
        }
      }
    }
  }

  const canvas = $('arena');
  const ctx = canvas.getContext('2d', { alpha: false });
  let darkPreview = false;
  const game = new TrophyForgeGame();

  function roundPath(x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function gradPanel(x, y, w, h, r, cTop, cBot, borderCol, lineW) {
    roundPath(x, y, w, h, r);
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, cTop);
    g.addColorStop(1, cBot);
    ctx.fillStyle = g;
    ctx.fill();
    if (lineW > 0 && borderCol) {
      ctx.lineWidth = lineW;
      ctx.strokeStyle = borderCol;
      ctx.stroke();
    }
  }

  function drawText(str, x, y, size, color, align, maxW, outlineCol) {
    const col = color || WHITE;
    const al = align || 'center';
    const mw = maxW || 950;
    ctx.font = '900 ' + size + 'px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = al;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(5, Math.round(size * 0.20));
    ctx.strokeStyle = outlineCol || OUTLINE;
    let text = String(str);
    while (text.length > 1 && ctx.measureText(text).width > mw) text = text.slice(0, -1);
    ctx.strokeText(text, x, y);
    ctx.fillStyle = col;
    ctx.fillText(text, x, y);
  }

  function drawPlasmaSaw(cx, cy, r, angle, accentCol) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.beginPath();
    const teeth = 14;
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i * Math.PI) / teeth;
      const rad = i % 2 === 0 ? r : r * 0.68;
      if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
    g.addColorStop(0, WHITE);
    g.addColorStop(0.5, accentCol);
    g.addColorStop(1, DARK_SLATE);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();
    ctx.restore();
  }

  function drawBumperPeg(bmp, now) {
    const age = now - bmp.hitAt;
    const pulse = age < 220 ? (1 + (1 - age / 220) * 0.35) : 1;
    const r = bmp.r * pulse;

    ctx.save();
    ctx.translate(bmp.x, bmp.y);
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
    ctx.fillStyle = OUTLINE;
    ctx.fill();

    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.25, 2, 0, 0, r);
    g.addColorStop(0, WHITE);
    g.addColorStop(0.55, age < 220 ? GOLD_HOT : bmp.color);
    g.addColorStop(1, DARK_SLATE);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  function drawVoterBall(b, now) {
    const p = game.players.get(b.playerId) || { id: b.playerId, name: b.name, side: b.side, winStreak: 0, giftTier: 0, roundLikes: 0 };
    const img = getPlayerImage(p);
    const gTier = b.giftTier || p.giftTier || 0;
    const tierInfo = GIFT_TIERS[gTier];
    const isLeader = !b.isClone && !b.isStarter && ((b.side === 'A' && game.leaderA === b.playerId) || (b.side === 'B' && game.leaderB === b.playerId));
    const isLiked = now < (b.likeGlowUntil || 0) || (p.roundLikes >= 10);

    const col = gTier > 0 ? tierInfo.border : (b.side === 'A' ? TEAM_A : TEAM_B);
    const glowCol = gTier > 0 ? tierInfo.glow : (b.side === 'A' ? TEAM_A_GLOW : TEAM_B_GLOW);

    for (let i = 0; i < b.trail.length; i++) {
      const tr = b.trail[i];
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, tr.r * ((i + 1) / (b.trail.length + 1)) * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
    }

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.squashX, b.squashY);

    // Supercharged Like Aura or Leader Aura
    if (isLeader || gTier >= 2 || isLiked) {
      const auraR = b.r + 8 + Math.sin(now * 0.016) * 3.5;
      ctx.beginPath();
      ctx.arc(0, 0, auraR, 0, Math.PI * 2);
      ctx.lineWidth = isLeader ? 5 : 4;
      ctx.strokeStyle = isLeader ? GOLD : (gTier >= 2 ? tierInfo.glow : GOLD_HOT);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, 0, b.r + 4, 0, Math.PI * 2);
    ctx.fillStyle = OUTLINE;
    ctx.fill();

    ctx.save();
    ctx.rotate(b.angle);
    ctx.beginPath();
    ctx.arc(0, 0, b.r - 2.5, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, -b.r + 2.5, -b.r + 2.5, (b.r - 2.5) * 2, (b.r - 2.5) * 2);
    ctx.restore();

    const shine = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.38, b.r * 0.06, 0, 0, b.r);
    shine.addColorStop(0, 'rgba(255,255,255,0.60)');
    shine.addColorStop(0.35, 'rgba(255,255,255,0.10)');
    shine.addColorStop(0.75, 'rgba(0,0,0,0)');
    shine.addColorStop(1, 'rgba(9,13,22,0.50)');
    ctx.beginPath();
    ctx.arc(0, 0, b.r - 2, 0, Math.PI * 2);
    ctx.fillStyle = shine;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, b.r - 1, 0, Math.PI * 2);
    ctx.lineWidth = (gTier > 0 || isLiked) ? 6 : 4.5;
    ctx.strokeStyle = isLiked && gTier === 0 ? GOLD : col;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, b.r - 4, -Math.PI * 0.75, -Math.PI * 0.15);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = glowCol;
    ctx.stroke();

    ctx.restore();

    if (isLeader && game.phase === 'VOTE') {
      const bob = Math.sin(now * 0.012) * 4;
      drawText('👑 #1', b.x, b.y - b.r * b.squashY - 16 + bob, 22, GOLD, 'center', 140);
    }

    if (!b.isClone) {
      const streakStr = (p.winStreak && p.winStreak >= 2) ? (' 🔥' + p.winStreak) : '';
      drawText(b.name + streakStr, b.x, b.y + b.r * b.squashY + 14, 17, (gTier > 0 || isLiked) ? GOLD_HOT : WHITE, 'center', Math.max(95, b.r * 2.9));
    }
  }

  function drawChamber(side) {

    }

    ctx.save();
    ctx.lineCap = 'round';

    ctx.beginPath();

    ctx.lineWidth = 7; ctx.strokeStyle = isLosingShred ? GOLD : glow; ctx.stroke();

  function drawCNCForgeModal(now) {
    if (game.phase !== 'CNC' && game.phase !== 'SHOWCASE') return;
    const mvp = game.mvp;
    if (!mvp) return;

    const tierInfo = GIFT_TIERS[game.forgeTier || 0];
    const s = clamp(game.forgeSlide, 0, 1);
    const ease = 1 - Math.pow(1 - s, 3);
    const scale = 0.85 + 0.15 * ease;

    ctx.save();
    ctx.translate(540, 910);
    ctx.scale(scale, scale);
    ctx.translate(-540, -910);

    const px = 130, py = 385, pw = 820, ph = 1010;

    gradPanel(px - 14, py - 14, pw + 28, ph + 28, 34, tierInfo.coinOuter, OUTLINE, OUTLINE, 8);
    gradPanel(px, py, pw, ph, 26, tierInfo.bgTop, tierInfo.bgBot, tierInfo.border, 5);

    drawText(
      tierInfo.badge + ' MEDALLION FORGE',
      540, py + 48, 35, tierInfo.glow, 'center', pw - 50
    );

    const coinCX = 540, coinCY = py + 310, coinR = 225;

    ctx.save();
    ctx.translate(coinCX, coinCY);
    ctx.beginPath();
    const ridges = 36;
    for (let i = 0; i < ridges * 2; i++) {
      const a = (i * Math.PI) / ridges;
      const r = i % 2 === 0 ? coinR + 11 : coinR + 2;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = tierInfo.coinOuter;
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();

    const blankGrad = ctx.createRadialGradient(-60, -60, 20, 0, 0, coinR);
    blankGrad.addColorStop(0, tierInfo.coinOuter);
    blankGrad.addColorStop(1, tierInfo.coinInner);
    ctx.beginPath();
    ctx.arc(0, 0, coinR - 6, 0, Math.PI * 2);
    ctx.fillStyle = blankGrad;
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = tierInfo.border;
    ctx.stroke();
    ctx.restore();

    const portraitR = coinR - 24;
    const artX = coinCX - portraitR;
    const artY = coinCY - portraitR;
    const artSize = portraitR * 2;
    const engravedCanvas = buildEngravedPortrait(mvp, game.forgeTier);
    const revealH = Math.floor(artSize * clamp(game.cncProgress, 0, 1));

    if (revealH > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(coinCX, coinCY, portraitR, 0, Math.PI * 2);
      ctx.clip();

      ctx.beginPath();
      ctx.rect(artX, artY, artSize, revealH);
      ctx.clip();

      ctx.drawImage(engravedCanvas, artX, artY, artSize, artSize);

      if (game.phase === 'SHOWCASE') {
        const sweepX = ((now * 0.48) % (artSize * 2.4)) - artSize * 0.7;
        const shineGrad = ctx.createLinearGradient(artX + sweepX, artY, artX + sweepX + 130, artY + 130);
        shineGrad.addColorStop(0, 'rgba(255,255,255,0)');
        shineGrad.addColorStop(0.5, 'rgba(255,255,255,0.52)');
        shineGrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = shineGrad;
        ctx.fillRect(artX, artY, artSize, artSize);
      }
      ctx.restore();

      if (game.phase === 'CNC') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(coinCX, coinCY, portraitR, 0, Math.PI * 2);
        ctx.clip();
        const hotGrad = ctx.createLinearGradient(artX, artY + revealH - 12, artX, artY + revealH + 6);
        hotGrad.addColorStop(0, 'rgba(255,120,0,0)');
        hotGrad.addColorStop(0.65, tierInfo.spark1);
        hotGrad.addColorStop(1, WHITE);
        ctx.fillStyle = hotGrad;
        ctx.fillRect(artX, artY + revealH - 12, artSize, 16);
        ctx.restore();
      }
    }

    ctx.beginPath();
    ctx.arc(coinCX, coinCY, portraitR, 0, Math.PI * 2);
    ctx.lineWidth = 6;
    ctx.strokeStyle = tierInfo.glow;
    ctx.stroke();

    if (game.phase === 'CNC' && ease > 0.8) {
      const rows = 26;
      const rowFloat = game.cncProgress * rows;
      const rowIndex = Math.floor(rowFloat);
      const rowFrac = rowFloat - rowIndex;
      const dy = (artY + revealH) - coinCY;
      const chordHalfW = Math.sqrt(Math.max(1600, portraitR * portraitR - dy * dy));
      const toolX = coinCX + (rowIndex % 2 === 0 ? (rowFrac * 2 - 1) * chordHalfW : (1 - rowFrac * 2) * chordHalfW);
      const toolY = artY + revealH;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(px + 24, py + 95);
      ctx.lineTo(toolX, toolY);
      ctx.moveTo(px + pw - 24, py + 95);
      ctx.lineTo(toolX, toolY);
      if (tierInfo.lasers >= 4) {
        ctx.moveTo(px + 24, py + 480);
        ctx.lineTo(toolX, toolY);
        ctx.moveTo(px + pw - 24, py + 480);
        ctx.lineTo(toolX, toolY);
      }
      ctx.lineWidth = 8;
      ctx.strokeStyle = tierInfo.border;
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.strokeStyle = WHITE;
      ctx.stroke();
      ctx.restore();

      gradPanel(px + 16, toolY - 72, pw - 32, 24, 8, '#475569', '#1e293b', OUTLINE, 4);
      gradPanel(toolX - 38, toolY - 126, 76, 78, 14, '#334155', '#0f172a', tierInfo.border, 4);

      const flareR = 15 + Math.sin(now * 0.08) * 4;
      const flare = ctx.createRadialGradient(toolX, toolY, 2, toolX, toolY, flareR * 2);
      flare.addColorStop(0, WHITE);
      flare.addColorStop(0.45, tierInfo.spark1);
      flare.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.beginPath();
      ctx.arc(toolX, toolY, flareR * 2, 0, Math.PI * 2);
      ctx.fillStyle = flare;
      ctx.fill();

      game.spawnCNCChips(toolX, toolY, 3);
      playSfx('cnc');

    // Clean MVP Winner Card
    gradPanel(px + 48, py + 565, pw - 96, 175, 22, '#0f172a', '#090d16', tierInfo.border, 4);
    const streakBadge = (mvp.winStreak && mvp.winStreak >= 2) ? ('  ·  🔥 ' + mvp.winStreak + 'x STREAK') : '';
    drawText('👑 #1 MVP CHAMPION' + streakBadge, 540, py + 606, 23, GOLD, 'center', pw - 120);
    drawText(mvp.name, 540, py + 662, 50, WHITE, 'center', pw - 120);

    const pct = Math.round(game.cncProgress * 100);
    drawText(
      game.phase === 'CNC' ? ('FORGING MEDALLION: ' + pct + '%') : '★ MEDALLION READY! ★',
      540, py + 714, 21, tierInfo.glow, 'center', pw - 120
    );

    gradPanel(px + 48, py + 765, pw - 96, 34, 17, '#090d16', '#1e293b', tierInfo.border, 3);
    const fillW = Math.max(18, (pw - 108) * clamp(game.cncProgress, 0, 1));
    gradPanel(px + 54, py + 770, fillW, 24, 12, tierInfo.glow, tierInfo.border, null, 0);

    // Next Round Queue Strip
    gradPanel(px + 48, py + 820, pw - 96, 155, 20, '#0f172a', '#090d16', GOLD, 3);
    drawText('NEXT ROUND QUEUE — TYPE A OR B NOW', 540, py + 852, 20, GOLD, 'center', pw - 120);

    if (game.nextRoundQueue.length === 0) {
      drawText('Type A or B in chat for an instant head start!', 540, py + 918, 20, '#94a3b8', 'center', pw - 120);
    } else {
      const visibleQueue = game.nextRoundQueue.slice(-7);
      const startX = 540 - ((visibleQueue.length - 1) * 96) / 2;
      for (let i = 0; i < visibleQueue.length; i++) {
        const q = visibleQueue[i];
        const qp = game.players.get(q.playerId) || { id: q.playerId, name: q.name, side: q.side };
        const qx = startX + i * 96;
        const qy = py + 912;
        const qImg = getPlayerImage(qp);
        ctx.save();
        ctx.beginPath(); ctx.arc(qx, qy, 25, 0, Math.PI * 2);
        ctx.fillStyle = OUTLINE; ctx.fill();
        ctx.clip();
        ctx.drawImage(qImg, qx - 25, qy - 25, 50, 50);
        ctx.restore();
        ctx.beginPath(); ctx.arc(qx, qy, 25, 0, Math.PI * 2);
        ctx.lineWidth = 3.5; ctx.strokeStyle = q.side === 'A' ? TEAM_A : TEAM_B; ctx.stroke();
        drawText(q.name, qx, qy + 38, 14, WHITE, 'center', 88);
      }
    }

    ctx.restore();
  }

  function render(now) {
    ctx.fillStyle = darkPreview ? '#090d16' : GREEN;
    ctx.fillRect(0, 0, 1080, 1920);

    ctx.save();
    if (game.shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
    }

    const counts = game.getCounts();
    const pctA = counts.total ? Math.round((counts.a / counts.total) * 100) : 50;
    const pctB = counts.total ? 100 - pctA : 50;

    drawTopBarAndHeaders(pctA, pctB, now);
    drawChamber('A');
    drawChamber('B');

    for (let i = 0; i < game.bumpers.length; i++) {
      drawBumperPeg(game.bumpers[i], now);
    }

    for (let i = 0; i < game.shockwaves.length; i++) {
      const sw = game.shockwaves[i];
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(2, 6 * sw.life);
      ctx.strokeStyle = sw.color;
      ctx.stroke();
    }

    for (let i = 0; i < game.balls.length; i++) {
      drawVoterBall(game.balls[i], now);
    }

    drawCNCForgeModal(now);

    for (let i = 0; i < game.laserBeams.length; i++) {
      const lb = game.laserBeams[i];
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(lb.fromX, lb.fromY);
      ctx.lineTo(lb.toX, lb.toY);
      ctx.lineWidth = 9 * lb.life;
      ctx.strokeStyle = lb.color;
      ctx.stroke();
      ctx.lineWidth = 3.5 * lb.life;
      ctx.strokeStyle = WHITE;
      ctx.stroke();
      drawText(lb.label, lb.fromX, lb.fromY - 24, 21, lb.color, 'center', 280);
      ctx.restore();
    }

    for (let i = 0; i < game.giftMeteors.length; i++) {
      const gm = game.giftMeteors[i];
      const gt = GIFT_TIERS[gm.tier || 1];
      const u = clamp(gm.progress, 0, 1);
      const mx = lerp(gm.fromX, gm.toX, u);
      const my = lerp(gm.fromY, gm.toY, u * u);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(lerp(gm.fromX, mx, 0.45), lerp(gm.fromY, my, 0.45));
      ctx.lineTo(mx, my);
      ctx.lineWidth = 14;
      ctx.strokeStyle = gt.border;
      ctx.stroke();
      ctx.lineWidth = 5;
      ctx.strokeStyle = WHITE;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mx, my, 28, 0, Math.PI * 2);
      ctx.fillStyle = gt.glow;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = OUTLINE;
      ctx.stroke();
      drawText(gm.badge + ' · ' + gm.name, mx, my - 42, 23, gt.glow, 'center', 320);
      ctx.restore();
    }

    for (let i = 0; i < game.chips.length; i++) {
      const ch = game.chips[i];
      ctx.save();
      ctx.translate(ch.x, ch.y);
      ctx.rotate(ch.rot);
      if (ch.isSpark) {
        roundPath(-5, -5, 10, 10, 5);
        ctx.fillStyle = ch.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = OUTLINE;
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 1.4);
        ctx.lineWidth = 6;
        ctx.strokeStyle = OUTLINE;
        ctx.stroke();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = ch.color;
        ctx.stroke();
      }
      ctx.restore();
    }

    for (let i = 0; i < game.popups.length; i++) {
      const pp = game.popups[i];
      drawText(pp.text, pp.x, pp.y, pp.size, pp.color, 'center', 340);
    }

    if (game.banner && now < game.banner.until) {
      gradPanel(160, 1475, 760, 58, 18, '#1e293b', '#090d16', game.banner.color, 4);
      drawText(game.banner.text, 540, 1504, 26, game.banner.color, 'center', 720);
    }

    ctx.restore();
  }

  const urlInput = $('url');
  const statusEl = $('status');
  let mode = 'live', ws = null, connected = false, retry = 0, attempt = 0, closed = false;
  let packets = 0, accepted = 0, invalid = 0;

  function connect() {
    clearTimeout(retry);
    try {
      if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); }
    } catch (e) {}
    connected = false;
    let target;
    try {
      target = new URL(urlInput.value);
      if (target.protocol !== 'ws:' && target.protocol !== 'wss:') return;
    } catch (e) { return; }

    try {
      ws = new WebSocket(target.href);
      const current = ws;
      const handshake = setTimeout(() => {
        try { if (current.readyState === WebSocket.CONNECTING) current.close(); } catch (e) {}
      }, 12000);
      ws.onopen = () => { clearTimeout(handshake); connected = true; attempt = 0; };
      ws.onmessage = e => {
        if (typeof e.data !== 'string' || e.data.length > 200000) { invalid++; return; }
        try {
          packets++;
          const evt = packet(JSON.parse(e.data));
          if (!evt) return;
          if (evt.type === 'streamend') { game.nextRound(); return; }
          if (mode === 'live' && game.accept(evt)) accepted++;
        } catch (err) { invalid++; }
      };
      ws.onerror = () => {};
      ws.onclose = () => {
        clearTimeout(handshake);
        connected = false;
        if (!closed) retry = setTimeout(connect, Math.min(30000, 1500 * Math.pow(2, Math.min(attempt++, 5))));
      };
    } catch (e) {
      if (!closed) retry = setTimeout(connect, 30000);
    }
  }

  let lastTime = performance.now(), acc = 0, fpsCount = 0, fps = 60, fpsAt = lastTime;
  const STEP = 1 / 60;

  function loop(t) {
    try {
      const dt = clamp((t - lastTime) / 1000, 0, 0.1);
      lastTime = t;
      acc += dt;
      let steps = 0;
      while (acc >= STEP && steps++ < 4) {
        game.tick(STEP);
        acc -= STEP;
      }
      if (steps >= 4) acc = 0;
      render(t);
      fpsCount++;
      if (t - fpsAt >= 1000) {
        fps = Math.round((fpsCount * 1000) / (t - fpsAt));
        fpsAt = t;
        fpsCount = 0;
        if (panelEl.style.display === 'block') {
          statusEl.textContent = (connected ? 'SOCKET OPEN' : 'SOCKET OFF') + ' · Mode: ' + mode.toUpperCase() + ' · Phase: ' + game.phase + ' · Tier: T' + game.forgeTier + ' · Balls: ' + game.balls.length + ' · SplitX: ' + Math.round(game.splitX) + ' · ' + fps + ' FPS';
        }
      }
    } catch (err) {
      if (errBox) {
        errBox.style.display = 'block';
        errBox.textContent = 'LOOP ERR: ' + (err.message || err);
      }
    }
    requestAnimationFrame(loop);
  }

  let testSeq = 1;
  const TEST_NAMES = ['alex_99', 'mia.vibes', 'lucas_gg', 'emma.xo', 'noah_7', 'chloe.tt', 'leo_king', 'zoe.star', 'max_pro', 'lily.lu', 'sam_live', 'ruby_x'];

  function spawnTestVoter(side) {
    const id = 'tester_' + (testSeq++);
    const name = TEST_NAMES[testSeq % TEST_NAMES.length];
    game.accept({ type: 'chat', id: id, name: name, text: side, eventId: 'test:' + performance.now() + ':' + Math.random() });
  }

  function triggerTestGift(coins) {
    const humanList = Array.from(game.players.values());
    const p = humanList[humanList.length - 1] || { id: 'vip_you', name: 'max_pro' };
    game.accept({ type: 'gift', id: p.id, name: p.name, coins: coins, eventId: 'tgift:' + performance.now() + ':' + Math.random() });
  }

  $('toggle').onclick = () => { panelEl.style.display = 'none'; };
  $('dark').onclick = () => { darkPreview = !darkPreview; };
  $('sfx').onclick = toggleSound;
  $('ttsBtn').onclick = () => {
    ttsEnabled = !ttsEnabled;
    updateSoundUI();
    if (ttsEnabled) speakTTS('Voice commentary is on.', true);
  };
  $('audioTest').onclick = testSound;
  $('volume').oninput = e => setSoundLevel(Number(e.target.value) / 100);
  $('connect').onclick = connect;

  $('test').onclick = () => { mode = 'test'; spawnTestVoter('A'); spawnTestVoter('B'); };
  $('live').onclick = () => { mode = 'live'; game.nextRound(); };
  $('voteA').onclick = () => spawnTestVoter('A');
  $('voteB').onclick = () => spawnTestVoter('B');
  $('heart').onclick = () => {
    const list = Array.from(game.players.values());
    const p = list[list.length - 1] || { id: 'you', name: 'alex_99' };
    game.accept({ type: 'like', id: p.id, name: p.name, count: 15 });
  };
  $('gift1').onclick = () => triggerTestGift(1);
  $('gift2').onclick = () => triggerTestGift(25);
  $('gift3').onclick = () => triggerTestGift(150);
  $('gift4').onclick = () => triggerTestGift(600);

  $('crowd').onclick = () => {
    for (let i = 0; i < 30; i++) spawnTestVoter(i % 3 === 0 ? 'A' : 'B');
  };
  $('skipPhase').onclick = () => {
    if (game.phase === 'VOTE') game.startShredPhase();
    else if (game.phase === 'SHRED') game.startCNCPhase();
    else if (game.phase === 'CNC') game.startShowcasePhase();
    else game.nextRound();
  };

  ['click', 'pointerdown', 'keydown', 'mousemove', 'touchstart'].forEach(evtName => {
    window.addEventListener(evtName, () => {
      if (sound && (!audioCtx || audioCtx.state !== 'running')) unlockAudio(true);
    }, { passive: true });
  });

  window.addEventListener('dblclick', () => togglePanel());

  window.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k = String(e.key || '').toLowerCase();
    if (k === 'h') togglePanel();
    else if (k === 'a') $('voteA').click();
    else if (k === 'b') $('voteB').click();
    else if (k === ' ') { e.preventDefault(); $('heart').click(); }
    else if (k === '1') $('gift1').click();
    else if (k === '2') $('gift2').click();
    else if (k === '3') $('gift3').click();
    else if (k === 'g') $('gift4').click();
    else if (k === 'n') $('skipPhase').click();
  });

  window.addEventListener('beforeunload', () => { closed = true; clearTimeout(retry); try { if (ws) ws.close(); } catch (e) {} });

  render(performance.now());
  unlockAudio(false);
  updateSoundUI();
  connect();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
