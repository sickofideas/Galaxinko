    if(t-fpsAt>=1000){fps=frameCount*1000/(t-fpsAt);fpsAt=t;frameCount=0;}
    if(!panel.hidden)status.textContent=(connected?'TikFinity OK':'TikFinity OFF')+' · '+mode+' · '+battle.players.size+'/'+MAX+' · '+Math.round(fps)+' FPS · frame '+workMs.toFixed(1)+'ms · queued '+(priority.length+ordinary.length+likes.size)+' · dropped '+dropped+' · invalid '+invalid;
    requestAnimationFrame(loop);
  }
  $('toggle').onclick=()=>panel.hidden=true;
  $('test').onclick=()=>{newBattle('test');battle.join({id:'you',name:'YOU'},false,0);panel.hidden=true;};
  $('live').onclick=()=>{if(mode==='test')newBattle(connected?'live':'demo');panel.hidden=true;};
  $('join').onclick=()=>{if(mode==='test')battle.accept({type:'member',id:'guest'+Math.floor(performance.now()),name:'NEW PILOT'},performance.now());};
  $('heart').onclick=()=>{if(mode==='test')battle.accept({type:'like',id:'you',name:'YOU',count:12},performance.now());};
  $('gift').onclick=()=>{if(mode==='test')battle.accept({type:'gift',id:'you',name:'YOU',coins:100},performance.now());};
  $('crowd').onclick=()=>{if(mode==='test'){for(let k=0;k<4;k++)battle.players.delete('practice:'+k);for(let i=0;i<499;i++)battle.join({id:'test:'+i,name:'PILOT '+i},false,i%2);}};
  $('connect').onclick=connect;
  $('dark').onclick=()=>{dark=!dark;};
  document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const key=e.key.toLowerCase();if(key==='h')panel.hidden=!panel.hidden;if(mode==='test'){if(e.key===' '){e.preventDefault();$('heart').click();}if(key==='j')$('join').click();if(key==='g')$('gift').click();}});
  window.addEventListener('beforeunload',()=>{closed=true;clearTimeout(retry);ws?.close();});
  window.Wars={version:VERSION,snapshot:()=>({mode,phase:battle.phase,round:battle.round,durationMs:battle.duration,players:battle.players.size,humans:battle.humanCount(),active:battle.activePlayers.size,hp:[...battle.hp],maxHp:battle.maxHp,damage:[...battle.damage],wins:[...battle.wins],blocks:battle.stats.blocks,remainingMs:Math.max(0,battle.end-battle.t),projectiles:battle.projectiles.length,queued:priority.length+ordinary.length+likes.size,connected,members,dropped,invalid,fps,renderMs,workMs,portraits:[...pics.values()].filter(v=>v.state==='ready').length,cores:battle.cores.map(o=>({x:o.x,y:o.y}))}),player:id=>{const p=battle.get(id);return p?{name:p.name,team:p.team,energy:p.energy,points:p.points,roundPoints:p.roundPoints,avatar:!!pics.get(p.avatar)?.img,x:p.x,y:p.y}:null;},positions:()=>[...battle.players.values()].map(p=>({id:p.id,team:p.team,bot:p.bot,x:p.x,y:p.y})),inject:e=>{if(mode==='test')battle.accept(e,performance.now());},nextRound:()=>{if(mode==='test')battle.start(performance.now());}};
  newBattle('demo');connect();requestAnimationFrame(loop);
})();
</script></body></html>
